  /* $94AE -- the head of $8537's routine, which is where a level ENDS, by
     either route.  It is not part of the exit walk; the exit walk is what it
     falls through to.

       $94B4  LD A,($842B) / AND (IY-$34) / RLA / JR nc,$94D6
       $94D1  SET 7,(IY-2)          <-- $847D bit 7
       $8556  BIT 7,(IY-2) / JR z,$8503 / RET     <-- the MAIN LOOP ITSELF

     so the level ends when BOTH players' $842B bit 7 is set -- bit 7 being
     "finished or dead", set by $93EE's OR $C3 on death and by $9550 at the
     end of the exit dissolve.  In a one-player game player 2's $844B is $C0
     in the captured state, so player 1's bit alone ends it.  Which of the two
     endings it is, is decided by the caller off $8434/$8454 bit 7 (DEAD):
     both dead -> $B3B9 GAME OVER and the high-score entry, otherwise the next
     dungeon loads.  MEASURED end to end: health poked to $0000, the death is
     marked on the pass after, and the pass AFTER THAT the main loop returns
     at $855C and $B39B spins into $B3B9 (`python tools/deathgate.py seq`).

     There is no life counter anywhere in this game -- health IS the life --
     and a dead player in a TWO-player game can rejoin with FIRE ($944C BIT
     4,(IX+7)), which resets his health to BCD 2000 and CLEARS his score
     ($946E..$9488).  ALL OF IT IS PORTED -- joinOne() runs $9440..$948C for
     each player in turn, health back to BCD 2000, score cleared, and $9484's
     $FF into the shot's X.  This line used to end "not ported: player 2 does
     not exist here", from before he did.
     A quirk worth recording from that path: $9484 is LD (IX+$10),$FF, which
     writes $FF to the shot's X coordinate.  The shot's STATE is (IX+$12).
     The rejoin therefore does not free the shot it meant to free.
     One more line of $94AE that matters now that the engine has 307
     dungeons: $94BD BIT 6,(IY-1) / JR nz,$94D1 -- IN A TREASURE ROOM $8403
     IS NOT UPDATED AT ALL, and $94C3 otherwise takes the unsigned MAX of the
     two players' (IX+12).  MEASURED by calling $94AE with the two bytes
     poked: (5,3) -> 5, (3,5) -> 5, (9,9) -> 9, and (5,3) with $847E bit 6
     leaves $8403 at the $77 it was poked with. */
  levelEnd(){
    const [p1, p2] = this.players;
    /* $94AE BIT 3,(IY-2) -- the treasure clock's forced ending jumps
       straight to $94D1 and skips the level bump entirely. */
    if (!this.forcedOver){
      if (!((p1.f11 & p2.f11) & F_DEAD)) return false;   // $94B4 AND / RLA
      if (!this.treasure){                               // $94BD BIT 6,(IY-1)
        /* $94C3 -- $8403 becomes the UNSIGNED MAX of the two players' own
           (IX+12).  Two players can take different exits ($36 +1, $37 -> 4,
           $38 -> 8) and the DEEPER one decides the next dungeon.  Measured
           by poking the pair: (5,3) -> 5, (3,5) -> 5, (9,9) -> 9. */
        this.level = p1.levelOwn >= p2.levelOwn ? p1.levelOwn : p2.levelOwn;
      }
    }
    this.levelDone = true;                               // $94D1 SET 7,(IY-2)
    /* $B3AB LD A,($8434) / AND (IY-$2B) / RLA -- GAME OVER only when BOTH
       players are dead.  In a one-player game player 2's $8454 ships $80, so
       player 1's death alone is "both". */
    this.gameOver = p1.dead && p2.dead;
    return true;
  }

  /* $855C RET -> $B391's caller, i.e. what happens when the main loop stops.
       $B394  BIT 6,(IY-2) / JP nz,$B3B6 = JP $0000    DEAD CODE: $847D bit 6
              is SET NOWHERE in the image (22 (IY-2) bit sites enumerated)
       $B39B  INC (IY+$12) / CALL $B6DA / loop while ($842B|$844B) & $3F
              -- ~4 iterations, 0.07 frames, just flushing the HUD dirty bits
       $B3AB  LD A,($8434) / AND (IY-$2B) / RLA / JR c,$B3B9
              BOTH players DEAD -> the game-over chain; anything else falls
              into JR $B381, which is DI / CALL $B3D0 / ... / CALL $8503, the
              NEXT DUNGEON.
     So a level that ends by the exit goes straight into the next level, and
     one that ends by death goes to the name entry.  In a one-player game
     "both dead" is just "he is dead", because player 2's $844B is already
     $C0 in the captured state.                                             */
  levelOver(){
    if (this.dead){                                      // $B3AB
      this.enterGameOver();
    } else {
      /* $B3AB JR $B381.  $94AE has already written $8403 (the max of the two
         players' (IX+12), or nothing at all in a treasure room), so the level
         number is decided before we get here. */
      this.startLevel(this.level);
    }
  }

  onePass(input){
    /* $8556 BIT 7,(IY-2) / JR z,$8503 / RET -- once $847D bit 7 is set the
       main loop RETURNS and the level is over, and $B39B's caller decides
       which of the two endings it is.  levelOver() is called from advance()
       rather than here so that one pass is still one pass. */
    if (this.levelDone) return;
    /* the panel came up on the pass that raised it and stayed on screen for
       the blocking pause; this pass takes it down again. */
    this.bannerShow = null;
    /* $8B27's screen, raised at level start and taken down the way the banner
       is -- by the next pass, after the LONG pause has been drawn through. */
    this.introShow = null;
    this.pass++;
    /* what THIS pass costs in video frames, and how many frame interrupts it
       gets.  Both are now MODELLED -- quantise() sets them near the bottom of
       the pass, once the pass's own census is known, because the original's
       cost IS the work it did.  They are seeded here at the nominal four so
       that anything that reads them mid-pass (nothing does, but a future
       caller might) sees a sane value rather than the previous pass's. */
    this.clockReset();
    this.passFrames = FRAMES_PER_PASS;
    this.passTicks = FRAMES_PER_PASS;
    /* $9CFB INC -- once per pass, from $8550 near the BOTTOM of the loop, so
       the player's move and the actor loop in the same pass see one value. */
    this.passCtr = (this.passCtr + 1) & 0xFF;
    /* $847E bit 2 gates the actor walk cycle ($ACCE BIT 2,(IY-1)) and it is
       FRAME-clocked, not pass-clocked:
         $ABCE  LD (IY+$1A),7        the actor pass reloads $8499 with SEVEN
         $A2DA  LD A,($8499) / OR A / JR z,$A2E6      the frame interrupt
         $A2E0  DEC A / LD ($8499),A / JR nz          counts it down, and
         $A2E6  SET 1,(IY-1)         sets bit 1 when it reaches zero
         $ABC0  BIT 1 / $ABC6 RES 1 / $ABCA SET 2     the actor pass consumes
                                                      bit 1 into bit 2
       Seven interrupts at about four a pass is "every other pass" -- and it
       SLIPS by one wherever a pass costs five frames, which is exactly what
       measurement shows ($8499 reads 00,03,00,03... and then 04).  This file
       used to write `!(passCtr & 1)`, which is that pattern without the slip;
       the slip is visible as an actor whose walk phase is $40 out against the
       original's, and the two-player join scenario is where it first showed.
       The counter is stepped in soundTicks(), the engine's frame interrupt. */
    this.animTick = false;
    /* WHERE IN THE PASS WE ARE, in VIDEO FRAMES from the loop top $8503, and
       it is a MEASUREMENT of the original's own call offsets, not a guess.
       T-stamped over 20 passes holding DOWN on the real Z80
       (`python tools/beepgate.py where`):
           $8506 doorPass   0.002..0.050   $850C camera   0.096..0.141
           $8509 the moves  0.005..0.052   $851E actors   0.723..0.990
           $8521 draw       1.117..1.354   $8543 banner   1.606..1.933
       Only the BEEPER uses it, and only to decide how much of the blit is
       still ahead of a noise trigger -- which is what makes an id-0 armed by
       the player's own move a 9.8 ms tick and the same id armed by the actor
       update an 85 ms one.  It is inert on the AY branch. */
    this.passPhase = 0.0;
    /* the SIMULATED VIDEO FRAME this pass began on.  Every beeper edge is
       stamped relative to it, because a chirp's edges are 82..1102 T apart
       and the bridge needs sub-frame resolution to place them. */
    this.beepBase = this.simFrame;
    this.tileSparkle();                 // $8503 CALL $A31A -- before the door
    this.doorPass();                    // $8506 CALL $95AB -- BEFORE the move

    /* $8509 CALL $A38A.  Its first act is $9432, which reads BOTH key sets
       and then runs the join/rejoin test for each player in turn; the two
       moves follow, in an order $A39B decides. */
    this.passPhase = 0.03;
    this.readKeys(input);               // $9432 -> $855D, both players
    this.joinPass();                    // $9435..$943F -> $9440 twice
    /* THE COST OF $A38A is dominated by whether a move is ATTEMPTED at all:
       a held direction runs the map probes and $A5F0's linear walk of the
       actor list, and a pass with no key held does not.  Taken from the key
       state, not the position delta, because a player walking into a wall
       has still paid for the probe. */
    this.clk.moving = this.players.some(q => q.inGame && (q.dir & 15)) ? 1 : 0;
    /* DID A PLAYER ACTUALLY MOVE THIS PASS?  Only the beeper's noise wants
       it, and only to pick which of the two MEASURED blitter tick curves to
       place its samples on: a walking pass issues its first $B8CC 0.06 of a
       video frame later than a standing one and stays that far behind for
       the first half of the blit (`python tools/beepgate.py ticks`).  Taken
       as a position delta across $A39B rather than from the key state,
       because a player walking into a wall does not move. */
    const wasAt = this.players.map(q => (q.x << 8) | q.y);
    this.playerPass();                  // $A39B..$A3D9 -> $A4DD twice
    this.beepWalked = this.players.some((q, i) =>
                        ((q.x << 8) | q.y) !== wasAt[i]);
    /* $A3DC LD HL,$5BD0 / LD ($84AD),HL / $A3E2 LD (IY+$2D),0 -- the pad
       census is emptied HERE, after BOTH moves and before the draws, which is
       exactly why $B195 (which runs inside a move) reads the PREVIOUS pass's
       draw and never its own. */
    this.padCensusReset();              // $A3DC
    this.cameraTarget();                // $A3E6 -- the midpoint, into $848D
    this.passPhase = 0.12;
    this.camera();                      // $850C CALL $B58C
    /* ONLINE: the per-player windows step HERE, beside the module camera.
       The module pair keeps running online because it is the pass-cost
       model's clock (the painter census indexes off it, and cost feeds
       passTicks feeds $8497, the drain's clock) -- freeze it and the two
       modes' clocks drift apart on any pass whose cost differs below the
       cap.  Every generalized RULE reads the windows, never it; with one
       player the two are value-identical, which is the degeneracy the
       suite checks by digest. */
    if (this.online) this.vcamPass();
    /* the four painters' cell census, taken AFTER $B58C has stepped the
       camera -- $850F..$8518 read $848B/$848C as $850C left them, and taking
       the pass-top camera instead silently costs the model ten points. */
    this.clockCensusMap();
    /* $850F/$8512/$8515/$8518 -- the four map painters.  The only part of the
       blit this engine simulates is the one that is a RULE and not a picture:
       every $30 cell they paint is appended to the census by $9F74's
       `CP $30 / CALL z,$B159` and the eight `CALL $B156` sites. */
    this.padCensusDraw();               // $850F..$8518 -> $B156
    /* $851B CALL $A3E6 a second time.  Idempotent -- measured, both writes
       agree on 20/20 passes -- and kept because it is what runs. */
    this.cameraTarget();
    this.passPhase = 0.86;
    this.actorPass();                        // $851E CALL $AB94
    this.passPhase = 1.24;
    this.drawBookkeeping();                  // $8521 CALL $A43B
    /* $B8CC, ONE NOISE SAMPLE PER DRAWN OBJECT, six call sites inside the
       blitter -- serviced here because this is where the original's blit
       has finished ($8521 at 1.12..1.35 frames, and the last tick of the
       pass at 1.13..1.36).  `beepDrawn` is this engine's own drawn-object
       census against the original's measured 233..255 a pass. */
    if (this.sound.noiseService){
      this.sound.rampCalls = this.sound.rampTogs = 0;
      this.sound.noiseService(this.beepBase, this.beepDrawn(),
                              this.beepWalked);
      /* $B8CC pays 28 T more per call and 39 T more again when it toggles,
         for as long as the ramp is live.  Those are the pass's own T-states
         and they belong in W1. */
      this.clk.noiseCalls = this.sound.rampCalls|0;
      this.clk.noiseTogs = this.sound.rampTogs|0;
    }
    this.potionScore();                      // $8524 $8BCA's HEAD, ONCE
    for (const q of this.players){           // $8C05 $8C43: $8430 then $8450
      const save = this.p; this.p = q; this.shotPass(); this.p = save;
    }
    this.ringDrain();                        // $8C08 CALL $8FC5
    this.monsterShotPass();                  // $8C0B..$8C42
    this.treasureTick();                     // $8527 BIT 6 / CALL nz,$8ADA
    /* $8497 is the ISR's VIDEO FRAME counter and the drain at $852E reads it
       part-way through the pass, not at the top.  MEASURED by hooking both
       $8503 and $B6DA over 80 passes: ($8497 at $B6DA) - ($8497 at $8503)
       is 1 on 79 of 79 samples -- a pass is four frames but only one frame
       boundary has been crossed by the time the drain runs, the rest of the
       wait being the HALTs around it.  So the engine advances ONE frame
       here and the remaining three at the bottom.  Getting this wrong puts
       the drain tick one whole pass early or late, which is invisible in a
       one-player position table and immediately visible in a two-player one
       that prints health.
       RE-MEASURED under the variable clock, 200 passes over five scenes:
       the split is 1 on 172 and 0 on 28, and it is 1 on 83 of the 90
       FIVE-frame passes as well -- the second W1 boundary lands after $852E.
       So ONE here and (passTicks - 1) at the bottom stays right. */
    this.frameCtr = (this.frameCtr + 1) & 0xFF;
    /* A TEST HOOK, and the only one in the pass: tools/p2gate.py can hand
       the engine the original's own $8497 sequence, measured at $B6DA, so
       that the two-player differential compares the RULES and not this
       engine's flat four-frames-a-pass approximation of the video clock.
       Absent (the shipped case) it does nothing at all. */
    if (this.clockOverride && this.clockOverride.length)
      this.frameCtr = this.clockOverride.shift() & 0xFF;
    /* THE SOUND CLOCK follows the same split, because it is the same clock:
       $BADB is called from the ISR, so one frame boundary crossed by $852E
       means one AY tick has already run.  MEASURED tick offsets inside an
       ordinary pass, in frames from the loop top $8503: 0.78, 1.78, 3.43,
       3.78 -- three hardware interrupts plus $9CF8's own hand CALL $A29F,
       with the interrupt that would have fallen at 2.78 suppressed by the
       DI at $9CD8.  Every measured trigger fires at 0.09..0.68, i.e. before
       the first tick, so an effect armed in a pass starts on that pass's
       first tick, which is what this ordering gives. */
    this.soundTicks(Math.min(1, this.passTicks));
    this.hudPass();                          // $852E CALL $B6DA
    this.hurryPass();                        // $8531 CALL $971B
    /* $8537 CALL $94AE.  Its HEAD ends the level; the exit walk at $94E1 is
       what it falls through to when nobody has finished, and it is run for
       BOTH players ($94D6/$94DA/$94DD, a fall-through pair). */
    if (!this.levelEnd())
      for (const q of this.players){
        const save = this.p; this.p = q; this.exitWalk(); this.p = save;
      }
    this.offScreenCull();                    // $853A CALL $B0FE
    this.generatorSweep();                   // $853D CALL $A9C2
    for (const q of this.players){           // $8540 $93C2: $8420 then $8440
      const save = this.p; this.p = q; this.deathPass(); this.p = save;
    }
    /* PROVISIONAL, and now known to be a MEAN rather than a constant: the
       phase at which $8543/$891C is entered varies 1.580..1.932 frames from
       the loop top over 75 armed passes on the real Z80 (idle passes cluster
       1.737..1.87).  This engine charges the one figure.  It matters only to
       a sound trigger armed inside the banner pass, of which there is one --
       $894B's silence on the AY branch. */
    this.passPhase = 1.77;
    this.bannerPass();                       // $8543 CALL $891C
    /* $8546 LD A,($84A1) / OR A / JR z,$8550 / DEC A / LD ($84A1),A -- the
       potion countdown, and it is inline in the main loop rather than in a
       subsystem.  When it reaches zero the sweep DISARMS: $847E bit 3 is what
       $AC07 tests per actor, so five passes is exactly how long a thrown
       potion keeps killing.  Cleared here rather than in throwPotion() so a
       second throw cannot start until the first has finished, which is what
       $A51E's own "($84A1) must be 0" guard is for. */
    if (this.potionT !== 0){                 // $8546 / $8549
      this.potionT--;                        // $854C / $854D
    }
    /* ==== $8546/$8550: WHAT THIS PASS COST ==========================
       The census is complete, so charge it.  quantise() runs the identity
       cost = ceil((t + W1)/FRAME_T)*FRAME_T + W2 - t and sets passFrames
       (real video frames, which advance() debits against the accumulator)
       and passTicks (whole frames = the $8497 delta, which is the interrupt
       count).  Everything after this point is the original's own tail. */
    this.quantise(this.clockCost());
    /* A TEST HOOK, retained: tools/soundgate.py and tools/beepgate.py can
       hand the engine the original's own per-pass frame count so that a
       differential tests the DRIVER and not the cost model.  The gates now
       print the substituted and the unhelped run side by side; with the
       model shipped the two agree. */
    if (this.tickOverride && this.tickOverride.length)
      this.passTicks = this.tickOverride.shift();
    /* the rest of the pass's frame interrupts.  $8497 counts HANDLER
       INVOCATIONS -- boundaries inside W1, the HALT wake, $9CF8's hand call
       and the one $B4FF takes -- which is exactly passTicks. */
    this.frameCtr = (this.frameCtr + this.passTicks - 1) & 0xFF;
    this.soundTicks(this.passTicks - 1);
    /* $8550 CALL $9CD7 -- HALT / DI / CALL $B8FB / three screen copies, and
       the TAIL ($9D01) is the pause.  ON THE 48K BRANCH $9CD9 IS THE ONLY
       CALLER OF THE TONE TICK, so one step of an arpeggio is one MAIN-LOOP
       PASS, not one video frame -- the single most important difference
       between the two drivers' clocks.  It runs AFTER the HALT, at a
       measured 1.800..1.935 frames from the loop top on a four-frame pass,
       which is what BEEP_TONE_AT is. */
    if (this.sound.toneTick)
      this.sound.toneTick(this.beepBase, this.passTicks);
    this.blockingPause();
    /* flush this pass's speaker edges in FRAME order, adding the ISR's own
       once-a-frame border write (which is what pulls the speaker back low
       after an odd-length noise burst) */
    if (this.sound.endPass) this.sound.endPass(this.beepBase, this.passTicks);
  }

  /* ONE VIDEO FRAME of the AY driver, n times ($A2A5 CALL $BADB inside the
     IM2 handler).  `passTicks` is FRAMES_PER_PASS in the shipped engine and
     is set once per pass from tools/soundgate.py's measured count of the
     original's own ticks, so that the register differential tests the driver
     and not this engine's flat frame clock -- the same substitution
     p2gate.py makes for $8497, and declared the same way.
     ON THE 48K BRANCH $BADB IS A RET ($BF21 patches it), so THE ISR DOES NO
     SOUND WORK AT ALL and this only advances the simulated frame the bridge
     stamps events with. */
  /* $A2A0 -- THE FRAME INTERRUPT, and the BORDER is set from it:
       $A2A2  INC (IY+$18)          the frame counter
       $A2A5  CALL $BADB            the sound tick -- this is soundTicks()
       $A2A8  SUB A                 border BLACK
       $A2A9  BIT 3,(IY-1) / JR z   ...unless the POTION SWEEP IS ARMED
       $A2AF  LD A,7                ...in which case WHITE
       $A2B1  CALL $B4F9            LD ($84CA),A / OUT ($FE),A
     So the white flash a potion makes is not an effect drawn anywhere: it is
     the SPECTRUM BORDER, held white for exactly as long as $847E bit 3 is up,
     which is the remainder of the throwing pass.  MEASURED: OUT ($FE) at
     $B4FC carries 7 on the throw passes and 0 on every other pass, and never
     7 at all when the player has no potions (`python tools/potiongate.py
     flash` prints the per-pass border on both sides).
     The port had NO BORDER, which is why the flash was missing -- so this
     models the register rather than special-casing the potion.  $925B is the
     other caller of $B4F9 and is NOT ported; nothing else has been seen to
     move the border in play.
     PHASE, declared: the original re-evaluates this on every frame interrupt,
     so on the throwing pass the first ~0.03 of a pass is still black and on
     the next pass the first ~0.03 is still white.  This engine evaluates it
     per tick from the same flag, which puts both transitions at the pass top
     instead -- at most one frame either way, and invisible at 4 frames a
     pass. */
  soundTicks(n){
    for (let i=0;i<n;i++){ if (this.sound.tick) this.sound.tick();
                           this.border = this.potionArmed ? 7 : 0;  // $A2A9
                           /* $A2DA..$A2E6 -- the animation countdown */
                           if (this.animCtr === 0) this.animPend = true;
                           else { this.animCtr = (this.animCtr - 1) & 0xFF;
                                  if (this.animCtr === 0) this.animPend = true; }
                           this.simFrame++; }
  }

  /* $891C -- THE MESSAGE BANNER, and it is the thing that arms the pause.
       $891C  BIT 6,(IY-1) ... SET 6,(IY+$3A)     the treasure PAY-OUT
       $8935  LD A,($84B9) / OR A / RET z         nothing to say
       $8943  BIT 7,A / JR nz,$898B               "POISONED FOOD" (the thief)
       $8947  AND $3F / JR nz,$8964               one of the six item messages
       $894B  CALL $BA01                          the pay-out SILENCES the AY
       $8996  SET 2,(IY-2) / LD (IY+$3A),0        arm the pause, clear the code
     $84B9 is written at exactly two sites, $A7B3 (an inventory item, with
     the item's own bit) and $A6F6 (the thief, bit 7), plus $8931's bit 6.
     THE BANNER TEXT IS DRAWN.  $8A28's panel and its strings are extracted
     by `python tools/bannerart.py` and painted from bannerShow; all eight
     message panels are compared pixel for pixel by `python
     tools/bannergate.py`.  The note here used to say none of it was drawn
     and that only the state change and the pause were ported. */
  bannerPass(){
    /* $891C -- THE TREASURE-ROOM PAY-OUT, raised here and nowhere else:
         $891C  BIT 6,(IY-1) / JR z      a treasure room, or nothing to pay
         $8922  BIT 7,(IY-2) / JR z      and only once the LEVEL IS OVER
         $8928  LD A,($8434) / AND (IY-$2B) / RLA / JR c
                                         both players out of the game -> skip
         $8931  SET 6,(IY+$3A)           $84B9 bit 6, the pay-out message
       The timer running out is what ends a treasure room ($8B22 SET 7), so
       this fires on the pass after it expires -- or on the pass the player
       reaches the exit, which is the same flag. */
    if (this.treasure && this.levelDone &&
        !((this.players[0].p14 & this.players[1].p14) & 0x80))
      this.bannerCode |= 0x40;                           // $8931 SET 6
    if (this.bannerCode === 0) return;                   // $8935 OR A / RET z
    /* $894B -- and the pay-out is a SCORE, not just a panel.  $899F, once per
       player block:
         $899F  BIT 7,(IX+$14) / RET nz    not in the game, nothing to pay
         $89A4  LD A,(IX+12)               the chests he picked up
         $89A8  BIT 6,(IX+11) / JR nz      ...but only if he is EXITING;
         $89AE  SUB A                      otherwise ZERO -- miss the exit and
                                           the whole room counts for nothing
         $89B0  LD D,A / LD E,0 / CALL $B807   score += A00 in BCD, i.e. x100
       The panel's own "00`100 BONUS" line is drawn from the same two values
       (see the render), so the number shown and the number paid cannot drift.
       $8943/$8947 route only a BARE $40 here: bit 7 is the thief and bits
       0..5 are the six item messages. */
    if (this.bannerCode === 0x40){                       // $8943 / $8947 / $894B
      for (const q of this.players){
        if (q.p14 & 0x80) continue;                      // $899F BIT 7 / RET nz
        const v = (q.f11 & F_EXITING) ? q.levelOwn : 0;  // $89A4 / $89A8 / $89AE
        /* AND KEEP IT.  $89D4 patches the panel's digits here, at BUILD time.
           The port used to recompute them in the renderer, which runs after
           advance() has already called levelOver() -> startLevel() -- and
           that resets (IX+12) and clears (IX+11) bit 6, so the panel read 00
           however many chests had been banked.  Measured: 5 before
           levelOver(), 0 after. */
        q.bannerBonus = v;                               // $89D4..$89E8
        const save = this.p; this.p = q;
        this.scoreAdd((v << 8) & 0xFFFF);                // $89B0..$89B3
        this.p = save;
      }
    }
    /* THE ONE BIG ONE-OFF.  $891C's text render ($8A28) costs 52,727 T on
       the pass that raises a banner against 77 T on every other -- 0.754
       video frames, which is what takes that pass from four frames to five.
       MEASURED IN SITU on beepgate's own scenario 1, pass 34 (W1 142,505 T
       against 70,899..89,003 on the other 39). */
    this.clk.banner = 1;
    /* $894B CALL $BA01 -- and on the 48K branch $BA01 IS PATCHED TO A RET,
       so NOTHING SILENCES THE BEEPER.  An effect in flight survives the
       pay-out, a level change, a death and a game over.  That is measured
       and it is a real behavioural difference between the two drivers, not
       an omission here. */
    if (SOUND_MODE !== SOUND_48K &&
        (this.bannerCode & 0x3F) === 0 && !(this.bannerCode & 0x80))
      this.sound.silence();
    this.bannerShow = this.bannerCode;                   // $893B CALL $8A28
    this.pauseReq = true;                                // $8996 SET 2
    this.bannerCode = 0;                                 // $899A
  }

  /* $9D01..$9D3A -- THE ONE PLACE THE GAME BLOCKS, and it is not the sound
     dispatcher.  Reached at the bottom of every pass through $8550 CALL
     $9CD7:

       $9D01  BIT 2,(IY-2) / RET z          nothing armed -> ordinary pass
       $9D06  RES 2,(IY-2)
       $9D0A  LD A,($FFFD) / OR A / JR nz   THE SOUND MODE, read again here
       $9D10  (48K)  BIT 5 -> JP nz,$B8B5 : JP $B8B0   two blocking beeper tunes
       $9D1A  (AY)   BIT 5 -> B=$82 and NO effect
       $9D22         else  LD A,$10 / CALL $BA2B / B=$32
       $9D2D  PUSH BC / CALL $9432 / HALT / HALT / POP BC / DJNZ

     So on the AY machine this is 50 or 130 iterations of TWO HALTs -- 100 or
     260 video frames in which the main loop is stopped and only the ISR (and
     therefore the sound) runs.  MEASURED THREE WAYS by me on the real Z80:
     the routine in isolation costs 100.07 frames (bit 5 clear, 50 iterations,
     one $BA2B) and 259.07 (bit 5 set, 130 iterations, no $BA2B); a $19
     planted in the player's path makes that pass cost 104.82 frames against
     an ordinary 3.97; and a T-STATE histogram of that pass puts 90.4% of it
     in the two HALTs at $9D31/$9D32 and 0.36 frames in the attribute filler
     at $A2F8 -- so neither $BA2B (0.011 frames) nor $A2F8 is the stall, and
     both of those attributions in the earlier notes are wrong.

     ON THE 48K BRANCH IT IS A DIFFERENT ROUTINE ENTIRELY, and this is the
     largest single behavioural difference between the two branches.  $9D0E
     JR nz is not taken, so $9D1A..$9D34 -- the DJNZ, the id-$10 fanfare and
     the two HALTs -- NEVER RUN.  Control falls to $9D10 BIT 5 and JPs into a
     blocking TUNE.  MEASURED, both branches, from build/state_48k.pkl and
     its AY twin (`python tools/beepgate.py pause`):

       isolated at $9D01, bit 5 clear   48K  72.07 frames, $8497 +0
                                        AY   99.08 frames, $8497 +100
       isolated at $9D01, bit 5 set     48K 209.98 frames, $8497 +0
                                        AY  259.08 frames, $8497 +4
       in situ, a $19 planted in the path, the banner PASS costs
                                        48K  76.02 frames, $8497 +4
                                        AY  103.82 frames, $8497 +104

     TWO THINGS THE PORT HAD WRONG AND THIS FIXES.  The wall cost is 72, not
     100.  And the tune runs with INTERRUPTS DISABLED, so the game's own
     video-frame counter $8497 does NOT advance through it: on a 48K the
     health drain and the hurry-up simply stop for 1.44 seconds, where on a
     128K they take 104 frames' worth of steps.  Id $10 is one of the seven
     SILENT ids on this branch in any case, and $9D24 is not even reached.

     THE LONG FORM ($9D10 BIT 5, the level-intro tune).  Bit 5 is set at
     $8B84 inside the level-intro panel $8B27, which IS now modelled --
     introShow / the intro asset, gated by `python tools/introgate.py` over
     sixteen variants.  The note here used to say the panel was not modelled
     and that this cost was provision for the day it was.                  */

  /* ====================================================================
     THE PASS COST MODEL.  See the CLK block at the top of the file for the
     mechanism, the provenance of every constant and the declared gaps.
     ====================================================================
     clockReset()  empties the census at the top of a pass
     clockCensus*  the per-site counters, filled where the site runs
     clockCost()   the census -> W1 in T-states
     quantise()    W1 -> passFrames / passTicks, and carries the phase    */
  clockReset(){
    this.clk = {
      nzA:0, nzB:0, nzC:0, nzD:0, n30:0,      // $9EFC/$9FC2/$A08B/$A159
      bx:0, by:0,
      nact:0, clipX:0, clipY:0, upd:0,        // $AB94 through $A1DA's clips
      step:0, contact:0,                      // $ADF8 / $AEA0
      nact2:0,                                // $B0FE's own count
      gcells:0, ngen:0, spawn:0,              // $A9C2
      drain:0, banner:0, moving:0,            // $B6DA / $891C / $A38A
      noiseCalls:0, noiseTogs:0,              // $B8CC with a live ramp
    };
  }
  /* $850F..$8518.  The four painters walk exactly the cells padCensusDraw()
     walks; this counts the NON-EMPTY ones, which is what each of them pays
     the 16x16 blit for ($9F6C LD A,(HL) / OR A / JR z skips an empty cell for
     156 T and draws it for 807).  Called unconditionally -- padCensusDraw()
     returns early unless a player is armed, and the blit does not. */
  clockCensusMap(){
    const k = this.clk;
    const cx0 = (this.camX >> 2) & (MAP_W-1), cy0 = (this.camY >> 2) & (MAP_H-1);
    const c0 = (this.camX & 2) ? 1 : 0, r0 = (this.camY & 2) ? 1 : 0;
    k.bx = c0; k.by = r0;
    const at = (dc, dr) =>
      this.map[(cy0 + dr) & (MAP_H-1)][(cx0 + dc) & (MAP_W-1)];
    for (let dr=r0; dr<10; dr++) for (let dc=c0; dc<16; dc++){
      const v = at(dc, dr);
      if (v){ k.nzA++; if (v === 0x30) k.n30++; }        // $9F74 CP $30
    }
    if (this.camY & 2)                                   // $9FC5 AND 2 / RET z
      for (let dc=c0; dc<16; dc++){
        if (at(dc, 0)) k.nzB++;                          // $9FEC the top edge
        if (at(dc, 10)) k.nzB++;                         // $A054 the bottom
      }
    if (this.camX & 2)                                   // $A08E AND 2 / RET z
      for (let dr=r0; dr<10; dr++){
        if (at(0, dr)) k.nzC++;                          // $A0AC the left edge
        if (at(16, dr)) k.nzC++;                         // $A115 the right
      }
    if ((this.camX & 2) && (this.camY & 2))              // $A159 needs both
      for (const [dc,dr] of [[0,0],[16,0],[16,10],[0,10]])
        if (at(dc, dr) & 0x7F) k.nzD++;                  // $A159's AND $7F
  }
  /* $851E -> $A1DA's four RET nc, which are pure arithmetic on the actor's
     (x,y) and the camera -- the same test actorVisible() already makes, split
     into the two populations that cost differently. */
  clockCensusActor(a){
    const k = this.clk;
    if (((a.x + 3 - this.camX) & 0x7F) > ACT_CULL_X) k.clipX++;   // $A1EA
    else if (((a.y + 3 - this.camY) & 0x7F) > ACT_CULL_Y) k.clipY++;  // $A209
    else k.upd++;                                        // reaches $ABFF
  }
  /* W1, in T-states: the twenty-three CALL sites of $8503..$8550. */
  clockCost(){
    const k = this.clk, tb = CLK_TILE_BASE[k.by*2 + k.bx];
    let w = 0;
    w += CLK.tileAnim + ((this.passCtr & 1) ? 0 : CLK.tileAnimEven); // $8503
    w += CLK.doorAnim;                                              // $8506
    w += CLK.move + k.moving * (CLK.moveKey + CLK.moveActor*k.nact); // $8509
    w += CLK.camera;                                                // $850C
    w += tb[0] + CLK.cellA*k.nzA;                                   // $850F
    w += tb[1] + CLK.cellB*k.nzB;                                   // $8512
    w += tb[2] + CLK.cellC*k.nzC;                                   // $8515
    w += tb[3] + CLK.cellD*k.nzD;                                   // $8518
    w += CLK.preActor;                                              // $851B
    w += CLK.actors + CLK.clipX*k.clipX + CLK.clipY*k.clipY         // $851E
       + CLK.upd*k.upd + CLK.updActor*k.upd*k.nact
       + CLK.step*k.step + CLK.contact*k.contact;
    w += CLK.plrDraw + CLK.shots + CLK.treasure;             // $8521/$8524/$8527
    w += CLK.hud + CLK.hudDrain*k.drain;                            // $852E
    w += CLK.hud2 + CLK.panel + CLK.exitWalk;                // $8531/$8534/$8537
    w += CLK.cull + CLK.cullActor*k.nact2;                          // $853A
    w += CLK.gens + CLK.genCell*k.gcells + CLK.genFound*k.ngen      // $853D
       + CLK.genSpawn*k.spawn;
    w += CLK.death;                                                 // $8540
    w += CLK.banner + CLK.bannerFire*k.banner;                      // $8543
    w += CLK.ctr + CLK.toHalt;                               // $8546/$8550
    /* $B8CC, the beeper's noise sample: 68 T on a silent pass (already in
       every base above) and 96 or 135 T while a ramp is live. */
    w += CLK.noiseCall*k.noiseCalls + CLK.noiseToggle*k.noiseTogs;
    return w;
  }
  /* $8550 CALL $9CD7.  Returns nothing; sets passFrames (VIDEO FRAMES, a
     real number), passTicks (whole frames = the $8497 delta) and the carried
     phase.  THE ONLY approximation in here is that every frame boundary
     inside W1 is charged `isrW1` rather than the full handler -- see the
     DECLARED GAP at the top of the file. */
  quantise(w1base){
    const F = FRAME_T_JS, t = this.clockPhaseT;
    /* how many boundaries W1 crosses.  A fixed point, because each crossing
       costs an interrupt which can push W1 over the next one. */
    let K = 0;
    for (let i=0;i<8;i++){
      const K2 = Math.floor((t + w1base + CLK.isrW1*K) / F);
      if (K2 === K) break;
      K = K2;
    }
    const w1 = w1base + CLK.isrW1*K;
    this.clockW1 = w1;                    // for tools/clockgate.py to score
    this.clockK = K;                      // frame boundaries inside W1
    const release = Math.ceil((t + w1) / F) * F;          // $9CD7's HALT
    /* W2's three handler bodies: the wake, $9CF8's hand call, and the one
       accepted inside $B4FF.  Each sees $8497 one higher than the last. */
    const f = this.frameCtr;
    const w2 = CLK.w2Straight + clkIsr((f + K) & 0xFF)
             + clkIsr((f + K + 1) & 0xFF) + clkIsr((f + K + 2) & 0xFF);
    const cost = release + w2 - t;
    this.clockPhaseT = (release + w2) % F;
    /* FAILSAFE.  A runaway W1 must come through blockingPause()'s explicit
       debit, never through the quantiser: a level reload is 271.8 frames and
       nothing in clockCost() can legitimately produce it. */
    this.passFrames = Math.min(24, cost / F);
    this.passTicks = Math.max(3, Math.min(24, K + 3));
    /* THE LOAD SLOWDOWN, and turning it off is a DEVIATION, not a fix.  A
       pass costs what its work costs -- that is the whole pass-cost model and
       it is what makes a generator cluster drop the game to ~8.4 Hz where an
       empty room runs at 10.  Capping both numbers together keeps them
       consistent: passTicks is $8497, the video-frame counter, and charging
       fewer frames of wall time than of $8497 would run the drain and the
       animations at a different rate from the game.
       Default ON.  The gates never see this: they drive onePass() directly
       and `loadSlowdown` is only ever written by the menu. */
    /* ONLINE forces the cap regardless of the setting: there is no shared
       screen for a bog-down to be faithful to, and the cap is the same on
       every client, so the clocks stay in lockstep. */
    if (this.online ||
        (typeof loadSlowdown !== 'undefined' && !loadSlowdown)){
      this.passFrames = Math.min(this.passFrames, SMOOTH_CAP);
      this.passTicks  = Math.max(3, Math.min(this.passTicks, SMOOTH_CAP));
    }
    /* a rolling mean of the last 25 passes (~2 s) for the UI readout, so the
       number a player sees is the rate and not one pass's quantisation */
    (this.hzRing = this.hzRing || []).push(this.passFrames);
    if (this.hzRing.length > 25) this.hzRing.shift();
  }
  hzAvg(){ const r = this.hzRing;
           return (r && r.length) ? r.reduce((a,b)=>a+b,0)/r.length
                                  : FRAMES_PER_PASS; }
  blockingPause(){
    if (!this.pauseReq) return;                          // $9D01 BIT 2/RET z
    this.pauseReq = false;                               // $9D06 RES 2
    if (SOUND_MODE === SOUND_48K){                       // $9D0A/$9D0E
      const which = this.pauseLong ? 'level' : 'banner'; // $9D10 BIT 5
      const f = this.sound.tune                          // $9D17/$9D14
              ? this.sound.tune(this.simFrame, which)
              : (which === 'level' ? 209.97 : 72.07);
      /* the WALL cost is debited; $8497 is NOT advanced, because the tune
         holds the interrupt off for all of it (measured +0 in isolation and
         +4 -- an ordinary pass -- in situ). */
      this.passFrames += f;
      this.simFrame += f;              // the bridge's clock IS wall time
      /* the tune is a fixed number of T-states with interrupts OFF, so it
         carries the frame phase forward like anything else: 72.07 frames
         leaves the next loop top 0.07 of a frame later than it found it. */
      this.clockPhaseT = Math.round(this.clockPhaseT + f*FRAME_T_JS) % FRAME_T_JS;
      return;
    }
    this.sfx(0x10);                                      // $9D22/$9D24
    const iter = 50;                                     // $9D27 LD B,$32
    for (let i=0;i<iter;i++) this.soundTicks(2);         // $9D31/$9D32 HALT x2
    this.frameCtr = (this.frameCtr + 2*iter) & 0xFF;     // the ISR's $8497
    this.passFrames += 2*iter;
  }

  /* $8521 CALL $A43B -> $A446 for each player.  Only two things it does are
     SIMULATION rather than drawing, and both are here:
       $A457  BIT 0,(IY+$12) / JR z -- on ODD passes only, (IX+10) the
              invisibility timer is decremented (and only then does it
              suppress the draw)
       $A48D  RES 4,(IX+14) -- the SHOVE bit, cleared every single pass,
              AFTER both moves have read it
     $A491's BIT 2 and the whole blit are display state and live in the
     renderer.  The pose update at $A47B is animate()'s job, called from the
     move; what is left here is the timer and the flag. */
  drawBookkeeping(){
    for (const q of this.players){
      if (q.f11 & F_DEAD) continue;                      // $A446 BIT 7 / RET nz
      /* $A491 BIT 2,(IX+14) / RET nz sits BELOW $A48D's RES 4 and above the
         sprite build at $A496..$A4B2, so a player IN TELEPORT TRANSIT still
         gets his pose and his RES 4 -- he is only not DRAWN.  That belongs to
         the renderer and is where it is applied (playerVisible()). */
      if (!(q.f11 & F_EXITING) && !(q.animCtl & 1)){     // $A44B / $A451
        /* $A457 BIT 0,(IY+$12) / JR z,$A46F -- the invisibility timer is
           touched on ODD PASSES ONLY, and when it is >= $32 after the
           decrement the routine RETURNS: no pose update and no RES 4
           either.  (The draw suppression itself is the renderer's.) */
        if (this.passCtr & 1){
          if (q.timer !== 0){                            // $A45D OR A / JR z
            q.timer = (q.timer - 1) & 0xFF;              // $A463 DEC A
            if (q.timer >= 0x32) continue;               // $A467 CP $32/RET nc
            if (this.passCtr & 2) continue;              // $A46A BIT 1/RET nz
          }
        }
        /* $A46F BIT 6,(IX+$14) -- a STUNNED player does not turn; $A475 BIT
           4,(IX+14) -- nor does a player who was SHOVED this pass, which is
           what makes a pushed player SLIDE with his facing frozen.
           $A47B LD A,(IX+7) / AND 15 / JR z -- the RAW key byte, so holding
           FIRE still turns him, and holding nothing keeps the last pose. */
        if (!(q.p14 & 0x40) && !(q.animCtl & 0x10) && (q.dir & 15))
          q.frameSlot = SLOT[q.dir & 15];                // $A48A LD (IX+13),A
      }
      q.animCtl &= ~0x10;                                // $A48D RES 4
    }
  }

  /* $A506..$A513 -- THE STUN, and the countdown reuses the pending-
     interaction slot as its counter:
       $A506  BIT 6,(IX+$14) / JR z,$A514
       $A50C  DEC (IX+$1D) / RET nz          <- the pass is over
       $A510  RES 6,(IX+$14)                 <- and then FALLS THROUGH, so
       $A514  LD (IX+$1D),0                     the pass the stun expires is
                                                a NORMAL pass
     $9068 arms it with $1E.  Returns true when the pass is spent frozen.
     MEASURED on the original: a stunned player is frozen for 29 passes and
     moves again on the 30th, and a second hit re-arms $1E.  $A46F BIT 6
     freezes his walk animation for the same passes.                      */
  stunTick(){
    if (!(this.p14 & 0x40)) return false;                // $A506 BIT 6
    this.pend = (this.pend - 1) & 0xFF;                  // $A50C DEC
    if (this.pend !== 0) return true;                    // $A50F RET nz
    this.p14 &= ~0x40;                                   // $A510 RES 6
    return false;                                        // fall through
  }

  /* $A4DD -- ONE PLAYER'S WHOLE UPDATE, to completion, then the other's.
     Everything below this line was written for one player and is unchanged
     except that `p` now says which; that is the point of the refactor and it
     is why the one-player differentials do not move. */
  playerUpdate(q){
    const save = this.p;
    this.p = q;
    try { this.playerUpdateBody(); } finally { this.p = save; }
  }
  playerUpdateBody(){
    /* $A4DD's head is the HOARD KEY DRIP: HL is $84C1 for player 1 and
       $84C2 for player 2 ($A3AC / $A3B6), one counter each. */
    if (this.p.hoardKey !== 0 && !(this.f11 & F_KEY_GAIN)){   // $A4DE / $A4E1
      this.p.hoardKey--;                                      // $A4E7 DEC (HL)
      if (this.mayCarry()){                                   // $A4E8 CALL $A81D
        this.f11 |= F_KEY_GAIN;                               // $A4ED SET 2
        this.keys++;                                          // $A4F1 INC (IX+8)
      }
    }
    /* A player who is NOT IN THE GAME has no move at all: $A4F4 BIT 6,
       (IX+11) covers the never-joined ($C0), the exiting and the dead. */
    const d0 = this.dir;
    let d = d0;
    /* $A47B reads the RAW (IX+7) for the POSE while $A58B may zero the copy
       the MOVE uses -- which is why fire turns you without moving you. */
    const dRaw = d;
    // $A58F LD E,A -- E starts the pass as the direction bits and each handler
    // clears its own bit if the move is undone.
    this.eBits = 0;
    /* THE ORDER IS MEASURED, and it is not the order of the CALLs in the main
       loop.  Hooking $8503 (the loop top), $A5F0 (the player's scan), $B58C
       (the camera) and $AB94 (the actor loop) on the real Z80 gives, every
       pass without exception:
           TOP -> player move+scan -> camera -> ... -> ACTOR LOOP -> count++
       The player's move is reached from $8509 CALL $A38A -> $A3AF CALL $A4DD
       (the stack at $A5F0 reads [$A3B2, $850C]), which is BEFORE $850C.  All
       four of the actor investigations read the CALL order -- $851E actors,
       $8521 $A43B -- and concluded "actors move first, then the player moves
       against their new positions".  That is wrong: $A43B is the player's
       frame/draw bookkeeping, not his move.  It matters, because it decides
       which side of the ghost's step the player's scan sees.
       With TWO players it is measured further: player 1's coordinates are
       COMMITTED at $A620 before player 2's $A4DD is entered, so player 2's
       own gates see player 1's new position, and the actor loop at $851E
       sees both. */
    const cand = {x:this.x, y:this.y};    // $A590 LD C,(IX) / LD B,(IX+1)
    /* $A4F4 BIT 6,(IX+11) / RET nz -- once the player is EXITING the whole
       move routine returns immediately, so he stops where the exit put him.
       Bit 6 is also set on a NEVER-JOINED player ($844B ships $C0) and on a
       dead one ($93E9 OR $C3), so this one test is what keeps player 2 inert
       until he presses FIRE.
       MEASURED: with a $36 planted, the coordinates never change again and
       (IX+$16) counts $17..$00 over the following 24 passes. */
    if (this.f11 & F_EXITING){
      /* nothing: the exit walk at $8537 owns the player from here, and it is
         the routine that decrements (IX+$16) */
    } else if (this.animCtl & 1){
      /* $A4F9 BIT 0,(IX+14) / JR nz,$A4B5 -- THE MATERIALISE.  The whole
         move routine is short-circuited for the six passes a joining player
         is drawn from the swirl bank at $F45E:
           $A4B5  INC (IX+13) / JR z -> sound 3 (the $FF -> $00 wrap, i.e.
                  the JOIN pass itself)
           $A4BA  CP 6 / RET nz
           $A4C0  (IX+13) = 4 (compass slot SOUTH) / RES 0,(IX+14)
           $A4C8  LD A,IXL / AND $20 -> DE = $5F00 or $6320 / JP $9579
         MEASURED with the pointer table watched: $7CCE holds $F45E for
         passes +0..+5 with (IX+13) walking 00,01,02,03,04,05, and is back at
         $6320 on +6 with (IX+13) = 4.  SIX frames, not five, and he cannot
         move during any of them. */
      this.frameSlot = (this.frameSlot + 1) & 0xFF;      // $A4B5 INC (IX+13)
      if (this.frameSlot === 0) this.sfx(3);             // $A4B8 JR z
      if (this.frameSlot === 6){                         // $A4BA CP 6
        this.frameSlot = 4;                              // $A4C0
        this.animCtl &= ~1;                              // $A4C4 RES 0
      }
    } else if (this.animCtl & 2){
      /* $A4FF BIT 1,(IX+14) / $A503 JP nz,$B195.  A JP, not a CALL: the arm
         REPLACES the whole move -- $A514's clear of the pending slot, the
         four direction handlers, the actor scan and $A620's commit are all
         skipped.  That is not an accident: it is the only reason the pending
         slot still holds the DESTINATION CELL when $B232 reads it four passes
         later, so a fix that clears `pend` per pass silently loses
         exit-on-arrival.  $B195 is the ONLY consumer -- a whole-image opcode
         scan finds exactly one CALL/JP to it, at $A503. */
      this.teleportPass();
    } else if (this.stunTick()){
      /* $A506's arm -- a stunned player spends the pass counting down and
         does nothing else.  See stunTick(). */
    } else {
      this.pend = 0;                      // $A514 LD (IX+$1D),0 -- EVERY pass
      this.throwPotion();                 // $A518 BIT 5,(IX+7)
      /*

         $A57E..$A58E -- HOLDING FIRE FREEZES THE PLAYER, and this is a real
         rule, not a side effect:
             $A57E  LD A,(IX+7) / BIT 4,A / JR z,$A58C
             $A585  BIT 4,(IX+14) / JR nz,$A58C
             $A58B  SUB A                     <- the whole direction byte
             $A58C  AND 15 / RET z            <- and the MOVE ROUTINE RETURNS
         Bit 4 of $842E is the exemption, and $A48D clears it every single
         pass (it is RES 4,(IX+14), NOT "write 0 to $842E" -- that byte is the
         walk phase and it cycles 40 40 80 80 C0 C0 00 00 while you walk,
         measured), so in one-player play the freeze is unconditional.
         MEASURED, 12 passes each: holding Q walks y 10,12,...,30; holding Z+Q
         stands at (12,8) for all twelve, with $842D still tracking the held
         direction.  You turn but you do not move.
         The RET z is also why standing still with no key pressed does not run
         the actor scan -- and therefore does not melee a monster you are
         standing next to.  This engine used to run the scan unconditionally. */
      if ((d & DIR_FIRE) && !(this.animCtl & 0x10)) d = 0;      // $A57E
      if ((d & 15) === 0){ this.animate(dRaw, 0); }  // $A58E RET z -- and
      else {                                         // $A47B still turns him
      if ((d & 3) !== 3){                 // $A599 up+down together CANCEL
        if (d & DIR_UP)    this.tryStep(cand, 0,-1, DIR_UP);    // $A5A3 $A8B9
        if (d & DIR_DOWN)  this.tryStep(cand, 0,+1, DIR_DOWN);  // $A5A8 $A88B
      }
      /* $A5AE LD A,(IX+$1D) / CP $36 / JR z,$A5D8 -- if the VERTICAL phase
         recorded an EXIT the whole horizontal phase is skipped and the value
         is preserved.  Otherwise the vertical value is stashed, the slot is
         cleared for the horizontal handlers, and whichever of the two
         recorded something wins -- horizontal first ($A5CB re-reads the slot;
         non-zero keeps the horizontal one, zero restores the vertical).
         Confirmed on the wire by watching every write to $843D: an ordinary
         pass writes $A514:00 $A5B6:00 $A5D5:00, and a pass with a $36 planted
         writes only $A514:00 $A91F:36 -- no $A5B6, no $A5D5. */
      if (this.pend !== 0x36){
        const savedV = this.pend, savedC = this.pendCol, savedR = this.pendRow;
        this.pend = 0;                    // $A5B6 LD (IX+$1D),0
        if ((d & 12) !== 12){             // $A5BA left+right together CANCEL
          if (d & DIR_LEFT)  this.tryStep(cand,-1, 0, DIR_LEFT);  // $A5C3 $A85D
          if (d & DIR_RIGHT) this.tryStep(cand,+1, 0, DIR_RIGHT); // $A5C8 $A82F
        }
        if (this.pend === 0){                                     // $A5CF JR z
          this.pend = savedV;                                     // $A5D5
          this.pendCol = savedC; this.pendRow = savedR;
        }
      }
      // $A5D8 tests E BEFORE the scan, so a move the scan rejects still animates
      this.animate(dRaw, this.eBits);
      if (!this.playerScan(cand.x, cand.y)){   // $A5F0 / $A5F3 JR nc,$A616
        /* $A616 CALL $AAC4 / $A619 RET c -- THE FOURTH GATE, the other
           player's body, and it is a real one now.  Note it comes AFTER the
           actor scan and BEFORE the pending-interaction test, so a refusal
           here leaves the pending slot loaded and the item is not taken
           either -- the pass is spent standing still.
           $A61A LD A,(IX+$1D) / OR A / JR nz,$A65D -- a pending interaction
           REFUSES the commit and the pass is spent on the interaction
           instead.  That is the whole cost model: one refused pass per item,
           and $A514 above throws the slot away again next pass. */
        if (this.otherPlayerBox(cand)){                           // $A616
          this.lastBlocked = 'PLAYER';
        } else if (this.pend !== 0) this.interact(cand);          // $A61A
        else { this.x = cand.x; this.y = cand.y; }                // $A620
      }
      }
    }
  }

  /* $8527 BIT 6,(IY-1) / CALL nz,$8ADA -- ONLY in a treasure room, once per
     pass.  $8AE3 skips the tick while either player is EXITING (bit 6 of
     $842B), $8AED counts a divider of 12 passes down and takes one BCD point
     off $84B6 each time, and when $84B6 reaches 00 the routine does
        $8B1E  SET 3,(IY-2)       -- $847D bit 3, which $94AE reads FIRST
        $8B22  SET 7,(IY-2)       -- and the main loop is over
     $84B6 is seeded BCD $20..$30 at $915E, so a treasure room lasts 32..48
     ticks of 12 passes = 384..576 passes = 30..46 seconds.  That is the ONLY
     way out of a treasure room other than the exit, and it is why $84B6 was
     measured as 0 (inert) in dungeon 1.                                     */
  treasureTick(){
    if (!this.treasure) return;                          // $8527 BIT 6,(IY-1)
    if (this.f11 & F_EXITING) return;                    // $8AE3 AND $40
    if (--this.treasureDiv > 0) return;                  // $8AED DEC (IY+$38)
    this.treasureDiv = 12;                               // $8AF2
    this.treasureTimer = daaSub(this.treasureTimer,1,0).v;  // $8AF9 SUB 1/DAA
    if (this.treasureTimer === 0){                       // $8B1C OR A / RET nz
      this.forcedOver = true;                            // $8B1E SET 3,(IY-2)
      this.levelDone = true;                             // $8B22 SET 7,(IY-2)
      this.gameOver = this.dead;
    }
  }

  /* =====================================================================
     $B3B9 -- THE POST-DEATH LOOP.  THE WORLD STOPS HERE.
     =====================================================================
     The loop is $B3B9 CALL $9432 / $B3BC test / $B3C6 DI JP $B35A -- a
     brand-new game -- and on the original what runs inside it is $930C,
     the three-letter HIGH-SCORE NAME ENTRY (the AAA field, the 8-frame
     input gate, the 27-slot alphabet, SHIFT committing through $93A8).

     THE NAME ENTRY IS RETIRED (this fork).  The player already HAS a
     name -- the options row, worn over his head in play -- so a
     three-letter entry asked for something known, at the least welcome
     moment; and ONLINE it was unrunnable anyway: $930C reads the LOCAL
     keyboard inside a lockstep tick, which is a desync by construction
     (nameCol and nameStamp sat in fingerprint()).  Death now shows the
     frozen dungeon, the bones ($9404's drop, untouched), and RIP <name>
     over the corpse (see the tag pass in render()) for OVER_RIP_FRAMES
     -- clocked on $8497, the VIDEO FRAME counter, the loop's only clock
     ($8491, the pass counter, is frozen; measured 0 over 100 frames) --
     and then $B35A's own new-game tail runs unchanged: fresh block,
     dungeon one, the attract loop.  No table is written.

     THE RANKED TABLES REMAIN PORTED AND SHOWN: the four 60-byte tables
     at $8826 (HS_TABLES), the insertion sort $86ED (hsInsert, still
     gated by `python tools/fegate.py hiscore`) and the four-page attract
     display $8767 (hsDrawPage, gated by `python tools/rankgate.py`).
     Nothing files into them any more -- the attract cycle shows the
     capture's own residents, as arcade furniture.
     STILL NOT PORTED, and deliberately: the REWIND TAPE prompt ($B48F),
     a cold-boot-only path because $84CC bit 7 is set by $91D4 and never
     cleared, and left out because the tape prompts do not belong in this
     port. */
  static get OVER_RIP_FRAMES(){ return 250; }   // five seconds of RIP
  enterGameOver(){
    this.mode = 'over';
    /* $93E2 LD (IX+14),$80 arms the chain; the entry's own setup ($92C1's
       AAA, cursor and stamp) is retired with it -- the hold is a timer. */
    this.overFrames = 0;
    this.gameOver = true;
  }

  /* One iteration of $B3B9, driven once per VIDEO FRAME.  No input: the
     entry is retired (see above), so death holds its RIP picture for
     OVER_RIP_FRAMES and nothing -- FIRE included -- can cut it short,
     which keeps the original's "no continue" truth by other means. */
  overTick(){
    this.frameCtr = (this.frameCtr + 1) & 0xFF;          // the ISR's $8497
    this.overFrames++;
    if (this.overFrames >= Game.OVER_RIP_FRAMES){
      this.endGameOver();
      return true;
    }
    return false;
  }

  /* $93A8 (IX+14) = 0 / JP $948C ends the $B3BC loop test; then $B3C6
     falls through to $B35A, the new game:
        $B35A  clear $7F1B..$7F2A, $84C8 = $84C9 = 0 (the million counters)
        $B36B  $8403 = $842C = $844C = 1        <-- dungeon ONE
        $B374  CALL $B470 -- THE ATTRACT SCREEN, now ported (enterAttract)
        $B377  $84BA = 2 + rand&3               the treasure countdown
        $B381  DI / CALL $B3D0 / ... / CALL $8503
     The score is NOT carried over: $B35A's new game starts a fresh player
     block.  $84CC/$84CD and the stash are NOT cleared, which is why the
     REWIND TAPE prompt is a cold-boot-only path.  The $93AF pending
     record -- the hiscore filing that used to sit at the top of this
     tail -- is retired with the name entry; everything below it is
     $B35A's own, unchanged. */
  endGameOver(){
    this.millions = 0;                                   // $B364/$B367
    this.score = 0;                                      // a new player block
    this.health = 0x2000; this.keys = 0; this.potions = 0;
    this.p14 &= 0x3F;                                    // not dead, no bonus
    this.dead = false;
    this.tcd = 2 + (this.brand8()&3);                    // $B377
    this.startLevel(1);                                  // $B36B / $B381
    this.pass = 0;
    this.enterAttract();                                 // $B374 CALL $B470
  }

  /* ====================================================================
     $B470 -- THE ATTRACT LOOP, THE ONLY FRONT END THAT RECURS
     ====================================================================
       $B470  ($8497) = 0 / CALL $B5DA / EI     both players -> $948C
       $B478  CALL $869F                        draw the next ranked page
       $B47B  CALL $9432                        the JOIN poll
       $B47E  A = ($8434) AND ($8454) / RLA / JR nc,$B48F
                                                someone joined -> leave
       $B487  A = ($8497) / OR A / JR nz,$B47B  spin until the byte wraps
       $B48D  JR $B478                          ...then the next page
       $B48F  BIT 7,(IY+$4D) / RET nz           $84CC bit 7: a pack is held
       $B494  the REWIND TAPE prompt, $B4AD waits on SPACE
     so the page period is EXACTLY 256 video frames (measured 256.00 over
     five consecutive pages), it is SILENT (20 OUT ($FE) writes in 20 frames,
     all value 0), it is FREE-RUNNING rather than frame-paced (the join is
     polled tens of times a frame; sampling once a frame here is equivalent
     because $944C is a level test on FIRE), and the ONLY way out is FIRE
     from either player -- no timeout and no other key.
     The REWIND prompt is cold-boot only: $91D4 sets $84CC bit 7 the first
     time a pack is loaded and nothing ever clears it, so a restart after a
     game over goes straight back into the dungeon.                        */
  enterAttract(){
    this.mode = 'attract';
    this.attractT = 0;                                   // $B470 ($8497) = 0
    this.feScr = new SpecScreen();
    for (const q of this.players) q.p14 |= 0x80;         // $B474 -> $948C
    this.attractDraw();
  }
  attractDraw(){
    /* $8767 LD B,(IY+$4C) / INC B / LD (IY+$4C),B / RES 2,(IY+$4C): the
       REGISTER keeps 1,2,3,4 and the VARIABLE keeps 1,2,3,0. */
    const b = (this.attractPage + 1) & 0xFF;
    this.attractPage = b & ~4;
    hsDrawPage(this.feScr, b);
  }
  attractTick(input){
    this.frameCtr = (this.frameCtr + 1) & 0xFF;          // the ISR's $8497
    this.readKeys(input);
    this.joinPass();                                     // $B47B CALL $9432
    if (this.players.some(q => q.inGame)){               // $B47E AND / RLA
      /* SITE 3 of the tape-prompt boundary.  $B48F BIT 7,($84CC) puts up the
         REWIND prompt on a COLD BOOT only -- the pack is not held yet, so the
         original needs side 2 in the deck before it can start.  This port
         already holds all 307 dungeons, so the prompt asks for something it
         has: suppressed, it takes the packHeld arm instead. */
      if (this.packHeld || !FAITHFUL_TAPE_PROMPTS){
        this.mode = 'play'; this.feScr = null;                     // $B48F
        this.packHeld = true;
      }
      else { this.mode = 'rewind'; hsDrawRewind(this.feScr); }
      return;
    }
    this.attractT++;
    if (this.attractT >= ATTRACT_PERIOD){ this.attractT = 0; this.attractDraw(); }
  }
  /* $B4AD CALL $B4E8 / BIT 0,(IY+7) / JR nz -- SPACE, and nothing else. */
  rewindTick(input){
    const kb = input && input.kb;
    /* on the abstract input path SPACE is player 2's MAGIC bit, which is what
       $B4B0 BIT 0,(IY+7) reads too -- the same physical key. */
    const sp = kb ? kb.down('SPACE') : !!(input && input.potion);
    if (sp){ this.mode = 'play'; this.feScr = null; this.packHeld = true; }
  }

  /* ====================================================================
     $A3E6 -- THE CAMERA TARGET, and it is a TWO-STAGE tracker.
     ====================================================================
     $A3E6 writes a TARGET at $848D/$848E and $850C CALL $B58C then steps the
     camera ($848B/$848C) two units toward it.  Nothing in this file named
     $A3E6 before; the camera was documented as tracking the player, and what
     it tracks is the midpoint of two.

       $A3E6  HL = ($8420)                    ; L = x, H = y
       $A3E9  BIT 7,(IY-$54) / JR z,$A3F7     ; player 1 out of play?
       $A3EF  HL = ($8440) / BIT 7,(IY-$34) / RET nz    ; both out: NO WRITE
       $A3F7  INC H,INC H,INC L,INC L         ; +2 on both -- the sprite centre
       $A3FB  C = H ; A = L                   ; keep his OWN centre
       $A3FD  BIT 7,(IY-$34) / JR nz,$A410    ; player 2 out: he IS the target
       $A403  DE = ($8440) ; INC E,INC E,INC D,INC D
       $A40B  ADD HL,DE                       ; ONE 16-BIT ADD, so a carry out
       $A40C  SRL H / SRL L                   ;   of x lands in y
       $A410  RES 0,L / RES 0,H               ; round DOWN to even
       $A414  A -= L ; abs ; AND $7F ; CP $21 ; JR c  ; L ^= $40   the wrap fix
       $A423  RES 7,L ; the same for H with C
       $A437  ($848D) = HL
     Three things a reimplementation would not produce, all of which this
     transcription keeps:
       * the add is 16-bit, so with an ODD x-sum the carry adds 1 to the
         y sum.  Inert while both y are even, which they always are in play.
       * RES 0 rounds the midpoint DOWN to an even unit -- it is NOT the
         exact midpoint, and on half of all even pairs the true midpoint is
         odd and the target sits one unit low.
       * the wrap fix is only correct INSIDE the leash: at a separation of
         66..126 the XOR $40 produces the ANTIPODE, not the short way.  The
         leash makes that unreachable, but it is not a midpoint formula.
     ENUMERATED by me against my own transcription on the real routine:
     9,692/9,692 with both players present (a full even sweep of x-pairs at
     one y, a full even sweep of y-pairs at one x, and 1,500 random pairs),
     384/384 with player 2 absent, (40,60) -> (42,62) with player 1 absent,
     and with BOTH absent $848D/$848E are not written at all.               */
  cameraTarget(){
    const [p1, p2] = this.players;
    let L, H;
    if (!(p1.f11 & F_DEAD)){ L = p1.x; H = p1.y; }        // $A3E9 BIT 7
    else if (!(p2.f11 & F_DEAD)){ L = p2.x; H = p2.y; }   // $A3EF
    else return;                                          // $A3F6 RET nz
    L = (L + 2) & 0xFF; H = (H + 2) & 0xFF;               // $A3F7
    const Cc = H, Aa = L;                                 // $A3FB
    if (!(p1.f11 & F_DEAD) && !(p2.f11 & F_DEAD)){        // $A3FD BIT 7
      const e = (p2.x + 2) & 0xFF, d = (p2.y + 2) & 0xFF;
      const s = ((H << 8) | L) + ((d << 8) | e);          // $A40B ADD HL,DE
      H = ((s >> 8) & 0xFF) >> 1;                         // $A40C SRL H
      L = (s & 0xFF) >> 1;                                // $A40E SRL L
    }
    L &= 0xFE; H &= 0xFE;                                 // $A410 RES 0
    let a = (Aa - L) & 0xFF;                              // $A414 SUB L
    if (a & 0x80) a = (-a) & 0xFF;                        // $A417 NEG
    if ((a & 0x7F) >= 0x21) L ^= 0x40;                    // $A41B CP $21
    L &= 0x7F;                                            // $A423 RES 7,L
    a = (Cc - H) & 0xFF;
    if (a & 0x80) a = (-a) & 0xFF;
    if ((a & 0x7F) >= 0x21) H ^= 0x40;
    H &= 0x7F;                                            // $A435 RES 7,H
    this.camTgtX = L; this.camTgtY = H;                   // $A437 ($848D)
  }

  /* $B58C, both axes, off the target $A3E6 left. */
  camera(){
    this.camX = camStep(this.camX, this.camTgtX, CAM_OFF_X, CAM_MAX_X);
    this.camY = camStep(this.camY, this.camTgtY, CAM_OFF_Y, CAM_MAX_Y);
  }

  /* ====================================================================
     ONLINE: ONE VIRTUAL CAMERA PER PLAYER (this fork -- see CLAUDE.md).
     ====================================================================
     The camera is SIMULATION state, not a lens: $A1DA's culls freeze
     off-camera actors, $B0FE recycles generator spawn by camera distance,
     $8D97/$8DA1 end a shot at the screen edge, and $B156's pad census --
     the teleport destinations -- is the cells the painters walked.  So a
     per-client display cannot simply point elsewhere; the RULES
     generalize from THE camera to THE WINDOWS:
       * actor gate ($A1DA)      awake if visible to ANY window
       * generator cull ($B0FE)  recycle only when far from ALL windows
       * a shot ($8D97)          lives against its OWNER's window
       * a monster shot          lives while ANY window shows it
       * the sweep ($A9C2)       walks the UNION, each cell once
       * pad census ($B156)      one entry per pad on any window
     Each window is target-tracked by the $A3E6 SOLO arm (camTargetFor)
     and stepped by the same $B58C camStep, so with one player in game
     every definition above collapses to the module camera's behaviour --
     the degeneracy tools/headless.js checks by state digest.  A window
     OUTLIVES its player's death (camLive holds until the level boundary),
     exactly as the module camera holds its last position once $A3E6
     stops writing; a player never yet live contributes nothing. */
  camTargetFor(q){
    if (q.f11 & F_DEAD) return;                          // $A3F6 -- no write
    let L = (q.x + 2) & 0xFF, H = (q.y + 2) & 0xFF;      // $A3F7 +2
    const Cc = H, Aa = L;                                // $A3FB
    L &= 0xFE; H &= 0xFE;                                // $A410 RES 0
    /* the wrap fix, inert against your own centre but kept: this is
       $A414..$A435 verbatim, not a new formula */
    let a = (Aa - L) & 0xFF;
    if (a & 0x80) a = (-a) & 0xFF;
    if ((a & 0x7F) >= 0x21) L ^= 0x40;
    L &= 0x7F;
    a = (Cc - H) & 0xFF;
    if (a & 0x80) a = (-a) & 0xFF;
    if ((a & 0x7F) >= 0x21) H ^= 0x40;
    H &= 0x7F;
    q.camTgtX = L; q.camTgtY = H;
  }
  vcamPass(){
    for (const q of this.players){
      if (!(q.f11 & F_DEAD)){ this.camTargetFor(q); q.camLive = true; }
      if (!q.camLive) continue;
      q.camX = camStep(q.camX, q.camTgtX, CAM_OFF_X, CAM_MAX_X);
      q.camY = camStep(q.camY, q.camTgtY, CAM_OFF_Y, CAM_MAX_Y);
    }
  }
  /* $B447's settle, per window: step until it stops moving. */
  vcamConverge(q){
    this.camTargetFor(q);
    for (let i = 0; i < 256; i++){
      const cx = q.camX, cy = q.camY;
      q.camX = camStep(q.camX, q.camTgtX, CAM_OFF_X, CAM_MAX_X);
      q.camY = camStep(q.camY, q.camTgtY, CAM_OFF_Y, CAM_MAX_Y);
      if (cx === q.camX && cy === q.camY) break;
    }
  }
  /* the live windows, in player order -- the one iteration order every
     generalized rule uses, so all clients agree byte for byte */
  vcamWins(){ return this.players.filter(q => q.camLive); }

  /* The sprite's compass slot and walk phase, both READ rather than guessed.
       $A47B  LD A,(IX+7) / AND 15 / JR z,$A48D      ; the RAW input bits pick
       $A480  ... LD A,($7D0C+bits) / LD (IX+13),A   ; the pose, and zero keeps
                                                     ; the persisted one
       $A5D8  LD A,E / OR A / JR z                   ; <-- E, NOT (IX+7)
              BIT 0,(IY+$12) / JR z                  ; IY=$847F: $8491 is the
                                                     ; PASS COUNTER -- the
                                                     ; counter advances on ODD
                                                     ; passes only
              BIT 4,(IX+14) / JR nz                  ; bit 4 is $AB24's, the
                                                     ; SHOVE: a player being
                                                     ; pushed does not walk.
                                                     ; (Ported, pushShove().
                                                     ; This used to read
                                                     ; "NOT PORTED: what sets
                                                     ; bit 4 was not read".)
              LD A,(IX+14) / ADD A,$40 / LD (IX+14),A
     and $A49F/$A4A7 decode the counter as phase 0,1,0,2, so each phase is held
     for two passes.

     THE E GATE IS THE SUBTLE PART, and a trace found it rather than a reading:
     holding UP into a wall, the drawn record froze on the walk frame instead
     of cycling.  E is the mask of directions that SURVIVED the move -- the
     handlers clear their own bit on the undo path ($A85A/$A888/$A8B6/$A8E4
     RES 3/2/1/0,E) -- so the walk cycle stops dead against a wall while the
     POSE still turns to face the way you are pushing.  Gating on the raw
     input instead animates a player who is not moving, which is visibly
     wrong and is what the first version of this did.

     Measured against the original over 24 passes x 5 directions: the drawn
     record matched the prediction 120/120 (tools/playersprite.py's gate), and
     the 12-pass right-hand sequence is a headless check.                   */
  /* CORRECTION, and it is what the two-player work turned up: the POSE
     update ($A47B) is NOT part of the move.  It lives in $A43B, the draw
     dispatch at $8521, and only the WALK PHASE ($A5D8) is in $A4DD.  With
     one player the two are indistinguishable -- both run once a pass off the
     same (IX+7), with nothing between them that reads (IX+13) -- but a
     MATERIALISING player shows the difference: his move is short-circuited
     at $A4F9 and his pose is skipped at $A451, and on the pass the
     materialise ENDS the move clears the bit and the draw then sets the
     pose, so (IX+13) comes out of that pass as the held direction and not
     as the 4 $A4C0 wrote.  MEASURED on the real Z80 at a level start:
     (IX+13) reads 05 on the last materialise pass and 02 -- the RIGHT key --
     on the next, with D held.  The pose update is now in drawBookkeeping().*/
  animate(d, eBits){
    if (eBits !== 0 && (this.pass & 1) && !(this.animCtl & 0x10))
      this.animCtl = (this.animCtl + 0x40) & 0xFF;
  }

  /* $A49F BIT 6,(IX+14) / ADD A,8 ; $A4A7 BIT 7,(IX+14) / ADD A,8 -- and the
     SECOND +8 is NESTED INSIDE THE FIRST, so bits 7:6 = 00/01/10/11 give
     +0/+8/+0/+16, not +0/+8/+16/+24.  The walk cycle is therefore A,B,A,C
     and record 8*2 is only ever reached with BOTH bits set.  All four states
     occur in an ordinary walk, and tools/playersprite.py's live gate
     predicts the id from (IX+13),(IX+14),(IX+15) BEFORE the code touches
     them and compares it with the pointer the blitter loads: 12/12 per
     direction for BOTH players.  (A gate that reads A back out of $A4AF
     instead cannot see a wrong phase rule at all -- the register already
     contains the answer.) */
  framePhase(){ return framePhaseOf(this.p); }

  /* Fixed timestep with an accumulator and a stall clamp -- never one update
     per requestAnimationFrame (manual B6/7.2).

     TWO CLOCKS, because the original has two.  The main loop is HALT-paced at
     one pass per four video frames; the game-over loop at $B3B9 contains no
     HALT at all and is clocked only by the ISR's own $8497.  So `play`
     advances in PASS_SECONDS and `over` advances in VIDEO FRAMES -- and the
     pass counter $8491 is not touched while the game is over, which is what
     the original does ($8491 advanced 0 over 100 video frames of $B3B9).   */
  /* THE TICK is the unit the clocks -- and, ONLINE, the relay -- agree
     on: one video frame of $B3B9/$B470/$B494 in `over`/`attract`/
     `rewind`, one whole pass of $8503 in `play`.  Both advance() (the
     offline wall clock) and stepNet() (the wire) step through the SAME
     body below, so the two paths cannot drift apart. */
  tickSeconds(){ return this.mode === 'play' ? PASS_SECONDS : 1/FRAME_HZ; }
  /* one tick of whichever clock the mode runs on; debits acc/simT for
     the tick and its blocking charges; returns true when the caller's
     loop should yield the frame (a level change, or the over-loop's own
     break). */
  stepTick(input){
    const s = this.tickSeconds();
    this.acc -= s; this.simT += s;
    if (this.mode === 'over') return this.overTick();
    /* $B470 and $B494 are VIDEO-FRAME loops with no HALT in them and no
       passes at all -- the third and fourth clocks in this file.  $8491 is
       not touched while either runs, exactly as it is not during $B3B9. */
    if (this.mode === 'attract'){ this.attractTick(input); return false; }
    if (this.mode === 'rewind'){ this.rewindTick(input); return false; }
    /* the held level change: the panel has had its pause, now make it */
    if (this.levelHold){
      this.levelHold = false;
      this.bannerShow = null;
      this.levelOver();
      return true;
    }
    this.onePass(input);
    /* THE BLOCK IS REAL TIME AND IS CHARGED TO THE SAME CLOCK.  A banner
       pass is 104 video frames on the original, not 4, and the game is
       genuinely stopped for the other 100 -- so the accumulator is debited
       for them and the port stands still for 2.0 s exactly as the original
       does.  Without this the sound would be right and the game would run
       through the pause. */
    const extra = (this.passFrames - FRAMES_PER_PASS)/FRAME_HZ;
    if (extra){ this.acc -= extra; this.simT += extra; }
    /* $8556's RET comes AFTER $8550's blit and its pause, so a panel
       raised on the last pass of a level is ON SCREEN, over the room it was
       earned in, for the whole of its own tune -- and the level changes
       only then.  Calling levelOver() in the same breath built the next
       level and raised its entry screen in the same frame, so the pay-out
       panel and the entry screen were drawn on top of each other. */
    if (this.levelDone){
      if (this.bannerShow !== null){ this.levelHold = true; return true; }
      this.levelOver(); return true;
    }
    return false;
  }
  advance(dt,input){
    this.acc += dt;
    if (this.acc > 0.25) this.acc = 0.25;
    this.serveIntroPause();
    while (this.acc >= this.tickSeconds()){
      if (this.stepTick(input)) break;
    }
  }
  /* ONLINE: one lockstep tick, the wire's bytes in.  game.acc is not the
     clock here (the NET layer paces itself on what simT consumed --
     the tick plus any blocking pause it triggered), so it is pinned. */
  stepNet(dirs){
    this.serveIntroPause();
    this.stepTick({ netDirs: dirs });
    this.acc = 0;
  }
  serveIntroPause(){
    if (this.mode !== 'play') return;
    /* $8B98's CALL $9CD7 BLITS THE LEVEL-ENTRY SCREEN AND ITS TAIL PAUSES,
       and both happen BEFORE the level's first pass ($B391 CALL $8503 comes
       after $B38E CALL $8B27).  startLevel() runs BETWEEN passes here, so
       nothing served the pause it armed until the pass below -- and that
       pass takes the screen down at its top, so the tune played over the
       playfield and the screen itself flashed for 5 render frames (0.08 s)
       instead of holding for the whole 210-frame tune.
       Serving it HERE, before any pass, is what the original does.
       The guard is the SCREEN, not `pauseLong`: $9D06 clears $847D bit 2 but
       NOT bit 5, so bit 5 stays set for the rest of the level and a banner
       pause later in the same level would match it.  A banner arms its pause
       INSIDE a pass and blockingPause() at the bottom of that pass already
       serves it correctly, which is why only this one needed moving. */
    if (this.introShow && this.pauseReq){
      const p0 = this.passFrames;
      this.blockingPause();
      /* AND FLUSH THE TUNE.  edge() only accumulates into the bridge's
         `pending`; it is endPass() that sorts it, drops the unchanged levels
         and moves what is left into the log the renderer reads.  Inside a
         pass that happens at the bottom of onePass(); served from HERE there
         is no pass to do it, so the tune sat in `pending` until the NEXT
         pass -- which is after the whole 4.2 s pause, by which time flush()
         had rendered past it and the level tune was SILENT.
         FRAMES = 0 deliberately: endPass's other job is synthesising the
         pass's own frame boundaries for the ISR's border write, and none of
         those land inside the tune -- it runs under the DI at $9CD8, which
         is why $8497 advances by zero across it. */
      if (this.sound.endPass) this.sound.endPass(this.beepBase, 0);
      /* $8B9F RES 5,(IY-2), the instruction right after $8B9C's CALL $9CD7.
         Bit 5 picks the tune at $9D10 -- set is $B8B5, the long level fanfare,
         clear is $B8B0, the short one -- and it is set at $8B84 for the entry
         screen's pause ONLY, then cleared again the moment that pause is
         served.  The port set it at level start and never cleared it, so
         every later pause in the level played the LEVEL tune: the treasure
         pay-out panel came up with the wrong music. */
      this.pauseLong = false;                            // $8B9F RES 5
      const px = (this.passFrames - p0)/FRAME_HZ;
      if (px){
        this.acc -= px; this.simT += px;
        /* ONE BLOCK OF DEBT AT MOST.  In play a level pause cannot follow
           another without a level played in between, so this never bites --
           but jumpToLevel() can start them back to back, and `acc -= px` on
           an already-negative accumulator ADDS another four seconds of dead
           time each time.  Six starts in a row stacked six of them and the
           game sat still for half a minute.  Capping the debt makes a jump
           cost exactly one pause, however many arrive. */
        if (this.acc < -px) this.acc = -px;
      }
    }
  }

  fingerprint(){
    let h=0x811c9dc5;
    const mix=v=>{h^=v&0xFF;h=Math.imul(h,0x01000193)>>>0;};
