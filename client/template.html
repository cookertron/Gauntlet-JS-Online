         $974D  SET 1,(IY-2) / $9751 ($84B8) = 0 / $9755 sound 16

     So the level does not kill you, it EVICTS you: first it stops the doors
     mattering, then it turns the whole maze into a way out.  Reported from
     play before it was ported ("all the doors open... wait even longer and
     all the wall structures turn into exits") and then read out of $971B. */
  hurryPass(){
    if (this.treasure) return;                       // $971B BIT 6,(IY-1)
    const h = this.hurry;                            // $9720 LD A,($84B8)
    if (!this.hurryDoors){                           // $9723 BIT 0,(IY-2)
      if (h < 0x17) return;                          // $975B CP $17 / RET c
      this.hurryDoors = true;                        // $975E SET 0,(IY-2)
      for (let r = 0; r < MAP_H; r++)
        for (let c = 0; c < MAP_W; c++){
          const v = this.map[r][c];                  // $9765 -- the RAW byte
          if (v < 0x11) continue;                    // $9766 CP $11 / JR c
          if (v < 0x13 || v === 0x1F || v === 0x32)  // $976A / $976E / $9772
            this.map[r][c] = 0;                      // $9776 LD (HL),0
        }
      this.hurry = 0;                                // $977E (IY+$39) = 0
      this.sfx(14);                                  // $9782
      return;
    }
    if (this.hurryExits) return;                     // $9729 BIT 1,(IY-2)
    if (h < 0x8C) return;                            // $972E CP $8C / RET c
    for (let r = 0; r < MAP_H; r++)
      for (let c = 0; c < MAP_W; c++){
        const v = this.map[r][c] & 0x7F;             // $9734 AND $7F
        if (v === 0) continue;                       // $9737 JR z
        if (v < 0x11 || (v >= 0x33 && v < 0x36))     // $9739 / $973D / $9741
          this.map[r][c] = 0x36;                     // $9745 LD (HL),$36
      }
    this.hurryExits = true;                          // $974D SET 1,(IY-2)
    this.hurry = 0;                                  // $9751
    this.sfx(16);                                    // $9755
  }


  /* ====================================================================
     $A9C2 -- THE GENERATOR SWEEP, $853D, unconditional, once per pass.

     It walks the VIEWPORT: 16 columns, or 17 when camx&3, by 10 rows, or 11
     when camy&3, starting at the top-left visible cell.  I measured that
     against the real routine in isolation over 1,118 camera positions --
     1,118/1,118 -- by counting the cells it reaches $A9E4 with.  Every
     generator inside that block gets ONE INDEPENDENT ROLL PER PASS, and one
     outside it is completely inert.

       $A9E4  LD A,(HL) / SUB $20 / JR c / CP 15 / JR nc   $20..$2E only
       $A9ED  EX AF,AF'                    stash (v-$20) for $AA82 -- and note
                                           this happens BEFORE the potion
                                           damage block, so a generator damaged
                                           this pass still spawns at its OLD
                                           tier.  (Not reachable here: this
                                           engine has no potion.)
       $AA0B  LD A,($8496) / CP $C0 / JR nc         192 live actors -> no roll
       $AA12  RRA x3 / AND 15 / NEG / ADD A,(IY+$21)
                                           E = $84A0 - ((count>>3) & 15)
       $AA1D  CALL $B575 / CP E / JR nc             spawn attempt iff A < E
       $AA26  CALL $AA5E                   a RANDOM NEIGHBOUR must be empty
       $AA30  CALL $A97F                   the 7x7 actor box must be clear
       $AA35  CALL $AA8C                   not within 7 units of a player
       $AA3A  append (x, y, $7CFE[v-$20] | facing, $04) at the tail

     MEASURED by me in isolation with the count poked: the threshold matches
     $84A0 - ((n>>3)&15) on 33/33 counts including the AND-15 WRAP (E falls
     50 -> 35 as the population goes 0 -> 127 and then JUMPS BACK to 50 at
     128), and n >= 192 produces no roll at all.  $84A0 itself is
     50 + dungeon/2 ($B401/$B466), 10/10 over poked dungeon numbers.

     THE LIMIT OF THIS PORT, stated plainly: $B575 ends
         $B586  LD A,R / SUB L / RET
     i.e. the Z80 refresh register again, exactly like the two coins in the
     actor update, so WHETHER any particular roll spawns cannot be reproduced
     by any port.  The substitute rand8() is used; what is faithful is the
     RATE (accept probability E/256) and every deterministic gate around it.
     MEASURED on the original over the 62-pass down run: 22 rolls reached, ONE
     spawn, at (32,104) with state $00 and flags $04. */
  generatorSweep(){
    if (this.online){
      /* ONLINE: the sweep walks the UNION of the live windows -- each
         cell AT MOST ONCE a pass, or overlapping windows would double a
         generator's roll rate.  Player order, then the original scan
         order inside each window: deterministic, and with one window it
         IS the original scan (the dedupe set never fires). */
      const seen = new Set();
      this.clk.gcells = 0;
      for (const q of this.vcamWins()) this.sweepWindow(q.camX, q.camY, seen);
      return;
    }
    this.clk.gcells = 0;
    this.sweepWindow(this.camX, this.camY, null);
  }
  sweepWindow(camX, camY, dedupe){
    const cols = (camX & 3) ? 17 : 16;                   // $A9CA..$A9D4
    const rows = (camY & 3) ? 11 : 10;                   // $A9D7..$A9E0
    /* the sweep window is gated on camX&3 / camY&3 -- a DIFFERENT pair of
       bits from the painters' camX&2 / camY&2 -- and it costs 86 T a cell
       swept, 531 T more for each generator found and 4,202 T for a spawn. */
    this.clk.gcells += cols * rows;
    let r0 = (camY >> 2) & (MAP_H-1);
    for (let rr=0; rr<rows; rr++){
      let c = (camX >> 2) & (MAP_W-1), r = r0;
      for (let cc=0; cc<cols; cc++){
        if (dedupe){
          const key = (r << 5) | c;
          if (dedupe.has(key)){ const sk = curRight(c,r); c = sk[0]; r = sk[1]; continue; }
          dedupe.add(key);
        }
        const v = this.map[r][c];
        if (v >= GEN_LO && v <= GEN_HI){
          this.clk.ngen++;
          /* $A9EE BIT 3,(IY-1) / JR z,$AA0B -- THE POTION'S OTHER HALF, and
             it is here rather than in throwPotion() because it works on the
             MAP, not on the actor list.  Only generators the sweep window
             reaches are touched, so the potion's reach over generators is the
             sweep's 16/17 x 10/11 cells, not the whole dungeon.

               $A9F4  LD A,(HL) / SUB $1D
               $A9F7  SUB 3 / CP 3 / JR nc,$A9F7   ; A = (v - $20) mod 3, the
                                                   ; TIER inside the type
               $A9FD  CP (IY+$24) / JR nc,$AA06    ; tier >= $84A3 -> weaken
               $AA02  LD (HL),0 / JR $AA51         ; else DESTROY, and the JR
                                                   ; skips the spawn roll
               $AA06  LD A,(HL) / SUB (IY+$24) / LD (HL),A

             $84A3 is 0 for row 0, so the weakest potion leaves generators
             untouched ($AA06 subtracts nothing and $A9FD never destroys).
             `v` is still passed to generatorRoll() below because $A9ED stashed
             the OLD tier in A' BEFORE this block, so a weakened generator
             still spawns at the tier it had on entry. */
          let alive = true;
          if (this.potionArmed){                          // $A9EE
            let tier = v - 0x1D;                          // $A9F5 SUB $1D
            do { tier -= 3; } while (tier >= 3);           // $A9F7 SUB 3/CP 3
            if (tier < this.potionK){                     // $A9FD CP (IY+$24)
              this.map[r][c] = 0;                         // $AA02 LD (HL),0
              alive = false;                              // $AA04 JR $AA51
            } else {
              this.map[r][c] = (v - this.potionK) & 0xFF; // $AA06..$AA0A
            }
          }
          if (alive) this.generatorRoll(v, c, r);
        }
        const nx = curRight(c,r); c = nx[0]; r = nx[1];  // $AA51 CALL $9A2D
      }
      r0 = curDown(0, r0)[1];                            // $AA57 CALL $9A3D
    }
  }
  generatorRoll(v, col, row){
    if (this.actors.length >= GEN_CAP) return;           // $AA0E CP $C0
    const E = (this.spawnBase - ((this.actors.length >> 3) & 15)) & 0xFF;
    const roll = this.rand8();                           // $AA1D CALL $B575
    if (roll >= E) return;                               // $AA22 JR nc
    /* $AA5E -- the destination.  facing = roll & 7 (the SAME byte), the
       direction mask comes from $8418[facing], and the cursor is stepped once
       per set bit in the order up, down, left, right -- so a diagonal facing
       steps twice and a generator can reach any of its eight neighbours.  The
       destination must read EXACTLY zero ($AA7F LD A,(HL) / OR A). */
    const facing = roll & 7;                             // $AA5F AND 7
    const mask = ACT_DIRMASK[facing];                    // $8418[facing]
    let c = col, r = row, p;
    if (mask & 1){ p=curUp(c,r);    c=p[0]; r=p[1]; }    // $AA6D
    if (mask & 2){ p=curDown(c,r);  c=p[0]; r=p[1]; }    // $AA72
    if (mask & 4){ p=curLeft(c,r);  c=p[0]; r=p[1]; }    // $AA77
    if (mask & 8){ p=curRight(c,r); c=p[0]; r=p[1]; }    // $AA7C
    if (this.map[r][c] !== 0) return;                    // $AA29 JR nz
    const x = (c & 0x1F) * 4, y = (r & 0x1F) * 4;        // $9A6B
    if (this.scanFind(x, y, -1) >= 0) return;            // $AA33 JR c
    /* $AA8C -- the proximity refusal, on the SPAWN SQUARE only, and it
       considers EACH PLAYER separately: $AA90 skips player 1 when $842B bit
       7 is set, $AAA9 skips player 2 on $844B bit 7.
         (px+3-x)&$7F < 7 AND (py+3-y)&$7F < 7  ->  carry, abort */
    for (const q of this.players){
      if (q.f11 & F_DEAD) continue;                      // $AA90 / $AAA9
      if (((q.x + 3 - x) & 0x7F) < 7 && ((q.y + 3 - y) & 0x7F) < 7) return;
    }
    this.actors.push({x, y,
                      state: (GEN_STATE[(v - GEN_LO) & 15] | facing) & 0xFF,
                      flags: 0x04,            // bit 2 = GENERATOR-SPAWNED
                      drawX: x, drawY: y});
    /* $B0CE INC (IY+$29) / $B0D1 LD A,12 / $B0D3 JP $BA2B -- the record is
       written FIRST and the sound is the routine's tail call, so a spawn
       that any of the tests above refused is silent. */
    this.sfx(12);                                        // $B0D1/$B0D3
    this.clk.spawn++;                       // $B0D3, 4,202 T of allocation
  }

  /* $B0FE -- the off-screen cull, $853A, which runs BEFORE the sweep.  It is
     what actually bounds the population: the 192 cap is never approached
     because generator-spawned actors are recycled once they are 14 cells
     across or 12.5 down from the camera centre.  ONLY records with flags bit
     2 are eligible -- the dungeon's own monsters are permanent -- and at most
     five go per pass ($B113 LD C,5 / $B152 DEC C).
       $B0FE  E = camx + $20 / D = camy + $14
              |x - E| >= $38  or  |y - D| >= $32  ->  $B12E BIT 2,(HL+2) */
  offScreenCull(){
    let b = this.actors.length;                          // $B103 LD B,A
    this.clk.nact2 = b;                    // $B0FE costs 253 T a live record
    if (b === 0) return;                                 // $B102 RET z
    const ex = (this.camX + CULL_CX) & 0xFF;             // $B107 ADD A,$20
    const ey = (this.camY + CULL_CY) & 0xFF;             // $B10D ADD A,$14
    /* ONLINE: the recycle distance is measured to the NEAREST window's
       centre -- an actor is recycled only once EVERY player has left it
       behind.  Same fold, same limits, per window. */
    const wins = this.online ? this.vcamWins() : null;
    let c = CULL_BUDGET, i = 0;                          // $B113 LD C,5
    while (b > 0 && i < this.actors.length){
      const a = this.actors[i];
      /* $B118/$B121 CALL $AD47 -- NOT a plain difference.  $AD47 is $AD37's
         fold into a signed [-64,63] followed by NEG, i.e. the distance the
         SHORT way round the 128-unit world.  With a plain subtraction an
         actor at x=4 and a camera centre at x=124 reads 120 units away
         instead of 8, and gets culled through the wrap. */
      const near = wins
        ? wins.some(q => wrapAbs(a.x - ((q.camX + CULL_CX) & 0xFF)) < CULL_DX &&
                         wrapAbs(a.y - ((q.camY + CULL_CY) & 0xFF)) < CULL_DY)
        : (wrapAbs(a.x - ex) < CULL_DX && wrapAbs(a.y - ey) < CULL_DY);
      if (near){ i++; b--; continue; }                   // in range
      if (!(a.flags & 0x04)){ i++; b--; continue; }      // $B130 BIT 2,(HL)
      this.actorRemove(i);                               // $B134..$B148 swap
      if (--b === 0) return;                             // $B150 DEC B / RET z
      if (--c === 0) return;                             // $B152 DEC C / JR nz
      /* the JR goes to the DJNZ itself, so B is decremented TWICE per cull --
         the tail record that moved into this slot does not get its own visit
         -- and HL is left on the same slot, which is re-examined. */
      if (--b === 0) return;
    }
  }

  /* ====================================================================
     THE ACTOR PASS -- $851E CALL $AB94.

     $AB94  LD HL,$5B90 ... LDIR              ; clear a 64-byte per-pass ring
     $ABA1  CALL $ADC7 / LD ($AD52),A         ; choose whose player to chase
     $ABA7  LD A,(IY+$17) / RET z / LD B,A    ; B = the count AT ENTRY
     $ABAD  LD IX,$5C00
     $ABB1  LD HL,$ABFF / LD ($A21F),HL / LD A,$CD / LD ($A21E),A
     $ABD2  RES 7,(IY-1) / C=(IX+0) / B=(IX+1) / CALL $A1DA
     $ABE8  BIT 7,(IY-1) / JR nz              ; a record died: do NOT advance
     $ABEE  LD DE,4 / ADD IX,DE / DJNZ
     $ABF5  ... put the three NOPs back at $A21E

     THE UPDATE IS A CALLBACK FROM THE RENDERER.  $ABB1 patches `CALL $ABFF`
     into a three-NOP hole at $A21E which sits inside the sprite draw routine
     $A1DA, AFTER all four of its off-screen culls.  So an actor outside the
     viewport is not merely undrawn, it is FROZEN -- it does not move, retarget
     or animate.  That is why nothing in the first dungeon stirs until the
     camera brings it into view, and it is the whole reason the down table
     used to be wrong: the three ghosts in the corridor wake up at exactly the
     pass the camera reaches camy=26.

     GATED, my own measurement: predicting "reaches $ABFF" from the record's
     coordinates and the camera, matched PAIRWISE per loop visit (a
     swap-remove makes the loop revisit the same IX with new contents, so
     matching by slot index invents mismatches) -- 1883/1883 visits in the
     down run and 1768/1768 with the player warped into the horde, 520 of
     those visible.  0 mismatches.                                        */
  actorPass(){
    /* $AB94 LD HL,$5B90 / LD DE,$5B91 / LD BC,$3F / LD (HL),$FF / LDIR --
       the ring is wiped before the walk, so a claim only lives for the pass
       that made it. */
    this.ring.fill(0xFF);                   // $AB94..$ABA0
    /* $ABBC RES 2 / $ABC0 BIT 1 / $ABC6 RES 1 / $ABCA SET 2 / $ABCE = 7 */
    this.animTick = false;                  // $ABBC RES 2,(IY-1)
    if (this.animPend){                     // $ABC0 BIT 1,(IY-1)
      this.animPend = false;                // $ABC6 RES 1,(IY-1)
      this.animTick = true;                 // $ABCA SET 2,(IY-1)
      this.animCtr = 7;                     // $ABCE LD (IY+$1A),7
    }
    let i = 0;
    // B is loaded ONCE, so the loop runs exactly count-at-entry times
    this.clk.nact = this.actors.length;     // $ABA7 LD A,(IY+$17) -- the cost
    for (let n = this.actors.length; n > 0; n--){
      if (i >= this.actors.length) break;
      const a = this.actors[i];
      a.drawX = a.x; a.drawY = a.y;     // $ABD7: the blit gets the OLD pair
      this.clockCensusActor(a);         // which of $A1DA's clips he leaves by
      if (!this.actorVisible(a)) { i++; continue; }     // $A1DA's four RET nc
      if (this.actorUpdate(i)) continue;  // removed: $ABE8 keeps IX put
      i++;
    }
  }

  /* $A1DA, read to its RET nc's.  The window is the visible playfield plus a
     3-unit margin: 0..$42 across (67 units) and 0..$2A down (43 units). */
  actorVisible(a){
    /* ONLINE: awake if visible to ANY live window -- same arithmetic,
       same 3-unit margin, per window (see vcamPass). */
    if (this.online){
      for (const q of this.players){
        if (!q.camLive) continue;
        if (((a.x + 3 - q.camX) & 0x7F) > ACT_CULL_X) continue;
        if (((a.y + 3 - q.camY) & 0x7F) > ACT_CULL_Y) continue;
        return true;
      }
      return false;
    }
    if (((a.x + 3 - this.camX) & 0x7F) > ACT_CULL_X) return false;
    if (((a.y + 3 - this.camY) & 0x7F) > ACT_CULL_Y) return false;
    return true;
  }

  /* $ABFF..$AD1B -- ONE actor's update.  Transcribed instruction by
     instruction and then differential-tested against the real Z80: feeding
     the two R coins from a trace and comparing all four record bytes after
     every update gave 4,589 agreements and 0 mismatches over eight drives,
     covering all six classes (forced by repainting live records) and all four
     outcomes -- moved / blocked / no-move / walked-into-the-player. */
  actorUpdate(i){
    const a = this.actors[i];
    let E = a.state;                        // $AC00 LD A,(IX+2) / LD E,A
    let facing = a.state & 7;               // $AC04 AND 7 / EX AF,AF'  (A')
    /* $AC07 BIT 3,(IY-1) / CALL nz,$AF5D -- the potion sweep, applied to THIS
       actor as its update begins.  $AF5D ITSELF has no radius test, but this
       call site is reached only through $A1DA's four RET nc's, so the potion's
       reach is exactly the ACTOR CULL WINDOW -- the visible playfield plus a
       3-unit margin -- and it lands in ONE pass, not over the five $84A1
       counts.  MEASURED: from the captured state all 63 actors are off-camera
       and $AF5D is entered 0 times; parking six of them on the player gives
       6 entries on the throwing pass, 0 on every pass after it, $84A2 = BCD 06
       and the live count 63 -> 57 (`python tools/potiongate.py swarm`).
       The call site is reached by SELF-MODIFYING CODE: $ABB1 writes
       `CALL $ABFF` into $A21E for the duration of the actor walk and $ABF5
       writes three zero bytes back over it, so $A1DA's other four callers run
       the same routine with the hook absent.
       potionHit() returns null when it killed the actor, and the
       original signals that by DISCARDING TWO RETURN ADDRESSES ($AF6E POP AF /
       EXX / POP AF / RET) -- the C1 idiom, "abandon the rest of this update". */
    if (this.potionArmed){                              // $AC07 BIT 3,(IY-1)
      const r = this.potionHit(i, E);                   // $AC0B CALL nz,$AF5D
      /* TRUE, not a bare return: this is the "removed" signal actorPass()
         tests, and it is $ABE8 BIT 7,(IY-1) / JR nz,$ABF3 -- the removal at
         $AE9B SET 7,(IY-1) makes the loop SKIP `ADD IX,DE`, so the actor that
         $AE7E swapped into this slot is examined on the next iteration
         instead of being stepped over.  Returning undefined here advanced the
         cursor and silently skipped that actor: a potion thrown into a crowd
         killed roughly two thirds of it and left a band standing.  Invisible
         with the six-actor scenarios this gate started with, because the
         actor swapped in came from the far end of the list and was off camera
         anyway -- which is what swarm-big is for. */
      if (r === null) return true;                      // killed: unwound
      E = r;
    }

    /* $AC0E  LD A,IXL / RRA / RRA / XOR (IY+$12) / RRA / JR c
       IXL = 4*slot, so the carry after the third RRA is (slot ^ pass) & 1:
       every actor tries to move on alternate passes, staggered by slot
       parity, which is how the rate stays independent of how many are alive.
       Combined with $ADF8's 2 units per step that is 1 unit per pass -- HALF
       the player's 2.  Classes >= 5 ($A0) get an extra go when bit 1 of the
       pass counter is set (3 passes in 4); READ, and exercised only by
       repainting a live record, since dungeon 1 is entirely class 0. */
    if (!((i ^ this.passCtr) & 1)){
      if (E < 0xA0 || !(this.passCtr & 2)) return this.actorTail(i, E);
    }

    const coin = this.rand8();              // $AC25 LD A,R
    if (!(coin & 1)){                       // bit 0 SET keeps the facing
      const aim = this.actorAim(a);         // $AC2A CALL $AD51 -> $AD77
      let D = aim.slot;
      // $AC2D  class 3 ($60) within 12 units of the player FLEES: XOR 4
      // reverses the compass slot.  READ + differential-tested by repaint.
      if ((E & 0xE0) === 0x60 && aim.dist < 12) D ^= 4;
      E = E & 0xF8;                         // $AC40 clear the facing field
      facing = D;                           // $AC44 LD A,D / EX AF,AF'
      /* $AC46 the wall follower.  If the last try was blocked, the desired
         direction is deflected to one of its two perpendiculars, and bit 4
         chooses which side.  The DEFLECTED direction is what gets walked; the
         UNDEFLECTED one is what gets stored if the move fails ($ACA5). */
      if (a.flags & 0x20){
        const coin2 = (coin + 57) & 0xFF;   // $AC4C -- see rand8()'s note
        if (coin2 & 3) D = ACT_DEFLECT[D + ((a.flags & 0x10) ? 1 : 0)];
      }
      E |= D;                               // $AC60
    }

    /* $AC63 CALL $ADF8 -- the actor's OWN step and wall probe.  It is not the
       player's: 2 units per set mask bit (so a diagonal moves on BOTH axes in
       one step, which the player never does), no `BIT 1` gate, and up to FOUR
       cells tested -- the 2x2 block a 16x16 body straddles -- where ANY
       non-zero map value blocks (`$AE2D LD A,(HL) / OR A / RET nz`).  There
       is no door rule and no interaction range: an actor cannot open a door
       and is stopped by things the player walks over. */
    this.clk.step++;                    // $AC63 CALL $ADF8 -- one probe
    const step = this.actorProbe(a.x, a.y, ACT_DIRMASK[E & 7]);
    if (!step.blocked){
      this.clk.contact++;               // $AC68 CALL $AEA0 -- one 7x7 sweep
      /* $AC68 CALL $AEA0 -- is a live player standing on the candidate
         square?  7x7, same box as the scan, measured against $842B's bit 7
         for "player 1 is in play". */
      const victim = this.actorTouchesPlayer(step.x, step.y);
      if (victim){
        /* $AEA6 sets IX to the player it matched and $AEB2/$AED6 load HIS
           armour row, so `p` names the victim for the whole melee. */
        const savedP = this.p; this.p = victim;
        try {
        this.hurry = 0;                     // $AEE5 LD (IY+$39),0
        a.flags &= ~0x08;                   // $AEEF RES 3
        if ((E & 0xE0) === 0){
          /* $AEF8: class 0 damages the player and DESTROYS ITSELF, then pops
             two return addresses so the draw never happens. */
          const tier = (a.state>>3)&3;
          this.hurt(this.ghostDmg[tier]);        // $A627, tier -> $8437..$8439
          this.sfx(0);                           // $AEFB SUB A / $AEFC
          this.actorRemove(i);
          return true;
        }
        a.flags &= ~0x20;                   // $AF06 RES 5
        if ((E & 0xE0) === 0xA0){
          /* $AF26 -- the class-5 DRAIN: a flat 4 EVERY pass in contact, with
             no countdown gate and no armour, accumulated in a per-slot cell
             at $5B60 + (IXL>>1) (+1 for player 1) until it reaches $C8 = 200,
             at which point the monster destroys itself and deals nothing on
             that pass.  MEASURED: 14 passes of contact cost 41 health (ten
             drains of 4 plus one $B6DA tick) and the 50th contact kills it.
             IXL wraps, so slot 64 aliases slot 0 -- reproduced. */
          const k = (i * 4) & 0xFF;                      // IXL = 4*slot
          const acc = ((this.drain[k >> 1] || 0) + 4) & 0xFF;
          this.drain[k >> 1] = acc;
          if (acc >= 0xC8){ this.actorRemove(i); return true; }
          this.hurt(4);
          this.sfx(2);                                   // $AF42/$AF44
        } else if ((a.flags & 3) === 0){
          /* $AF11 -- classes 1..4 attack, and the ATTACK COUNTDOWN in the low
             two bits of the flags byte refuses a second hit until it clears.
             The damage comes from $843A..$843C by tier, and $AF49 tests BIT 3
             before BIT 4 exactly like $A627, so tier 3 aliases tier 1.
             The SOUND is armed at $AF19, BEFORE $AF21's damage call, and it
             is inside the `AND 3 / JR nz` gate: an attack that the countdown
             refuses is silent as well as harmless. */
          a.flags |= 0x02;                               // $AF15 SET 1
          this.sfx(10);                                  // $AF19/$AF1B
          this.hurt(this.foeDmg[(a.state >> 3) & 3]);    // $AF21 CALL $AF49
        }
        return this.actorTail(i, E);
        } finally { this.p = savedP; }
      }
      /* $AC77 CALL $A97F -- the SAME 7x7 scan the player's move uses, with
         the actor hidden from itself. */
      if (this.scanFind(step.x, step.y, i) < 0){
        a.x = step.x; a.y = step.y;         // $AC7C commit
        a.flags &= ~0x20;                   // $AC82 RES 5
        this.actorBlink(a, E);              // $ACA8
        return this.actorTail(i, E);
      }
    }
    /* $AC8D  the move failed.  BC reverts, bit 4 flips if we were ALREADY
       blocked (so the wall follower tries the other side next time), bit 5 is
       set, and the facing written back is the UNDEFLECTED one. */
    if (a.flags & 0x20) a.flags ^= 0x10;    // $AC9A XOR $10
    a.flags |= 0x20;                        // $AC9C OR $20
    E = (E & 0xF8) | facing;                // $ACA1..$ACA7
    this.actorBlink(a, E);
    return this.actorTail(i, E);
  }

  /* $ACA8..$ACBF -- class 4 ($80) only: the phase counter reaching $C0 toggles
     the INVISIBLE bit, and being blocked forces it visible.  Class 4 blinks.
     READ + differential-tested by repainting live records (570/570). */
  actorBlink(a, E){
    if ((E & 0xE0) !== 0x80) return;
    if (a.flags >= 0xC0) a.flags ^= 0x08;
    if (a.flags & 0x20) a.flags &= 0xF7;
  }

  /* $ACC2..$ACF2 -- the tail every path falls into: the class 2/3 shot, the
     animation tick, and the write-back of the state byte. */
  actorTail(i, E){
    const a = this.actors[i];
    /* $ACC2 AND $E0 / CP $40 / JR c  then  $ACC9 CP $80 / CALL c,$AF8F --
       classes 2 and 3, and nothing else, get a chance to shoot. */
    const fc = E & 0xE0;                    // $ACC3
    if (fc >= 0x40 && fc < 0x80) this.actorFire(a, E, fc);   // $ACC9
    if (this.animTick){                     // $ACCE BIT 2,(IY-1)
      const cls = E & 0xE0;
      // $ACD5: classes 0 and 3 always animate; everything else stops while
      // it is blocked.
      if (cls === 0 || cls === 0x60 || !(a.flags & 0x20)){
        let d = (a.flags + 0x40) & 0xFF;    // $ACE4 ADD A,$40
        if (d & 3) d = (d - 1) & 0xFF;      // $ACEA AND 3 / DEC D
        a.flags = d;
      }
    }
    a.state = E;                            // $ACF2 LD (IX+2),E
    return false;                           // nothing was removed
  }

  /* $AD1C + $AD9B -- the chase.  $AD37 folds a 7-bit difference into a signed
     byte in [-64,63] (so the world wraps the short way), $AD1C returns the
     MANHATTAN distance, and $AD9B turns the two signs into a compass slot:
        dy==0 -> 2 (E) if dx<0 else 6 (W)
        dx==0 -> 0 (N) if dy>=0 else 4 (S)
        dx<0  -> 3 (SE) if dy<0 else 1 (NE)
        dx>0  -> 5 (SW) if dy<0 else 7 (NW)
     The sign test at $ADB4 is `JP p` on 0-L, which differs from "bit 7 of L"
     only at L = $80 -- a value $AD37 can never produce.

     $ADC7 -- WHO THE MONSTERS CHASE.  It runs once per pass and patches the
     JR displacement at $AD52, and this file's old note ("measured $24 on
     301/301, so only that arm is ported") was a one-player artefact:

       $ADC7  C = ($842A), B = ($844A)        the $18 POWER-UP counters
       $ADCD  BIT 7,(IY-$2B) = $8454 bit 7    is player 2 in the game?
       $ADD3  out: A = $24 chase player 1 if C == 0, else $00 RANDOM
       $ADDA  in:  C != 0                      -> $ADF1
       $ADDE  BIT 7,(IY-$54) = $842B bit 7     player 1 out of play -> $ADF1
       $ADE4  B != 0 -> $24 chase player 1
       $ADE9  BIT 7,(IY-$34) -> $24 chase player 1
       $ADEE  A = $2F CHASE THE NEARER
       $ADF1  B == 0 -> $19 chase player 2, else $00 RANDOM
     -- so the FIRST thing it branches on is neither of the two presence bits
     but the map-$18 power-up, which is a MONSTER REPELLENT: hold it and the
     pack stops chasing you.  $2F is $AD82, which measures the distance to
     each player and keeps the smaller, TIES GOING TO PLAYER 1.
     PROVISIONAL: the $00 arm ($AD53) is a random turn off `CALL $B575`, i.e.
     the unreproducible refresh register, and it is NOT ported -- the port
     keeps chasing player 1 there and says so.  It is unreachable in the four
     one-player differentials, which is why they do not move: reaching it
     needs the $18 power-up, and $842A is 0 on every pass of all four runs
     (asserted headlessly). */
  chaseTarget(){
    const [p1, p2] = this.players;
    if (p2.p14 & 0x80){                                  // $ADCD BIT 7,$8454
      return p1.timer === 0 ? 0x24 : 0x00;               // $ADD3..$ADD9
    }
    if (p1.timer === 0 && !(p1.f11 & F_DEAD)){           // $ADDA / $ADDE
      if (p2.timer !== 0) return 0x24;                   // $ADE4 RET nz
      if (p2.f11 & F_DEAD) return 0x24;                  // $ADE9 RET nz
      return 0x2F;                                       // $ADEE the NEARER
    }
    return p2.timer === 0 ? 0x19 : 0x00;                 // $ADF1..$ADF7
  }
  actorAim(a){
    const aimAt = q => {
      const L = wrap7(a.x - q.x), H = wrap7(a.y - q.y);
      const dist = ((L<0x80?L:(-L)&0xFF) + (H<0x80?H:(-H)&0xFF)) & 0xFF;
      let slot;
      if (H !== 0){
        if (L !== 0) slot = (L & 0x80) ? ((H & 0x80) ? 3 : 1) : ((H & 0x80) ? 5 : 7);
        else         slot = (H & 0x80) ? 4 : 0;
      } else         slot = (L & 0x80) ? 2 : 6;
      return {dist, slot};
    };
    const [p1, p2] = this.players;
    switch (this.chaseTarget()){
      case 0x19: return aimAt(p2);                       // $AD6C
      case 0x2F: {                                       // $AD82
        const a1 = aimAt(p1), a2 = aimAt(p2);
        /* $AD92 CP (the self-modified operand) / JR nc,$AD9A keeps player
           1's on a TIE -- the second distance must be strictly smaller. */
        return a2.dist < a1.dist ? a2 : a1;
      }
      default: return aimAt(p1);                         // $AD77, and the
    }                                                    // unported $00 arm
  }

  /* $ADF8..$AE6C -- step and probe.  $AE1D computes the map address inline as
     $8000 + 32*(y>>2) + (x>>2) with its own column wrap (AND $1F / SUB $20)
     and row wrap (INC H / SUB 4 / CP $80). */
  actorProbe(x, y, mask){
    let nx = x, ny = y;
    if (mask & 1) ny = (ny - 2) & 0x7F;     // $AE01 DEC B,DEC B,RES 7,B
    if (mask & 2) ny = (ny + 2) & 0x7F;     // $AE08
    if (mask & 4) nx = (nx - 2) & 0x7F;     // $AE0F
    if (mask & 8) nx = (nx + 2) & 0x7F;     // $AE16
    const row = (ny >> 2) & (MAP_H-1), col = (nx >> 2) & (MAP_W-1);
    let blocked = this.map[row][col] !== 0;                         // $AE2D
    if (!blocked && (nx & 3))                                       // $AE30
      blocked = this.map[row][(col+1) & (MAP_W-1)] !== 0;
    if (!blocked && (ny & 3)){                                      // $AE43
      const r2 = (row+1) & (MAP_H-1);
      blocked = this.map[r2][(nx & 3) ? (col+1) & (MAP_W-1) : col] !== 0;
      if (!blocked && (nx & 3)) blocked = this.map[r2][col] !== 0;  // $AE5A
    }
    return {x:nx, y:ny, blocked};
  }

  /* $AEA0 -- 7x7 against each live player, on the CANDIDATE square.  Player
     1's box ($AEA6, gated by $842B bit 7) is tested BEFORE player 2's
     ($AECA, gated by $844B bit 7) and the first match wins, so on a monster
     standing between them player 1 takes the hit.  The two arms load
     different armour rows ($8437 vs $8457) and pass D=1 / D=0, which is how
     the damage follows the character each player chose.
     This is the one rule in the update that the differential could not
     exercise -- $AEA0 was called 602 times in 60 measured passes and
     returned carry on 32 of them, all class 0, so the class-0 arm IS
     measured; the class 1..5 arms are a reading of $AF06..$AF25.  Returns
     the player it hit, or null.  READ, not driven: which of the two the
     original picks when both are in range. */
  actorTouchesPlayer(cx, cy){
    for (const q of this.players){
      if (q.f11 & F_DEAD) continue;                      // $AEA0/$AEC5 BIT 7
      if (((q.x + 3 - cx) & 0x7F) < 7 && ((q.y + 3 - cy) & 0x7F) < 7) return q;
    }
    return null;
  }

  /* =====================================================================
     $8524 CALL $8BCA -- THE SHOT SUBSYSTEM.

     A player's shot is NOT an actor slot and NOT a table.  It is three live
     bytes inside his own 32-byte block -- $8430 x, $8431 y, $8432 state --
     plus the constant tag at $8433, which is why the routine reaches the
     player through NEGATIVE displacements ($8C74 BIT 4,(IX-9) is $8427).
     So exactly one shot per player exists, ever, and there is no cooldown of
     any kind: the next shot spawns on the first pass the state byte is $FF
     again, which makes the fire rate purely the flight time.

     MEASURED in an open arena with the camera SETTLED first, holding fire for
     120 passes and hooking the spawn at $8C94 (`python tools/shotgate.py
     cadence`):

         N NE SE S SW NW   24 fires   gap histogram {5: 23}
         E W               15 fires   gap histogram {8: 14}

     -- flight time + 1 and nothing else, which is what the 61 x 37 cull
     window predicts.  Taking that measurement BEFORE the camera converges
     gives a completely different and meaningless answer (gaps of 1, because
     the shot is culled on its first step while the camera is still 30 units
     away); one of the four reports this port is built on did exactly that.

     state $FF  = no shot; bit 7 = born this pass (the first step skips both
     collision scans, which is what stops a player shooting himself); bits 2:0
     = the compass slot; bits 7:3 = the character's shot tag; and the value
     $20 exactly = EXPLODING, drawn once and freed at the top of the next
     pass.                                                                */
  /* $8BCA..$8C01 -- THE POTION PAY-OUT, the HEAD of $8524's routine and
     therefore a main-loop step in its own right, run ONCE rather than per
     player.  ($8C05 onward is the shot subsystem, which is per player and is
     shotPass() below.)

       $8BCA  BIT 3,(IY-1) / JR z,$8C01     the sweep must be ARMED
       $8BD0  BIT 0,(IY-1) / JR nz,$8C01    ...and the SUSTAIN bit clear
       $8BD6  LD IX,($84A6)                 the THROWER, as a block pointer
       $8BDA  LD B,10 / LD DE,0 / LD C,(IY+$23)          C = $84A2
       $8BE2  DE = BCD(DE + C), ten times   so 10 points an actor TOUCHED
       $8BED  CALL $B807                    added to the thrower's score
       $8BF0  LD A,(IY+$33) / OR A / JR z   $84B2, the class-5+ tally
       $8BF6  LD B,A / LD E,0 / LD D,(IY+$34)            D = $84B3
       $8BFC  CALL $B807 / DJNZ $8BFC       $84B3 HUNDREDS per tallied actor
       $8C01  RES 0,(IY-1)                  and the sustain bit is cleared
                                            here on EVERY path

     $8BED IS CALLED EVEN WHEN THE TALLY IS ZERO, and $B807's own tail is
     $B823 SET 1,(IX+11).  So every throwing pass marks the thrower's SCORE
     DIRTY whether or not anything died -- and that single bit is why the
     re-throw interval is not the countdown's five passes: it makes the HUD
     take its early return at $B73E on the next pass the round robin picks
     this player's score, which delays $B7B1's clear of the spend debounce.
     Measured from the captured state the throws land on passes 1, 7 and 12,
     i.e. 6 then 5 (`python tools/potiongate.py hold-3`).  A version of this
     port without this call re-threw every 5 passes flat. */
  potionScore(){
    if (this.potionArmed && !this.f847E_bit0){        // $8BCE / $8BD4
      const save = this.p;
      this.p = this.players[this.potionBy & 1];       // $8BD6
      let d = 0, e = 0;                               // $8BDC LD DE,0
      const c = this.killTally;                       // $8BDF LD C,(IY+$23)
      for (let b = 0; b < 10; b++){                   // $8BDA LD B,10
        const r = daaAdd(e, c, 0); e = r.v;           // $8BE2..$8BE5
        d = daaAdd(d, 0, r.c).v;                      // $8BE6..$8BEA
      }
      this.scoreAdd(((d << 8) | e) & 0xFFFF);         // $8BED CALL $B807
      /* $8BF6 LD B,A -- the count is the BCD byte read as BINARY, because
         DJNZ does not know it is BCD.  Reproduced rather than corrected. */
      for (let b = this.genTally; b > 0; b--)         // $8BF0/$8BF6
        this.scoreAdd((this.b3 << 8) & 0xFFFF);       // $8BFC E=0 D=$84B3
      this.p = save;
    }
    this.f847E_bit0 = 0;                              // $8C01 RES 0,(IY-1)
  }

  shotPass(){
    this.shotUpdate();                  // $8C05 CALL $8C43
    /* $8C08 CALL $8FC5 drains the $5B90 ring into the MONSTER-SHOT array at
       $5B20 (stride 4, count $84A8) and $8C0B runs it through the same
       $8C5D body with flags bit 7 set.  BOTH ARE PORTED -- ringDrain() and
       monsterShotPass(), called from the pass right after this one runs for
       each player, and $AF8F is actorFire()/actorFire3() above.  The note
       that used to sit here said none of it was; $84A8 reads 0 on every pass
       measured in dungeon 1, which is why it went unnoticed so long.
       Gated by `python tools/mshotgate.py`. */
  }

  /* $8C43 -- the dispatcher, which hard-codes the two player blocks:
       $8C43  LD IX,$8430 / CALL $8C5D / JR c,$8C50 / LD (IX+2),$FF
       $8C50  LD IX,$8450 / CALL $8C5D / RET c      / LD (IX+2),$FF
     CARRY CLEAR KILLS THE SHOT.  BOTH arms are ported: the pass calls
     shotPass() once per player with this.p swapped, which is what $8C43's
     two LD IX pairs do.  This line used to say player 2's was not. */
  shotUpdate(){
    if (!this.shotBody(this.shot, this.p)) this.shot.state = 0xFF;  // $8C4C
  }

  /* $8D97/$8DA1's cull, window-aware.  ONLINE a player's shot lives
     against its OWNER's window -- shot range IS the screen, so online it
     is the owner's screen -- and a MONSTER shot (no owner) lives while
     ANY window still shows it, the same rule its firer's wake-up follows.
     The fold and the Y-then-X order are the original's. */
  shotCulled(cx, cy, owner){
    if (!this.online)
      return wrap7((cy - this.camY) & 0xFF) >= SHOT_CULL_Y ||
             wrap7((cx - this.camX) & 0xFF) >= SHOT_CULL_X;
    if (owner)
      return wrap7((cy - owner.camY) & 0xFF) >= SHOT_CULL_Y ||
             wrap7((cx - owner.camX) & 0xFF) >= SHOT_CULL_X;
    for (const q of this.vcamWins())
      if (wrap7((cy - q.camY) & 0xFF) < SHOT_CULL_Y &&
          wrap7((cx - q.camX) & 0xFF) < SHOT_CULL_X) return false;
    return true;
  }

  /* $8C5D..$8DB6 -- the shared updater.  Returns the CARRY: true = keep. */
  shotBody(s, owner){
    /* `owner` is the player whose block supplies the SPAWN gates -- the
       original reaches him through negative displacements from IX ($8C74
       BIT 4,(IX-9) is $8427).  A MONSTER shot has no owner: IX is a record in
       the $5B20 array and those displacements would be nonsense, which is
       exactly why $8C6E BIT 7,(IX+3) jumps the whole block. */
    const mon = !owner;
    s.drawn = false;
    let A = s.state;
    if (A === 0x20){                                     // $8C60 CP $20
      A = 0xFF; s.state = 0xFF;                          // $8C64/$8C66
      /* $8C69 BIT 7,(IX+3) / RET nz -- and the RET carries the flags from
         $8C60's CP $20, which matched, so CARRY IS CLEAR.  For a player that
         is just his one shot going idle, but for a MONSTER shot carry clear
         is what $8C19 reads as "this record is finished", and it is the only
         thing that ever removes one from the array.  Without it the port kept
         every spent shot as a dead $FF record for ever and the array filled
         to its cap of 16, after which no monster could fire again. */
      if (mon) return false;                             // $8C6D RET nz
    }
    /* $8C6E BIT 7,(IX+3) -- a MONSTER shot skips the whole spawn block and
       jumps straight to $8CB6.  Its type byte always has bit 7 set ($8FC5
       writes a literal $80), which is exactly what makes this test work. */
    /* THE SIX SPAWN GATES, $8C74..$8C8E, in the original's own order.  Each
       was blocked one at a time on the real Z80 and the spawn count went to
       zero for every one of them (`python tools/shotgate.py gates`). */
    if (!mon &&                                          // $8C6E BIT 7,(IX+3)
        (this.dir & DIR_FIRE) &&                         // $8C74 BIT 4,(IX-9)
        A === 0xFF &&                                    // $8C7A one at a time
        !(this.p14 & 0x40) &&                            // $8C7D BIT 6,(IX+4)
        (this.animCtl & 3) === 0 &&                      // $8C83 (IX-2) AND 3
        !(this.f11 & F_EXITING)){                        // $8C8A BIT 6,(IX-5)
      /* $8C83's gate is on the LOW TWO BITS of $842E, whose top two are the
         walk phase.  It never blocks in dungeon 1 -- 0 on 60/60 visits -- and
         it must be measured AT $8C83, not by poking at the loop top: $A4C4,
         inside $8521 CALL $A43B, clears bit 0 before $8524 runs.
         IT DOES BLOCK, and this file used to say it could not: bit 1 is the
         teleport arm and bit 2 the flight, so during the four transit passes
         $842E reads $06 and NO SHOT IS BORN even with fire held; one is born
         on the pass $B225 clears it.  MEASURED by hooking $8C94 on the real
         Z80 (IX there is $8430, so IX-2 is $842E).  This engine used to keep
         the arm in a boolean of its own where AND 3 could not see it, which
         let it fire mid-teleport; the flags now live in animCtl. */
      this.hurry = 0;                     // $8C90 -- EVERY SHOT RESETS $84B8
      s.x = this.x; s.y = this.y;         // $8C94/$8C9A -- his exact position
      /* $8CA0 ADD then OR $80: state = tag + compass slot, born-bit set.  The
         slot is (IX-3) = $842D, which $A43B wrote in the CALL immediately
         before this one, so a shot flies the way the player FACES -- and the
         facing still turns while fire is held even though he cannot move. */
      s.state = ((this.shotTag + this.frameSlot) | 0x80) & 0xFF;
      this.sfx(4);                        // $8CAB
    }
    A = s.state;                          // $8CB0 -- RELOADED, so a fresh shot
    if (A === 0xFF) return true;          // $8CB3 INC A / SCF / RET z
    /* $8CB6 BIT 6,(IX+3) -- THE THIRD VELOCITY ENCODING, and $B060's class-3
       shot is what creates one.  Instead of an 8-way step from $7D7C the
       state byte carries a SUB-CELL VECTOR:
         bits 1:2  the x magnitude, +1 if bit 0 is set and flags bit 0 is not
         bit  3    the x sign
         bits 5:6  the y magnitude, +1 if bit 4 is set and flags bit 0 is not
         bit  7    the y sign
       and it takes ONE step a pass ($8CF3 LD A,1), not two.  $8D1F then calls
       $90AD, the lifetime counter, whose carry $8D31 JP c,$8D97 reads as
       "expired -- skip both collision scans". */
    const fine = mon && (s.flags & 0x40);            // $8CB6 BIT 6,(IX+3)
    /* $8CF9 LD A,2 / $8CFB BIT 7,(IX+3) / JR nz,$8D08 -- the speed bump is
       read ONLY for a player shot, so a monster shot always steps 2 and never
       reads (IX+4), which for it would be the next record's x. */
    let steps = fine ? 1 : 2;                            // $8CF3 / $8CF9
    if (!mon && (this.p14 & 0x10)) steps++;              // $8D01 SHOT SPEED
    for (;;){
      let C, B, expired = false;
      if (fine){
        /* $8CBC..$8CF2 -- the sub-cell step, both axes the same shape. */
        const E2 = s.state;
        let ax = (E2 >> 1) & 3;                          // $8CC0 RRCA / AND 3
        if ((E2 & 1) && !(s.flags & 1)) ax++;            // $8CC3 / $8CC7
        if (E2 & 8) ax = (-ax) & 0xFF;                   // $8CCE BIT 3 / NEG
        C = (s.x + ax) & 0xFF;                           // $8CD4 ADD A,(IX)
        let ay = (E2 >> 5) & 3;      // $8CD8 RLCA x3 / AND 3 -- bits 5:6
        if ((E2 & 0x10) && !(s.flags & 1)) ay++;         // $8CDE / $8CE2
        if (E2 & 0x80) ay = (-ay) & 0xFF;                // $8CE9 BIT 7 / NEG
        B = (s.y + ay) & 0xFF;                           // $8CEF ADD A,(IX+1)
        const lf = this.shotLife(s, B);                  // $8D20 CALL nz,$90AD
        B = lf.B; expired = lf.carry;
        C &= 0x7F; B &= 0x7F;                            // $8D27 RES 7,C / B
        s.x = C; s.y = B;                                // $8D2B the commit
      } else {
        const st = SHOT_STEP[s.state & 7];               // $8D09 $7D7C[slot*2]
        C = (s.x + st[0]) & 0x7F;                        // $8D15 + $8D27 RES 7
        B = (s.y + st[1]) & 0x7F;                        // $8D1B + $8D29 RES 7
        s.x = C; s.y = B;                                // $8D2B the commit
      }
      if (expired){                                      // $8D31 JP c,$8D97
        if (this.shotCulled(C, B, owner)) return false;
        this.shotDraw(C, B, s); return true;
      }
      /* BC is NOT the record from here on.  $8F36 pushes BC, applies the
         diagonal probe offsets in place, and on any NON-ZERO cell pops the
         saved pair into DE instead of BC -- so a shot that flew over a key or
         an exit carries the offset coordinates through the rest of the step,
         and one that STOPPED carries them into the RES 1 as well.  Only when
         the cell is exactly 0 does $8F59 POP BC put them back.  Everything
         downstream -- both collision scans, the cull AND the draw -- uses
         that register pair, never the record.  Missing it costs the left and
         up columns of the shot differential: an impact at x=2 with the camera
         at 2 culls in the original ($8D39 makes it 0 and 0-2 folds negative)
         and does not cull without it. */
      const probe = this.shotMap(C, B, s.state & 7);     // $8D34 CALL $8F36
      let cx = probe.x, cy = probe.y, expire = false;
      if (probe.stop){
        cx &= ~2; cy &= ~2;                              // $8D39 RES 1,B / C
        expire = true;
      } else if (fine){
        /* $8D3F BIT 7,(IX+3) / JR z / $8D45 BIT 6,(IX+3) / JR nz,$8D55 -- a
           CLASS-3 shot goes straight to the collision scan and never reaches
           $8D4F's RES 7,(IX+2).  It must not: for these shots bit 7 of the
           state is the Y SIGN, not a born flag, and clearing it turns the
           vector upside down.  The port did exactly that and the gate caught
           it on the third pass of the first upward-aimed flight. */
        const i = this.shotFindActor(cx, cy);            // $8D55 CALL $8EEB
        if (i >= 0){ this.shotHitActor(i, s); expire = true; }
        else if (this.shotHitPlayer(cx, cy, s)) expire = true;
      } else {
        const born = s.state & 0x80;                     // $8D4B BIT 7,(IX+2)
        s.state &= 0x7F;                                 // $8D4F RES 7,(IX+2)
        if (!born){
          const i = this.shotFindActor(cx, cy);          // $8D55 CALL $8EEB
          if (i >= 0){ this.shotHitActor(i, s); expire = true; }
          else if (this.shotHitPlayer(cx, cy, s)) expire = true; // $8D8A $9009
        }
      }
      /* $8D8F LD (IX+2),$20 / $8D93 RES 6,(IX+3) -- expiring drops bit 6 as
         well as setting the exploding state, so a class-3 shot stops being a
         class-3 shot the moment it lands: it draws as the shared explosion
         and takes the ordinary path out. */
      if (expire){ s.state = 0x20; s.flags &= ~0x40; }   // $8D8F / $8D93
      /* $8D97/$8DA1 -- the cull.  $AD37 FOLDS but does not ABS, so one unit
         above or left of the camera origin already reads >= the limit. */
      if (this.shotCulled(cx, cy, owner)) return false;
      if (s.state === 0x20){ this.shotDraw(cx, cy, s); return true; } // $8DAB
      if (--steps === 0){ this.shotDraw(cx, cy, s); return true; }    // $8DB2
    }
  }

  /* $8DB7..$8EB6 -- the draw, which always ends SCF / RET, so a shot that got
     this far is KEPT.  Only the position is simulation; which record and how
     it is blitted is display state and lives in the renderer. */
  shotDraw(x, y, s){
    const t = s || this.shot;
    t.drawX = x; t.drawY = y; t.drawn = true;
  }

  /* ====================================================================
     MONSTER SHOTS -- $ACC9 / $AF8F / $B04B / $8FC5 / $8C0B.

     $ACC2  LD A,E / AND $E0 / CP $40 / JR c      classes 0 and 1 never fire
     $ACC9  CP $80 / CALL c,$AF8F                 so classes 2 and 3 do

     It is a TWO-STAGE system and the middle stage is what limits the rate.
     An aligned class-2 actor does not create a shot: it claims a slot in a
     16-entry RING at $5B90 (eight facings x two players), and $8FC5 drains
     only TWO slots a pass, chosen by $8491 & 7.  Everything else in the ring
     is thrown away when $AB94 refills it with $FF at the top of the next
     actor pass.  So however many monsters are lined up on you, at most two
     shots a pass are born -- and only from the facings the pass counter
     happens to be pointing at.

     MEASURED on the real Z80 with four class-2 actors placed around the
     player: $AF8F is entered 3 times a pass, the ring holds
     `90 0C 14 40` at $5B90 and `98 00 08 42` at $5B98 -- marker, x, y, state
     -- and $84A8 / $84A9 walk 0..1 / $5B20..$5B24 as shots are born and die
     (`python tools/mshotgate.py`).                                        */

  /* $AF8F -- one class-2 or class-3 actor's chance to fire. */
  actorFire(a, E, cls){
    if (this.mshots.length & 0x10) return;          // $AF8F BIT 4,(IY+$29)
    if (cls === 0x60){ this.actorFire3(a, E); return; }   // $AF94 CP $60
    const C = a.x, B = a.y;
    const f3 = E & 3;                               // $AF9B LD A,E / AND 3
    /* $AFA4/$AFE7/$B019 try PLAYER 1 first and fall through to player 2 --
       a dead player ($842B / $844B bit 7) is skipped, not aimed at. */
    for (let who = 0; who < 2; who++){
      const q = this.players[who];
      if (q.f11 & F_DEAD) continue;                 // BIT 7,(IY-$54)/(IY-$34)
      let ok;
      if (f3 === 0){                                // $AFE7 -- up / down
        ok = wrapAbs((q.x - C) & 0xFF) < 3;         // $AFF4 CP 3
      } else if (f3 === 2){                         // $B019 -- left / right
        ok = wrapAbs((q.y - B) & 0xFF) < 3;         // $B026 CP 3
      } else {                                      // $AFA4 -- the diagonals
        const h = wrapAbs((q.x - C) & 0xFF);        // $AFAA .. LD H,A
        const v = wrapAbs((q.y - B) & 0xFF);        // $AFB2
        ok = (((v - h + 2) & 0xFF) < 5);            // $AFB9 SUB H / ADD 2 / CP 5
      }
      if (!ok) continue;
      /* $B049 SET 5,L -- player 2's arms arrive here with L = $20, which is
         what puts his eight slots at $5BB0 instead of $5B90. */
      this.ringWrite(E, C, B, who ? 0x20 : 0);      // $B04B
      return;
    }
  }

  /* $B0D6 -- the class-3 aimer's divider, and the ONE routine here that
     abandons its caller: $B0DF JR z,$B0FC is POP AF / RET, which throws away
     the return into $B0A4/$B0AB and returns to whoever called $B060.  So a
     zero is not "no vector", it is "no shot at all".  Returns null for that;
     otherwise {H, D, L}.

       $B0D6  A = L; DEC A; RRCA x4 (a NIBBLE SWAP, not a shift); INC A; AND 7
       $B0DF  zero -> unwind
       $B0E1  D = A;  A = (A >> 1) + L;  L = A / D   (repeated SUB)
       $B0EB  BIT 4,L -> L = 15          the quotient is capped at 15
       $B0F1  A = (L >> 1) + H;  H = A / L                                */
  aimDiv(H, L){
    let A = (L - 1) & 0xFF;                          // $B0D6 LD A,L / DEC A
    A = ((A >> 4) | (A << 4)) & 0xFF;                // $B0D8 RRCA x4
    A = (A + 1) & 0xFF;                              // $B0DC INC A
    A &= 7;                                          // $B0DD AND 7
    if (A === 0) return null;                        // $B0DF -> $B0FC unwind
    const D = A;                                     // $B0E1 LD D,A
    let acc = ((A >> 1) + L) & 0xFF;                 // $B0E2 SRL A / ADD A,L
    let l = 0xFF;                                    // $B0E5 LD L,$FF
    do { l = (l + 1) & 0xFF; acc -= D; }             // $B0E7 INC L / SUB D
    while (acc >= 0);                                // $B0E9 JR nc
    if (l & 0x10) l = 15;                            // $B0EB BIT 4,L
    acc = ((l >> 1) + H) & 0xFF;                     // $B0F1 SRL A / ADD A,H
    let h = 0xFF;                                    // $B0F5 LD H,$FF
    do { h = (h + 1) & 0xFF; acc -= l; }             // $B0F7 INC H / SUB L
    while (acc >= 0 && l !== 0);
    return {H: h, D, L: l};
  }

  /* $B060 -- CLASS 3's own way of shooting, and it never touches the ring: it
     aims a SUB-CELL VECTOR and writes straight into the $5B20 array with
     flags bit 6 set, which is what puts the shot on the fine movement at
     $8CBC and the growing-fireball draw at $8EB7.

       $B060  LD A,R / CP 7 / RET nc     ~7 in 256, and it is the refresh
                                         register, so WHICH pass fires is not
                                         reproducible -- rand8() again
       $B065  RRA / JR c,$B076           the same coin picks who to aim at
       $B068  player 1 must be alive AND ($842A) his POWER-UP TIMER must be 0
              -- a flashing player is not aimed at -- else fall to player 2
       $B076  player 2 the same, and if he fails too there is no shot
       $B083  ($84AB) = 0, then the two SIGN bits: bit 3 if the player is to
              the left, bit 7 if he is above ($AD47 returns carry CLEAR for a
              negative difference)
       $B092  L = 2*|dx|,  H = 2*|dy|
       $B0A1  the LARGER goes in as H and the smaller as L, and $B0A9 swaps H
              and D back afterwards
       $B0B1  state = (H << 4) | D | signs,  flags = L | $C0
       $B0C1  the record is (x+1, y+1, state, flags) -- the same +1 nudge
       $B0CE  ($84A8)++ / $B0D1 sound 12                                   */
  actorFire3(a, E, coin){
    /* `coin` is $B060's LD A,R.  It is the refresh register, so WHICH pass
       fires is not reproducible by any port -- the substitute rand8() is used
       in play, and tools/mshotgate.py grid3 supplies it so the AIM can be
       differentiated without the coin in the way (it enters the original at
       $B065 for the same reason). */
    if (coin === undefined) coin = this.rand8();     // $B060 LD A,R
    if (coin >= 7) return;                           // $B062 CP 7 / RET nc
    let q = null;
    if (!(coin & 1)){                                // $B065 RRA / JR c,$B076
      if (this.players[0].f11 & F_DEAD) return;      // $B068 BIT 7 / RET nz
      if (this.players[0].timer === 0) q = this.players[0];   // $B070 JR z
    }
    if (!q){                                         // $B076 -- player 2
      if (this.players[1].f11 & F_DEAD) return;      // $B076 BIT 7 / RET nz
      if (this.players[1].timer !== 0) return;       // $B07E OR A / RET nz
      q = this.players[1];
    }
    let sgn = 0;                                     // $B083 (IY+$2C) = 0
    if (wrap7((q.x - a.x) & 0xFF) >= 0x80) sgn |= 0x08;   // $B08E SET 3
    if (wrap7((q.y - a.y) & 0xFF) >= 0x80) sgn |= 0x80;   // $B09B SET 7
    const L0 = (wrapAbs((q.x - a.x) & 0xFF) * 2) & 0xFF;  // $B092 ADD A,A
    const H0 = (wrapAbs((q.y - a.y) & 0xFF) * 2) & 0xFF;  // $B09F ADD A,A
    let r, H, D;
    if (H0 < L0){                                    // $B0A1 CP L / JR nc
      r = this.aimDiv(H0, L0);                       // $B0A4
      if (!r) return;                                // the $B0FC unwind
      H = r.H; D = r.D;
    } else {
      r = this.aimDiv(L0, H0);                       // $B0A9 LD H,L / LD L,A
      if (!r) return;
      H = r.D; D = r.H;                              // $B0AE the swap
    }
    const state = (((H << 4) & 0xFF) | D | sgn) & 0xFF;   // $B0B1..$B0BA
    const flags = (r.L | 0xC0) & 0xFF;               // $B0BB LD A,L / OR $C0
    this.mshots.push({x: (a.x + 1) & 0xFF, y: (a.y + 1) & 0xFF,
                      state, flags, drawX: 0, drawY: 0, drawn: false});
    this.sfx(12);                                    // $B0D1 LD A,12
  }

  /* $90AD -- the class-3 shot's LIFETIME, and it is the flags byte itself.
       $90AD  A = flags - 1
       $90B2  (A AND 15) == 15 -> $90B8: drop bit 6, state = $20 (exploding),
              INC B, and return CARRY SET -- which $8D31 JP c,$8D97 reads as
              "skip both collision scans and go straight to the cull"
       $90C3  BIT 0,E -- only ODD counters curve.  The high nibble is nudged a
              step and B (the y) with it, bounded at $E0 going down and $CF
              going up, which is what BENDS the fireball's path.
       $90DD  the counter is written back, and the returned carry is
              NOT (A AND 15) < 3.                                          */
  shotLife(s, B){
    let A = (s.flags - 1) & 0xFF;                    // $90AD / $90B0
    let E2 = A;
    if ((A & 15) === 15){                            // $90B2 AND 15 / CP 15
      s.flags &= ~0x40;                              // $90B8 RES 6,(IX+3)
      s.state = 0x20;                                // $90BC (IX+2) = $20
      return {B: (B + 1) & 0xFF, carry: true};       // $90C0 INC B / SCF
    }
    if (E2 & 1){                                     // $90C3 BIT 0,E
      const lo = A & 15;
      A = E2;
      if (lo < 5){                                   // $90C7 CP 5 / JR c
        if (A >= 0xCF){                              // $90D5 CP $CF / JR c
          B = (B + 1) & 0xFF;                        // $90D9 INC B
          A = (A - 0x10) & 0xFF;                     // $90DA SUB $10
        }
      } else if (A < 0xE0){                          // $90CC CP $E0 / JR nc
        B = (B - 1) & 0xFF;                          // $90D0 DEC B
        A = (A + 0x10) & 0xFF;                       // $90D1 ADD A,$10
      }
      E2 = A;                                        // $90DC LD E,A
    }
    s.flags = E2;                                    // $90DD LD (IX+3),E
    return {B, carry: !((E2 & 15) < 3)};             // $90E0 AND 15 / CP 3 / CCF
  }

  /* $B04B -- claim the ring slot for (facing, player).  The slot INDEX is
     also its priority byte, and $B056 CP (HL) / RET nc means an occupied slot
     is never overwritten: the first actor to claim a facing this pass keeps
     it.  An empty slot is $FF, which every index beats. */
  ringWrite(E, C, B, L){
    const A = (((E & 7) << 2) + 0x90 + L) & 0xFF;   // $B04C..$B052
    const o = A - 0x90;
    if (A >= this.ring[o]) return;                  // $B056 CP (HL) / RET nc
    this.ring[o] = A;                               // $B058
    this.ring[o + 1] = C;                           // $B05A LD (HL),C
    this.ring[o + 2] = B;                           // $B05C LD (HL),B
    this.ring[o + 3] = E;                           // $B05E LD (HL),E
  }

  /* $8FC5 -- drain TWO ring slots into the shot array, and which two is
     $8491 & 7.  The record it appends is (x+1, y+1, facing | $90, $80): the
     +1 nudges the shot off the monster's own square, the $90 sets the BORN
     bit (bit 7) so its first step skips both collision scans exactly as a
     player's does, and the $80 flag byte is what every "is this a monster
     shot" test in the shared body reads. */
  ringDrain(){
    let o = 8 * (this.passCtr & 7);                 // $8FC9 AND 7 / x8 / +$90
    for (let b = 0; b < 2; b++){                    // $8FD6 LD B,2
      if (this.mshots.length === 0x10) return;      // $8FD8 CP $10 / JR z
      if (this.ring[o] !== 0xFF){                   // $8FDF LD A,(HL) / INC A
        this.mshots.push({x: (this.ring[o + 1] + 1) & 0xFF,      // $8FEB
                          y: (this.ring[o + 2] + 1) & 0xFF,      // $8FF0
                          state: (this.ring[o + 3] & 7) | 0x90,  // $8FF5
                          flags: 0x80,                           // $8FFD
                          drawX: 0, drawY: 0, drawn: false});
      }
      o += 4;                                       // both arms advance 4
    }
  }

  /* $8C0B..$8C42 -- walk the array through the SAME body the players use.
     Removal is the swap-with-last idiom again: $8C1B copies the record at the
     cursor over the dead one, winds the cursor back four and does NOT advance
     IX, so the record swapped in is examined on the next iteration.  Getting
     that wrong is the bug that left a band of ghosts standing after a potion;
     here it would leave monster shots that never expire. */
  monsterShotPass(){
    let i = 0;
    for (let n = this.mshots.length; n > 0; n--){   // $8C10 LD B,A
      if (i >= this.mshots.length) break;
      if (this.shotBody(this.mshots[i], null)){     // $8C16 CALL $8C5D
        i++;                                        // $8C3A ADD IX,DE
      } else {
        const last = this.mshots.pop();             // $8C1B..$8C32
        if (i < this.mshots.length) this.mshots[i] = last;
        // $8C38 JR $8C3F -- the cursor stays put
      }
    }
  }

  /* $9115 -- SHOT POWER, as an index into $7D64's stride-2 table.  The owner
     is identified by (state & $F8) == $8433, which is how one routine serves
     two players; here it is always player 1. */
  shotPower(){
    let a = this.p15 & 3;                                // $911F AND 3
    if (this.p14 & 0x08) a += 2;                         // $9124 BIT 3 -> +2
    return a;                                            // $9137 ADD A,A -> *2
  }

  /* $8EEB -- the shot's OWN actor scan, and it is NOT the player's $A97F: the
     box origin is (x-2, y-2) and BOTH axes test CP 5, so it is 5x5, where the
     player's is a 7x7 with a -3 origin.  ENUMERATED against the real routine
     over dx,dy in [-6,6]: exactly the 25 cells with dx,dy in [-2,+2]
     (`python tools/shotgate.py box`).

     $8F2D BIT 3,(HL) / JR z is the INVISIBLE test, and note which way round it
     is: the jump on Z goes to the FOUND tail, so a record whose bit 3 is SET
     is skipped and the loop carries on.  That bit is a per-record state, NOT
     a class property -- it is set and cleared by $ACA8 on class 4 only, but
     the scan tests the bit and nothing else.  MEASURED in the running game:
     a class-4 tier-0 dies to the FIRST shot (score 000005) and a class-4
     tier-3 takes hits on passes 3 and 5 and then goes invisible and the next
     shots fly straight through it.  "Class 4 cannot be shot" is wrong. */
  shotFindActor(cx, cy){
    const C = (cx - 2) & 0x7F;                           // $8EF3 DEC C x2
    const yr = (cy - 2) & 0x7F;                          // $8EF7 -> $8F23
    for (let i = 0; i < this.actors.length; i++){
      const ob = this.actors[i];
      if (((ob.x - C) & 0x78) !== 0) continue;           // $8F08 AND $78
      if (((ob.x - C) & 0x7F) >= 5) continue;            // $8F1B CP 5
      if (((ob.y - yr) & 0x7F) >= 5) continue;           // $8F26 CP 5
      if (ob.flags & 0x08) continue;                     // $8F2D invisible
      return i;
    }
    return -1;
  }

  /* $8D5A..$8D88 -- what a hit costs and what it pays. */
  shotHitActor(i, s){
    const ob = this.actors[i];
    const st = ob.state;                                 // read BEFORE damage
    if (st < 0xA0) this.shotDamage(i, s);                // $8D62 CP $A0
    /* $8D67 BIT 7,(IX+3) / RET nz -- a MONSTER shot scores nothing and does
       not roll the class-5 bounty either; it returns right here.  Player shots
       pay PER HIT, whether or not the hit kills. */
    if (s && (s.flags & 0x80)) return;                   // $8D67
    const cls = st & 0xE0;                               // $8D6D AND $E0
    let E;
    if (cls === 0) E = 0x10;                             // $8D6F class 0 -> 10
    else if (cls !== 0xA0) E = 0x05;                     // $8D73 classes 1-4
    else {
      E = 0x01;                                          // $8D79 class 5 -> 1
      /* $8D7B..$8D82: shooting a class 5 also rolls its POTION BOUNTY into
         $84B3 -- (rand & $70) + $10, i.e. 1000..8000 points a head when a
         potion later kills it.  The roll is LD A,R and is not reproducible;
         the substitute rand8() is used and labelled, as everywhere else. */
      this.b3 = (this.rand8() & 0x70) + 0x10;
    }
    this.scoreAdd(E);                                    // $8D85 CALL $913C
  }

  /* $90E6 -- damage to an actor, in TIER units.  There is no separate hit
     point field: bits 4:3 of the state byte ARE the hit points, and they are
     also what decides the damage the monster deals.
       $90E7  LD A,8 / BIT 7,(IX+3) / CALL z,$9115   monster shots are a flat 8
       $90F3  LD E,A / RRA                            carry = bit 0 of the byte
       $90F9  BIT 0,(IY+$12) / JR z                   ... and $8491 ODD
       $90FF  LD A,8                                  the bonus is a WHOLE TIER
       $9101  ADD A,E / AND $18                       and a hard 3-tier CAP
       $9105  LD A,(HL) / AND $18 / SUB E / JR nc     tier underflow ->
       $910B  CALL $A641                              swap-remove
     MEASURED, because two of the four reports disagreed about the parity:
     with the table byte $09 (SHOT POWER 1) the tier drops by ONE on pass
     counters 0 and 2 and by TWO on 1 and 3 -- so the bonus lands on ODD
     passes (`python tools/shotgate.py parity`).  ENUMERATED, the reachable
     damages are exactly {8, 16, 24}: the AND $18 is a cap, and a port that
     writes damage = t + bonus without it deals four tiers at t = $18. */
  shotDamage(i, s){
    const ob = this.actors[i];
    /* $90E7 LD A,8 / BIT 7,(IX+3) / CALL z,$9115 -- a MONSTER shot deals a
       flat 8 and never reaches the power table at all. */
    const t = (s && (s.flags & 0x80)) ? 8
                                      : SHOT_DMG[2 * this.shotPower()];
    let bonus = 0;
    if ((t & 1) && (this.passCtr & 1)) bonus = 8;        // $90F4..$90FF
    const E = (bonus + t) & 0x18;                        // $9102 AND $18
    if (((ob.state & 0x18) - E) < 0) this.actorRemove(i);   // $9108 JR nc
    else ob.state = (ob.state - E) & 0xFF;               // $9110
  }

  /* $9009 -- the same 5x5 box against the PLAYERS, with the +2 written on the
     player's side ($9012 ADD A,2) instead of the shot's.  $908E gives the
     damage: a PLAYER's shot does 0 and a monster's does 10, and armour is not
     consulted on either.  The shot expires whichever way it goes, so friendly
     fire terminates your own shot and does nothing -- which never happens in
     practice because the born-bit skips the scan on the spawn step and by the
     next one the shot is 4 units away. */
  shotHitPlayer(cx, cy, s){
    /* $9009 tests PLAYER 1 first and PLAYER 2 second, and the two arms are
       ASYMMETRIC: a MISS on player 1 falls through into player 2's arm
       ($9019/$9025 JR nc,$9035) but a HIT jumps into the shared tail
       ($9033 JR $905C), so one shot can never hit both and player 1 always
       has first refusal. */
    for (const q of this.players){
      if (q.f11 & F_EXITING) continue;                   // $9009/$9035 BIT 6
      if (((q.x + 2 - cx) & 0x7F) >= 5) continue;        // $9012/$9017
      if (((q.y + 2 - cy) & 0x7F) >= 5) continue;        // $901E/$9023
      /* $908E gives D: 10 for a monster shot (3 with flags bit 6) and ZERO
         for any player's, since bit 7 of the tag at (IX+3) is clear for all
         four characters.  $905C JR nz then skips both mode arms for a
         monster shot -- and the Z it branches on is still $908E's, carried
         across four instructions that do not touch the flags.
           $905E  BIT 4,(IY-1) / SET 6,(IX+$14) / (IX+$1D) = $1E     STUN
           $906E  BIT 5,(IY-1) / LD D,5                              HURT
           $9076  LD A,D / OR A / JR z,$9085
           $907A  SET 0,(IX+11) / CALL $B852 / $9081 ($84B8) = 0
         BIT 4 IS TESTED FIRST AND JUMPS PAST BIT 5, so with both set the
         stun wins.  And $9076 means a STUN costs no health, raises no dirty
         bit and DOES NOT reset the hurry-up: only a hurt or a monster shot
         reaches $907A.
         MEASURED, both directions, all four combinations of the two bits:
         neither -> nothing happens but the shot still dies; bit 4 -> +$14
         bit 6 set and +$1D = $1E and no health lost; bit 5 -> exactly 5 BCD
         per hit; both -> byte-identical to bit 4 alone. */
      /* $908E LD D,0 / BIT 7,(IX+3) / RET z / LD D,9 / BIT 6,(IX+3) /
         JR z / LD D,2 / INC D -- so a MONSTER shot costs 10, or 3 if its
         flags carry bit 6 (class 3's fine-grained kind), and a player's
         costs 0 because bit 7 of the tag is clear for all four characters.
         $905C JR nz then skips BOTH mode arms for a monster shot: being shot
         is never a stun, and it does not care what mode the level is in. */
      let D = 0;                                         // $908E LD D,0
      const mon = !!(s && (s.flags & 0x80));             // $9090 BIT 7
      if (mon){
        D = (s.flags & 0x40) ? 3 : 10;                   // $9095/$909D/$909F
      } else if (this.ff & FF_STUN){                     // $905E BIT 4
        q.p14 |= 0x40;                                   // $9064 SET 6
        q.pend = 0x1E;                                   // $9068 30 passes
      } else if (this.ff & FF_HURT){                     // $906E BIT 5
        D = 5;                                           // $9074 LD D,5
      }
      if (D !== 0){                                      // $9076 OR A / JR z
        q.f11 |= F_HEALTH_D;                             // $907A SET 0
        q.health = bcdSub(q.health, D);                  // $907E CALL $B852
        this.hurry = 0;                                  // $9081 ($84B8) = 0
      }
      this.sfx(8);                                       // $9087
      return true;                                       // $908C SCF
    }
    return false;
  }

  /* $8F36..$8FAD -- the shot's OWN map predicate, a THIRD ladder distinct
     from the player's $A8E7 and the actor's $ADF8.  It probes exactly ONE
     cell, offset down-and-right for the diagonals in the same asymmetric way
     the player's second probe is:
       slot 1 NE  x+2      slot 3 SE  x+2, y+2
       slot 5 SW  y+2      slot 7 NW  no offset at all
     ENUMERATED against the real routine over all 16 sub-cell positions x 8
     slots (`python tools/shotgate.py probe`).  Returns true = STOPPED. */
  shotMap(x, y, slot){
    /* $8F47/$8F4F are INC C / INC B with NO RES 7 afterwards, so the offset
       pair is a plain 8-bit register value; $AE6D's AND $7C does the wrapping
       when it turns it into a cell address. */
    let C = x, B = y;
    if (slot & 1){                                       // $8F37 BIT 0,(IX+2)
      if (slot >= 1 && slot <= 3) C = (C + 2) & 0xFF;    // $8F42 DEC A / CP 3
      if (slot >= 3 && slot <= 5) B = (B + 2) & 0xFF;    // $8F49 SUB 2 / CP 3
    }
    const col = (C >> 2) & (MAP_W - 1), row = (B >> 2) & (MAP_H - 1);
    const v = this.map[row][col] & 0x7F;                 // $8F55 AND $7F
    const out = (stop) => ({stop, x: C, y: B});
    if (v === 0) return {stop: false, x, y};             // $8F59 POP BC -- the
                                                         // ONLY path that puts
                                                         // the pair back
    const clear = () => { this.map[row][col] = 0; };     // $8FAA LD (HL),0
    /* $8FAE..$8FC3 -- SHOOTING A POTION OR AN ITEM DETONATES IT, and that is
       the thing that SETS $847E bit 0.  This was listed as "not established"
       for a long time on the strength of a search that found the only
       SET 0,(IY-1) in the image and never reached it; the path is a SHOT
       landing on a cell, not anything the potion itself does.

         $8FAE  SET 0,(IY-1)         the SUSTAIN arm: $A391 re-arms the sweep
                                     at the top of the NEXT pass
         $8FB2  LD (IY+$24),0        $84A3 -- so it cannot touch a generator
         $8FB6  LD (IY+$25),1        $84A4 } one point off every actor the
         $8FBA  LD (IY+$26),1        $84A5 } cull window reaches
         $8FBE  LD A,5 / CALL $BA2B  the same sound a thrown potion makes
         $8FC3  JR $8FAA             and the cell is cleared

       It does NOT set $84A6, zero the tallies or touch $84A1, so a detonation
       is not a throw: it borrows the sweep for exactly ONE pass and pays
       nothing.  $8BD4 sees bit 0 still set, skips the pay-out entirely and
       $8C01 clears the bit again -- which is why the sweep does not persist.
       ($16 is a potion and $19..$1E the six carried items; $14 is cleared
       WITHOUT detonating, which is the negative control in the gate.) */
    const detonate = () => {
      this.f847E_bit0 = 1;                              // $8FAE
      this.potionK = 0;                                 // $8FB2
      this.potionLo = 1; this.potionHi = 1;             // $8FB6 / $8FBA
      this.sfx(5);                                      // $8FBE
      clear();                                          // $8FC3 -> $8FAA
    };
    if (v === 0x14){ clear(); return out(true); }        // $8F5C food
    if (v === 0x16){ detonate(); return out(true); }     // $8F60 potion
    if (v < 0x18) return out(true);                      // $8F64 RET c -- WALLS
    if (v === 0x18) return out(false);                   // $8F67 RET z
    if (v < 0x1F){ detonate(); return out(true); }       // $8F68 the six items
    if (v === 0x1F) return out(false);                   // $8F6C the key
    if (v === 0x2F || v === 0x30 || v === 0x32) return out(false);  // $8F6D..
    if (v >= 0x36) return out(false);                    // $8F76 RET nc
    if (v < 0x2F){                                       // $8F7C -> a GENERATOR
      this.scoreAdd(0x0A);                               // $8F80 LD E,10
      /* NOTE the encoding trap: this is LD E,10 = $0A, a DECIMAL 10 that the
         DAA in $913C fixes up to BCD $10 -- while $8D6F is LD E,$10, already
         BCD.  Both are worth ten points.  A port that treats the two alike as
         raw bytes gets 10 and 16. */
      let d = SHOT_DMG[2 * this.shotPower() + 1];        // $7D65, odd column
      const odd = d & 1; d >>= 1;                        // $8F8B SRL A
      if (odd && !(this.passCtr & 1)) d++;               // $8F8F BIT 0 / JR nz
      this.genApply(col, row, d);                        // $8F96 CALL $A6C0
      return out(true);
    }
    if (v === 0x31){ clear(); return out(true); }        // $8F9B the thief
    if (v < 0x33) return out(false);                     // $8F9F RET c
    /* $8FA5 -- a destructible wall counts UP on the RAW cell value and is
       gone when it reaches $36, so $33 takes three hits, $34 two, $35 one. */
    const nv = (this.map[row][col] + 1) & 0xFF;
    this.map[row][col] = nv;
    if ((nv & 0x7F) >= 0x36) clear();                    // $8FA7 CP $36
    return out(true);
  }

  /* $913C -- the score add, which is a DAA chain over three bytes and then
     SET 1,(IX-5), i.e. the score-dirty flag in $842B. */
  scoreAdd(e){
    const r = bcdAdd24(this.score, e);
    this.score = r.score; if (r.wrapped) this.millions++;   // $9156 $B82E
    this.f11 |= F_SCORE_D;                                 // $9159 SET 1
  }

  /* =====================================================================
     $8540 CALL $93C2 -- DEATH.  It runs LAST BUT TWO in the main loop, after
     the actors, the draw, the HUD, the exit walk, the cull and the generator
     sweep, and it fires on exactly one condition:

       $93CD  BIT 7,(IX+$14) / RET nz          not already dead
       $93D2  LD A,(IX+2) / OR (IX+3) / RET nz health is EXACTLY BCD 0000

     Not "<= 0": the health is packed BCD and $B852 clamps at 0000, so the two
     bytes have to be zero together.  MEASURED on the real Z80: forcing $0001
     changes nothing at all, forcing $0000 runs the whole sequence, and the
     same path is reached identically from a monster contact ($A627 -> $B852)
     and from the idle drain ($B6E4 -> $B852) -- `python tools/deathgate.py
     routes`.                                                             */
  deathPass(){
    if (this.p14 & 0x80) return;                         // $93CD BIT 7
    if (this.health !== 0) return;                       // $93D2
    /* $93D9 DEC (IX+2) / CALL $9788 / INC (IX+2) -- the health is nudged off
       zero, the HUD printer is called and it is put back, purely so the panel
       shows 0000 before the game ends.  Display only. */
    this.animCtl = 0x80;                                 // $93E2 (IX+14)
    this.f11 |= 0xC3;                                    // $93E6 OR $C3
    this.p14 |= 0x80; this.dead = true;                  // $93EE SET 7
    const C = this.x & 0x7C, B = this.y & 0x7C;          // $93F2 AND $7C
    /* the corpse marker (ADDED): render() writes RIP <name> here -- the
       same snapped cell $9404's drop puts the bones on */
    this.died = true; this.diedX = C; this.diedY = B;
    /* $93FE CALL $B23B -- and this one is easy to miss, because it reads like
       bookkeeping: it runs the PLAYER'S OWN 7x7 scan at the snapped death
       position and swap-removes every actor it finds, looping until the box
       is empty.  Dying clears the monsters that are standing on you. */
    for (let g = 0; g < 200; g++){                       // $B23B..$B244
      const i = this.scanFind(C, B, -1);
      if (i < 0) break;
      this.actorRemove(i);
    }
    const col = (C >> 2) & (MAP_W - 1), row = (B >> 2) & (MAP_H - 1);
    /* $9404..$942B -- he DROPS what he was carrying on the cell he died on,
       and the value depends only on the key count:
         0 keys -> $22, a class-0 tier-2 GENERATOR
         1 key  -> $1F, a key
         2+     -> $32, a hoard, plus a 3-byte record (cell address, keys) at
                   $5BE8 + 3*$84C0 and $84C0++
       MEASURED for 0/1/2/3/9 keys (`python tools/deathgate.py drop`). */
    let v = 0x22;                                        // $9404 LD C,$22
    if (this.keys - 1 >= 0){                             // $9406 DEC A / JP m
      v = 0x1F;                                          // $940D LD C,$1F
      if (this.keys - 1 !== 0){                          // $940F JR z
        v = 0x32;                                        // $9411 LD C,$32
        this.hoard.push([col, row, this.keys]);          // $9413..$9426
        this.hoardCount++;                               // $9428 INC (IY+$41)
      }
    }
    this.map[row][col] = v;                              // $942B LD (HL),C
    this.sfx(15);                                        // $942C LD A,15
  }
