<title>Gauntlet</title>
<style>
  /* The page is a frame around a Spectrum screen and nothing else.  Two
     themes: the default follows the system, and the corner button pins one.
     The GAME's own colours never change -- the black inside #overscan is the
     Spectrum's border, painted from $84CA, not page furniture. */
  :root{ color-scheme:light dark;
         --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  @media (prefers-color-scheme:light){
    :root{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }
  }
  :root[data-theme="dark"]{  --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  :root[data-theme="light"]{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; background:var(--bg); padding:16px;
        display:flex; align-items:center; justify-content:center;
        transition:background 140ms linear }
  #overscan{ display:inline-block; padding:24px 32px; background:#000;
             border:1px solid var(--edge); border-radius:4px; line-height:0;
             transition:background 40ms linear, border-color 140ms linear }
  canvas{ image-rendering:pixelated; background:#000; border:0; display:block;
          max-width:100%; height:auto; width:768px }
  /* deliberately faint: it is the only thing on the page that is not the game */
  #theme{ position:fixed; top:10px; right:12px; width:28px; height:28px;
          border:1px solid var(--edge); border-radius:50%; background:transparent;
          color:var(--btn); font:14px/1 system-ui,sans-serif; cursor:pointer;
          opacity:.22; transition:opacity 140ms linear, color 140ms linear;
          display:flex; align-items:center; justify-content:center; padding:0 }
  #theme:hover,#theme:focus-visible{ opacity:1 }
</style>

<!-- THE OVERSCAN FRAME.  A real Spectrum draws a border around the 256x192
     display and the game uses it: $A2B1 holds it WHITE for as long as a
     potion's sweep is armed.  The padding is the border's width and its
     background is the emulated $84CA. -->
<div id="overscan"><canvas id="scr" width="256" height="192"></canvas></div>
<button id="theme" type="button" title="theme: system / dark / light"
        aria-label="switch theme">&#9680;</button>

<script type="application/json" id="assets">__ASSETS__</script>
<script>
/* =======================================================================
   GENERATED FILE -- do not edit.  Edit web/template.html and rebuild with
       python tools/build.py
   =======================================================================
   Every rule cites the address it came from, in the original's RUNTIME
   layout (build/live.bin, i.e. after the self-relocation at $BDED).
   Anything not recovered from the machine code is marked PROVISIONAL.
   ======================================================================= */
const A = JSON.parse(document.getElementById('assets').textContent);

/* ---- Spectrum display model (manual 3.2/3.3) ------------------------- */
// BRIGHT is USED by this game: 7010 of 26025 attribute writes set bit 6, so
// both palettes are needed (tools/battery.py, Q16).
const PAL_DIM=['#000000','#0000d7','#d70000','#d700d7','#00d700','#00d7d7','#d7d700','#d7d7d7'];
const PAL_BRT=['#000000','#0000ff','#ff0000','#ff00ff','#00ff00','#00ffff','#ffff00','#ffffff'];
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);
              for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};

/* ---- geometry, all measured ------------------------------------------
   The map is a 32x32 grid at $8000..$83FF that WRAPS in both axes.  Read out
   of the cursor routines, not guessed:
     $9A2D  INC L / LD A,L / AND $1F / RET nz / SUB $20   step right, col wraps
     $9A3D  LD A,L / ADD $20 ...                          step down, +32/row
     $9A18  LD A,L / SUB $20 ... CP $7F / ADD 4           step up, H wraps
     $9A27  LD A,C / ADD 4 / AND $7F                      one cell = 4 units
   4 units is 16 screen pixels, so the world is 512x512 px and the playfield
   viewport is 256x160 -- which is why the game scrolls at all.             */
const MAP_W=A.map.w, MAP_H=A.map.h;
const UNITS=A.map.units_per_cell;      // 4 coordinate units per cell
const PXU=A.map.px_per_unit;           // 4 screen pixels per unit
const CELL=UNITS*PXU;                  // 16 px
const PLAYFIELD_ROWS=A.hud.rows;       // 20; rows 20-23 are the HUD
const PLAYFIELD_H=PLAYFIELD_ROWS*8;    // 160 px

/* The playfield/HUD split is a MEASUREMENT: comparing the real screen against
   the shadow screen row by row, rows 0-19 agree byte for byte (apart from the
   player sprite) and rows 20-23 are entirely different.  An earlier build drew
   all 24 rows from the shadow buffer, which put four rows of unrelated data
   under the playfield -- reported in play, then measured.                  */

/* ---- time ------------------------------------------------------------
   A main-loop pass is FOUR OR FIVE video frames in a quiet dungeon and SIX
   OR SEVEN at a generator cluster, and which one it is depends on how much
   work the pass did.  Re-measured on the 48K/BEEPER branch this port now
   ships, anchored on the loop top $8503 from build/state_48k.pkl, 200 passes
   a cell (`python tools/beepgate.py clock`):

       key      48K/beeper                      128K/AY
       idle     4.145  {4:171, 5:29}            4.000  {4:200}
       right    4.040  {4:192, 5: 8}            4.000  {4:200}
       down     4.810  {4: 38, 5:162}           4.100  {4:180, 5:20}
       left     4.510  {4: 98, 5:102}           4.000  {4:200}
       up       5.000  {      5:200}            4.000  {4:200}

   WHY, and it is not an audio cost: $B8CC, the beeper's NOISE SAMPLE, is
   58 T-states of extra work PER DRAWN OBJECT even in total silence (68 T
   against the 128K arm's 10 T RET, enumerated over all 256 values of R),
   and it is called ~250 times a pass from six sites inside the blitter.
   That is 0.207 frames charged against a compute budget of TWO FRAMES
   MINUS THE PHASE, which a quiet pass already fills to 1.80 of 2.00.  So
   the observable is 0 or 1 WHOLE frame and the tip rate is wildly
   scene-dependent.  The identity, measured by T-stamping $8503, $9CD7 and
   $9CD8 (phase p, compute W1, ISR, screen copy W2):

       one pass = ceil(p + W1) - p + ISR + W2
       p 0.178..0.205   W1 1.797 (idle) .. 1.934 (down)   W2 2.166   ISR ~2000 T
       "p + W1 > 2.0  <=>  a 5-frame pass" called 720/720 passes correctly
       across {48K, AY} x {idle, down, up}.

   THIS ENGINE NOW MODELS THE COST.  It keeps a T-state clock, charges each
   pass the work it did, and lets the HALT quantise it -- see clockCost()
   and quantise() below.  FRAMES_PER_PASS is the NOMINAL cost (what the
   accumulator is driven at); `passFrames` is what the pass actually cost
   and advance() debits the difference, exactly as it already did for the
   blocking pause.  Accuracy, honestly: 94.7% of 2,740 driven passes over 38
   scenes get the whole-frame cost exactly right, 94.8% on the 1,620 passes
   of the 18 scenes no constant was fitted on, with the model carrying its
   own phase and its own $8497 forward from pass 0 rather than being handed
   the original's.  The always-guess-the-commonest baseline on the same data
   is 60.8% and the previous attempt at a predictor reached 62.7%.
   `python tools/clockgate.py score`.                                     */
const FRAMES_PER_PASS=4, FRAME_HZ=50.08;
const PASS_SECONDS=FRAMES_PER_PASS/FRAME_HZ;
const FRAME_T_JS=69888;                // T-states in a 48K video frame

/* =======================================================================
   THE PASS COST MODEL -- manual B2b, the load-dependent clock.
   =======================================================================
   THE MECHANISM FIRST, because it is exact and everything else is a fit.
   A 48K pass executes EXACTLY ONE HALT, at $9CD7, reached from $8550 --
   measured over 200 driven passes in five scenes, {$9CD7: 1} every time and
   no other HALT retired ($9D2D's HALT/HALT pair is the AY arm's and is
   unreachable here, because $9D0A reads ($FFFD)=0 and falls through).  So:

     $8503 .......... W1, the work, interrupts ON ........... $8550
     $9CD7 HALT      <- waits for the next frame interrupt: THE QUANTISER
     $9CD8 DI, the tone tick, three shadow->screen copies, $9CF8's hand
           CALL $A29F, $8491++, $B4FF's clear, $8553 .......... W2

   and with t the T-states since the last frame boundary at the loop top,

     tHalt   = t + W1
     release = ceil(tHalt / FRAME_T) * FRAME_T      the HALT lands on a frame
     cost    = release + W2 - t
     t'      = (release + W2) mod FRAME_T

   That identity reproduced the measured cost on 200/200 passes to within
   19 T, and "p + W1 > 2.0 <=> a five-frame pass" was right on 200/200.
   THE FOUR-OR-FIVE IS NOT A LAW, it is what a W1 near 1.8 frames produces:
   over 2,740 passes the whole-frame histogram is {4:1023, 5:1447, 6:249,
   7:21}, and six-frame passes are ordinary at a generator cluster.

   W2 IS COMPUTABLE TO THE T-STATE and this engine computes it.  It is
   147,491 T of straight line (196 of 200 passes exactly; the outliers are
   145,852 and 147,012) plus THREE handler bodies: the HALT's own wake
   interrupt, $9CF8's hand call, and one more accepted inside $B4FF's screen
   clear -- because $A29F ends $A2ED EI / $A2EE RET, so interrupts are back
   on for the tail.  Measured: exactly one is accepted there on 150/150
   passes, at $B50B..$B51B.  A body costs 2,205 T except when ($8497 &7)==6
   BEFORE its own $A2A2 INC, when $A2B4's `RRCA x3 / CP $E0 / JR nc` skips
   the GAUNTLET logo colour cycle and it costs 328 T -- 94/94 samples at
   that residue, 570/570 at the others.  Predicting W2 that way was inside
   40 T on 200/200 passes.

   THE CONSEQUENCE FOR $8497, and it is the gameplay one.  $8497 counts
   HANDLER INVOCATIONS, so it advances by (boundaries inside W1) + 3 -- the
   wake, the hand call and the $B4FF one.  That equals the pass's frame cost.
   Measured $8497 delta per pass against the pass's frames: identical in
   idle/up/down, and 4.05 against 4.55 holding LEFT, where 73 passes in 150
   lose their W1 interrupt inside a blitter DI window (see the DECLARED GAP
   below).  So this engine advances frameCtr by passTicks and the health
   drain, which is keyed to $8497 and not to the pass counter, ticks
   correspondingly less often when the game is slow -- which is the whole
   point of manual B2b: at a generator cluster the player pays more health
   per step because the game is running at 8 Hz instead of 12.5.

   W1 IS A FIT, per CALL site, over the quantities this engine already
   computes for its own reasons -- the map census the four painters walk,
   the actor cull classes, the generator window, the pass parity, the drain
   tick.  Each site's FEATURES come from its own code (what it loops over);
   only the coefficients are least squares, fitted on 1,120 passes of 20
   scenes and scored on 1,620 passes of 18 scenes that were never fitted.
   Provenance is marked per line: (M) measured in isolation, (F) fitted.

   THE DECLARED GAP, and it is not closable by a port.  The map painters and
   the sprite blitter bracket every object blit with DI/EI ($9F86/$9F92,
   $A00D/$A019, $A0C8/$A0D4, $A241/$A24B, $A292/$A29E) because they blit
   with `LD SP,source`.  The ULA asserts INT for 32 T with no pending latch,
   so a frame interrupt whose window falls inside a DI span is LOST FOR
   EVER.  Measured: 14% of the boundaries inside W1 across the collection,
   and 49% holding LEFT.  Each loss removes ~2,205 T, several times the
   quiet-scene margin to the boundary.  This engine charges every boundary
   its MEAN cost (`isrW1` below, 1,520 T, fitted -- the full body times its
   measured acceptance rate) rather than pretending to know which ones land
   inside a DI window.  The two scenes that sit exactly on the boundary
   (d1-left, v-l8d-right) score 53% and the rest 90-100%; that is the
   irreducible part and it is declared, not smoothed.

   ULA CONTENTION IS MODELLED, and it lands almost entirely in W2: W1 paints
   the UNCONTENDED shadow screen at $C000 while W2 writes 6,912 bytes into
   the CONTENDED $4000/$5800.  The game also keeps its own tables
   ($73DA..$7F1A) down there, so W1 pays a little too.  MEASURED per site by
   calling each routine at sixteen frame phases under both simulators:

       $9CD8 blit (w2Straight)   +6,555 T   mode-to-mode, and max-to-max
                                            agrees to within 1 T
       $AB94 actors  (actors)      +421 T   fixed, plus ~2.4 T per actor
       $B0FE cull  (cullActor)    +4.05 T   per live actor, no fixed part
       the four map painters       +110 T   total, NOT APPLIED -- see below
       $A29F the interrupt body        0    it lives above $8000

   THE FIRST THREE ARE IN THE CONSTANTS BELOW.  The painters' +110 T and the
   actors' +2.4-per-actor are NOT: together they are ~250 T against an
   `isrW1` whose own declared uncertainty is 1,520 T a boundary, so applying
   them would be false precision.  They are measured and declared, not
   modelled.

   W2 IS THE WHOLE EFFECT, because W2 sets the phase.  p moves from
   0.1714..0.2051 to 0.2654..0.2993 (300 driven passes, five directions), and
   the phase is what decides whether a pass rounds to four video frames or
   five.  Uncontended the game sits ON that boundary and passes flip; at 0.29
   they settle on five.  Idle dungeon 1 goes 4.300 -> 4.999 frames a pass:
   11.3 Hz to 10.0 Hz, and 10.0 Hz is a real 48K.  BEFORE THIS, THIS PORT RAN
   ABOUT A QUARTER TOO FAST.

   Scoring only means anything against a matched harness -- `clockgate.py
   score` is 98.6% contended (769/780) and 92.8% plain, but 77.6% and 81.7%
   crossed.  tools/harness.py therefore contends BY DEFAULT; set
   GAUNTLET_CONTENDED=0 for the old baseline.  Contended scores HIGHER
   because off the boundary there is less to be ambiguous about.
   `python tools/clockgate.py contend`.                                   */
const CLK = {
  tileAnim:185, tileAnimEven:3311,     // (F) $A31A, bimodal on $8491 bit 0
  doorAnim:160,                        // (M) $95AB
  move:2040, moveKey:979, moveActor:52.64,   // (F) $A38A; $A5F0's actor scan
  camera:218,                          // (M) $B58C
  cellA:810.3, cellB:498.6, cellC:637.6, cellD:1125.5,  // (F) per DRAWN cell
  preActor:267,                        // (M) $A3E6
  actors:2629, clipX:357.0, clipY:546.6, upd:1562.3,    // (F) $AB94/$A1DA
                                       // actors: +421 (M) contention
  updActor:12.26, step:601.2, contact:1919.7,
  plrDraw:1826, shots:775, treasure:30,     // (M) $A43B / $8BCA / $8ADA
  hud:649, hudDrain:577,               // (F) $B6DA, + the drain tick
  hud2:105, panel:247, exitWalk:224,   // (M) $971B / $9788 / $94AE
  cull:309, cullActor:257.15,          // (F) $B0FE, per live actor,
                                       // +4.05 (M) contention
  gens:394, genCell:85.9, genFound:531.5, genSpawn:4202,  // (F) $A9C2
  /* bannerFire is ONE constant for three different jobs, and the three were
     measured separately in isolation from build/state_48k.pkl: the item
     message costs 49,763 T, the treasure pay-out 46,313 T and the thief
     53,581 T -- and the pay-out is 54,360 T when BOTH players are paid,
     which the captured state does not do ($8460+$14 bit 7 is set, so $899F
     skips player 2).  52,650 sits inside that spread; the spread itself is
     about 8,000 T, a sixth of a frame. */
  death:167, banner:77, bannerFire:52650,   // (M) $93C2 / $891C
  ctr:29, toHalt:17,                   // (M) $8546 / $8550
  noiseCall:28, noiseToggle:39,        // (M) $B8CC armed: 96 T / 135 T vs 68
  isrW1:1520,                          // (F) see THE DECLARED GAP above
  isrFull:2205, isrCheap:328,          // (M) $A29F, and $A2B4's skip
  w2Straight:154046,                   // (M) $9CD8 .. the next $8503,
                                       // CONTENDED (+6,555 over plain)
};
/* THE FOUR MAP PAINTERS' EMPTY-MAP COST, indexed by (camY&2)*2 + (camX&2).
   One map cell is 4 coordinate units = 16 screen pixels and the camera steps
   2 units = HALF A TILE, so bit 1 of each camera byte says the viewport is
   split: $9EFC walks (16-bx) x (10-by), $9FC2 the two extra ROWS only when
   camY&2 ($9FC5 AND 2 / RET z), $A08B the two extra COLUMNS only when camX&2
   ($A08E AND 2 / RET z), $A159 the four corners only when both.  Cells
   walked: 160 / 170 / 176 / 187.  MEASURED by calling each routine in
   isolation on a blanked map at each phase.                              */
const CLK_TILE_BASE = [
  /* camX&2=0 camY&2=0 */ [26412,   31,   31,  35],
  /* camX&2=2 camY&2=0 */ [24881,   31, 3850,  64],
  /* camX&2=0 camY&2=2 */ [23861, 5248,   31,  35],
  /* camX&2=2 camY&2=2 */ [22486, 4996, 3512, 385],
];
/* $A29F's own cost.  `f` is $8497 BEFORE the handler's $A2A2 INC. */
const clkIsr = f => ((f & 7) === 6) ? CLK.isrCheap : CLK.isrFull;
const STEP=2;                          // +2 units per pass, measured at $A620

// direction bits in $8427, measured key by key (tools/extract.py)
const DIR_UP=0x01,DIR_DOWN=0x02,DIR_LEFT=0x04,DIR_RIGHT=0x08;

/* ---- the sprite's compass slot ---------------------------------------
   $A47B  LD A,(IX+7) / AND 15 / JR z,$A48D     ; direction bits; ZERO keeps
   $A480  LD L,A / LD H,0 / LD DE,$7D0C         ; the PERSISTED (IX+13)
   $A487  ADD HL,DE / LD A,(HL) / LD (IX+13),A
   $7D0C..$7D1B, dumped from live RAM:
       90 00 04 00 06 07 05 06 02 01 03 02 00 00 04 00
   indexed by (direction bits & 15).  Entry 0 is never read because of the
   `JR z` above -- which is the whole point of the guard: standing still keeps
   the direction you were last facing, it does not fall back to slot 0.
   Slots are compass points: 0 N, 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW; the
   conflicting pairs cancel sensibly (up|down|left -> W, left|right|down -> S). */
const SLOT=[0x90,0,4,0,6,7,5,6,2,1,3,2,0,0,4,0];
const SLOTNAME=['up','upright','right','downright',
                'down','downleft','left','upleft'];

/* ---- the camera, $B58C, transcribed ---------------------------------
   This used to be `cam = max(2, coord - centre)` applied instantly, with a
   note that the upper clamp had never been exercised.  It is now the routine:

     $B58F  LD A,($848D) / SUB $22 / JR nc / SUB A      ; target, clamped at 0
     $B599  ADD A,2 / AND $7F
     $B59D  CP $42 / JR c / LD A,$42                    ; upper clamp, ACROSS
     $B5A3  SUB (HL) / JR z                             ; already there?
     $B5A6  AND $7F / CP $40 / LD A,(HL) / JR c         ; the SHORT way round
     $B5AD  SUB 4 / ADD A,2 / AND $7F / LD (HL),A       ; -2, else +2
     $B5B5  ... the same again for y with $16 and $5A

   $848D/$848E is the camera target source and it is the player's coordinate
   PLUS 2 (measured at $B58C over the down run: player (12,10) -> target
   (14,12)); with two players it is their MIDPOINT, and that IS ported --
   cameraTarget() does $A40B's ADD HL,DE / SRL H / SRL L on the two
   coordinates.  This line used to say it was not.  So
   the net dead zone is $22-2 = 30 across and $16-2 = 18 down, which is what
   the old constants said -- but the CLAMPS are $42 = 66 and $5A = 90, and
   NOTES-engine.md's "[2,86] down" was wrong by 4.  It matters now: the clamp
   decides where the camera stops, and the camera decides which actors are
   updated at all.  The 90 is corroborated by driving down for 90 passes --
   camy reaches exactly 90 and holds -- and 66 across is exercised by the
   horde run (portsim reaches camx 66 and matches the original there).      */
const CAM_MIN=2, CAM_CX=30, CAM_CY=18;
const CAM_SRC=2, CAM_OFF_X=0x22, CAM_OFF_Y=0x16, CAM_MAX_X=0x42, CAM_MAX_Y=0x5A;

/* =======================================================================
   THE HUD AND ITS COUNTERS -- $B5D8..$B8B0, one contiguous block.
   $852E CALL $B6DA is the per-pass entry.  Everything here is LIVE state in
   the player block; the panel ART underneath is still the original's own
   captured rows 20-23, but the four counters are drawn over it from these
   values with the game's own 8x8 font at $77B0 (tools/hudfont.py).

   Player block, 32-byte stride, p1 $8420 (fields this file now carries):
     +2,+3   health  2-byte packed BCD, big-endian.  Clamps $9999 / $0000.
     +4..+6  score   3-byte packed BCD, big-endian.
     +8 keys   +9 potions   +10 power-up timer   +11 HUD DIRTY FLAGS
     +12 level / exit id (BCD)   +$14 inventory bits   +$15 character stats
     +$16 exit dissolve countdown
     +$1D pending-interaction TYPE   +$1E,+$1F its CELL ADDRESS
   $842B's bits, named by the redraw code that consumes them ($B72C..$B7B6):
     0 health dirty  1 score dirty  2 key gained  3 key spent
     4 potion gained 5 potion spent 6 EXITING     7 finished/dead          */
const F_HEALTH_D=0x01, F_SCORE_D=0x02, F_KEY_GAIN=0x04, F_KEY_SPEND=0x08,
      F_POT_GAIN=0x10, F_POT_SPEND=0x20, F_EXITING=0x40, F_DEAD=0x80;

/* $7D1C -- the potion's three parameters, dumped from live RAM.  The index is
   ((IX+$15) >> 2) & 12, plus 4 while the caster is mid-teleport, so entries
   are FOUR bytes apart and only three of each are read.  Reading it with a
   stride of 3 produces plausible nonsense, which is what a first pass at this
   did.  Fields: [$84A3, (IY+$25), (IY+$26)]. */
const POTION_ROWS = [[0x00,0x10,0x10],[0x01,0x10,0x10],[0x02,0x18,0x10],
                     [0x03,0x18,0x18],[0x03,0x18,0x18]];

/* $847E bits 4 and 5 -- THE TWO-PLAYER FRIENDLY-FIRE MODE, set per level
   from the dungeon record's own flags byte ($97CB) and announced by the
   level banner.  Bit 4 makes a player's shot STUN the other for 30 passes;
   bit 5 makes it cost him 5 BCD health; with neither, a partner still blocks
   and absorbs the shot and nothing else happens.  41 of the 307 shipped
   dungeons set the stun bit and none sets the hurt bit. */
const FF_STUN=0x10, FF_HURT=0x20;

/* $A81D -- may the player pick up another key or potion?
     $A81D  LD A,(IX+8) / ADD A,(IX+9)
     $A823  BIT 1,(IX+$14) / JR nz,$A82C
     $A829  CP 10 / RET          <- carry SET means "yes"
     $A82C  CP 15 / RET
   MEASURED at every boundary on the real Z80: 9+0 allowed, 9+1 refused, and
   with inventory bit 1 set 14+0 allowed and 14+1 refused.  The check runs
   BEFORE the cell is cleared, so a full player can neither take the key nor
   walk onto it -- the interaction is re-recorded and the move refused for
   ever.                                                                  */
const CARRY_LIMIT=10, CARRY_LIMIT_BIT1=15;

/* $B6DA -- the passive health drain.  It is keyed off the VIDEO FRAME
   counter $8497 (the ISR's $A2A2 INC (IY+$18)), not the pass counter:
     $B6DA  LD A,($8497) / AND $C0 / CP (IY+$20) / JR nz,$B70E
     $B6E4  ADD A,$40 / LD ($849F),A / INC (IY+$39)
     $B6EC  LD D,1 / BIT 6,(IX+11) / ... / LD HL,$8423 / CALL $B852
   so one BCD point per 64 video frames, and a player whose bit 6 (EXITING or
   dead) is set does not drain.  MEASURED over 5,200 video frames: 82 ticks,
   gap histogram {64: 80, 65: 1}, mean 64.01 frames = 1.278 s.
   The single 65 is the +/-1 jitter of a pass that is not exactly 4 frames
   (my own measurement of pass length: 3.92..5.03 frames, {4:1205,5:47,3:47}
   over 1,300 passes).  This engine advances the frame counter by exactly
   FRAMES_PER_PASS, so it ticks every 16 passes with no jitter -- see the
   PROVISIONAL note on hudPass().                                          */
const DRAIN_MASK=0xC0, DRAIN_STEP=0x40;

/* =======================================================================
   GENERATORS -- map values $20..$2E and nothing else.
     class = (v-$20) div 3   (0..4)      tier = (v-$20) mod 3   (0..2)
   and the TIER IS ALSO THE GENERATOR'S HEALTH, so damaging one makes it
   spawn weaker monsters before it dies.
   $A9E4  LD A,(HL) / SUB $20 / JR c,skip / CP 15 / JR nc,skip  is the guard,
   which is why map value $13 (treasure) is NOT a generator.
   $7CFE, dumped from live RAM: generator value -> spawned state byte
   (class<<5 | tier<<3), and $AA82 ORs the facing into it.                */
const GEN_LO=0x20, GEN_HI=0x2E;
const GEN_CAP=0xC0;                  // $AA0E CP $C0 -- 192 live actors
/* $B0FE, the off-screen cull ($853A).  Distances from the camera CENTRE and
   a budget of five records per pass:
     $B0FE  E = camx+$20 / D = camy+$14 / C = 5
            |x - E| >= $38 or |y - D| >= $32  -> cull, but ONLY if flags bit 2
     $B152  DEC C / JR nz                                                  */
const CULL_CX=0x20, CULL_CY=0x14, CULL_DX=0x38, CULL_DY=0x32, CULL_BUDGET=5;

/* $8469..$8479 -- the table $B246 scores teleport pads with, DUMPED from live
   RAM by tools/extract.py, not written out here.  The score of a pad is
   TELE_SQ[|dx|>>2] + TELE_SQ[|dy|>>2] in cells, i.e. squared cell distance:
   0,1,4,9,16,25,36,49,64,81,100,121 and then 169,196,225,254 -- 144 IS
   MISSING from the tape's own table, so index 12 reads 13^2 and every index
   above 11 is one square too big.  Index 16 (an axis difference of 64..67,
   half the world) reads $8479 = 0.  Both are transcribed, not repaired. */
const TELE_SQ = A.globals.tele_sq;

/* =======================================================================
   THE ORIGINAL'S OWN CELL-ADDRESS CURSORS, $9A18/$9A2D/$9A3D/$9A51.
   The map is addressed as $8000 + 32*row + col with the column wrapping
   inside the row ($9A2D INC L / AND $1F / SUB $20) and the row wrapping the
   whole 1 KB ($9A18's CP $7F / ADD 4).  Several of the routines ported below
   -- the door animator and the generator sweep -- walk a CURSOR rather than a
   (col,row) pair, and the wrap is observable, so they use these.          */
function curRight(c,r){ return [(c+1)&(MAP_W-1), r]; }        // $9A2D
function curLeft(c,r){  return [(c-1)&(MAP_W-1), r]; }        // $9A51
function curDown(c,r){  return [c, (r+1)&(MAP_H-1)]; }        // $9A3D
function curUp(c,r){    return [c, (r-1)&(MAP_H-1)]; }        // $9A18

/* =======================================================================
   ACTORS -- the 4-byte records at $5C00 ($A97F's list), which are the WHOLE
   monster.  count at $8496, tail at $8494 == $5C00 + 4*count, cap 192.

     +0  x      7-bit world coordinate, wraps at 128
     +1  y      7-bit
     +2  state  bits 7:5 CLASS 0..7, bits 4:3 TIER 0..3, bits 2:0 FACING 0..7
     +3  flags  bits 7:6 walk phase, bit 5 blocked-last-try, bit 4 wall-follow
                side, bit 3 invisible, bit 2 generator-spawned, bits 1:0 a
                countdown

   Removal is a SWAP-WITH-LAST ($A641 / $AE7E): the tail record is copied over
   the dead one and the count drops, so slot order is not stable.

   $8418..$841F, dumped from live RAM -- facing slot -> direction bit mask,
   with the PLAYER's own bit meanings (1 up, 2 down, 4 left, 8 right), which
   is what ties the actor compass to the player's $7D0C table:
       01 09 08 0A 02 06 04 05  =  N NE E SE S SW W NW
   $8460..$8468 -- the wall-follow deflection table, indexed [facing + side]:
       06 02 00 04 02 06 04 00 06
   Every entry is a CARDINAL: for a diagonal it is one of that diagonal's two
   components, for a cardinal one of its two perpendiculars.                */
const ACT_DIRMASK=A.globals.dirmask;    // $8418..$841F, dumped from live RAM
const ACT_DEFLECT=A.globals.deflect;    // $8460..$8468, dumped from live RAM
/* $A1DA's four RET nc, which are the UPDATE window and not just the draw
   window -- see actorPass().  A = (coord+3-cam)&$7F must be <= $42 across and
   <= $2A down. */
const ACT_CULL_X=0x42, ACT_CULL_Y=0x2A;

/* $A627 -- what a class-0 monster's touch costs the player, chosen by its
   TIER, and it is NOT a simple table index:
     $A627  LD D,(IX+$18) / BIT 3,(HL) / JR nz,$A638      tier bit 0
     $A62E  LD D,(IX+$19) / BIT 4,(HL) / JR nz,$A638      tier bit 1
     $A635  LD D,(IX+$17)
   BIT 3 is tested FIRST, so tier 3 (both bits) takes the (IX+$18) arm and a
   tier-3 monster does LESS damage than a tier-2 one.  $8437..$8439 hold BCD
   10 20 30, so the four tiers cost 10, 20, 30, 20.
   MEASURED by repainting slot 0's tier and walking into it, reading the
   health pair either side of the pass on which the actor count drops:
     tier 0  $1995 -> $1985      tier 1  $1995 -> $1975
     tier 2  $1995 -> $1965      tier 3  $1995 -> $1975
   This engine used to give tier 3 the tier-0 damage; nothing in dungeon 1 is
   tier 3, so no table caught it -- the disassembly did.
   The three bytes are NOT constants: $AB6F installs them from $7D34 at level
   start, indexed by the character's ARMOUR level -- see ARMOUR_ROWS below.
   A.globals.ghost_damage is the CAPTURED $8437..$8439 and is used only as a
   cross-check that ARMOUR_ROWS[0] is the row the original had. */
const GD = A.globals.ghost_damage;                 // $8437..$8439 = 10 20 30

/* =======================================================================
   THE CHARACTER -- and the $FFFF boot bug this port repairs.

     $BE53  LD A,($FFFF)          player 1's character index, left there by
     $BE5A  CALL $BEE5            the LOADER's menu
     $BEE5  ... LD IX,$BF19 ... CP E / JR z / INC A / ADD HL,BC / INC IX x2
     $BE5D  LD ($8433),A          the SHOT TAG
     $BE61  LD ($8435),C          the ATTRIBUTE byte

   $BF19 is a FOUR-entry table of (shot tag, attribute byte).  MEASURED, not
   read: a fresh boot stopped at $BE53, $FFFF poked, and $8433/$8435 read back
   after $BE61 (`python tools/shotgate.py chars`):

       $FFFF=0 -> ($00,$8E) WARRIOR   shot 2 fight 3 magic 0 armour 2
       $FFFF=1 -> ($08,$D8)           shot 0 fight 2 magic 1 armour 3
       $FFFF=2 -> ($10,$32)           shot 2 fight 0 magic 3 armour 0
       $FFFF=3 -> ($18,$64) ELF       shot 0 fight 1 magic 2 armour 1
       $FFFF=$2A (the stale byte) -> ($20,$20)   <-- the captured state

   THE CAPTURED STATE IS NOT A REACHABLE GAME STATE for these two bytes.  The
   harness never runs the loader's menu, so $FFFF holds a stale $2A and $BEE5
   walks 42 entries past a 4-entry table -- the SAME bug that fed 1,056 bytes
   of ROM to the sprite bank, which this port already repairs from the tape
   (tools/fixchar.py).  Repairing one byte of the pair and not the other would
   be incoherent, so the port repairs the character as a whole.

   The tag is not cosmetic.  With $8433 = $20 a NORTH shot's state byte is
   exactly $20, which is the routine's own "exploding" sentinel ($8C60 CP $20,
   $8DAB CP $20), so it is reaped at the top of the next pass and re-fired for
   ever without moving; and $8DDC sends every other facing down the 8-wide
   OPAQUE blitter at $DD58+32*slot, where slots 4..7 are all zero -- so S, SW,
   W and NW punch a blank hole instead of drawing.  Both measured
   (`python tools/shotgate.py collide`).

   WHO WRITES $FFFF: SETTLED, and it was open for the whole of this project.
   The instruction is

       $C426  CALL $C75B          the character picker, in block A
       $C429  LD A,($C7FD)        its cursor
       $C42C  LD ($FFFF),A

   so ($FFFF) IS THE PICKER CURSOR, verbatim, and the index-to-character map
   is proved three independent ways rather than corroborated:
     * the picker's own tables -- $C800's highlight addresses land on char
       (9,8), (13,8), (13,21), (9,22) and $C818's papers are $10 red, $28
       cyan, $30 yellow, $20 green;
     * the menu ART those four quadrants carry: Thor the Warrior (red, top
       left), Thyra the Valkyrie (cyan, bottom left), Merlin the Wizard
       (yellow, bottom right), Questor the Elf (green, top right);
     * and the GAME'S OWN PANEL after a real menu boot, which prints WARRIOR
       in red, VALKYRIE in cyan, WIZARD in yellow, ELF in green for indices
       0..3 (build/fe_panel_by_index.png -- rendered, and looked at).
   `python tools/blockA.py chars` presses '5' k times and gets ($FFFF) = k;
   `python tools/blockA.py boot k 0` then runs the whole loader and reads
   ($8433,$8435) out of live RAM as ($00,$8E) ($08,$D8) ($10,$32) ($18,$64).

   AND THE PORT'S OLD ASSUMPTION WAS A REACHABLE CHOICE, NOT THE DEFAULT.
   $C7FD holds its TAPE VALUE $00 and nothing writes it between $C1F2 and
   $C426 (write-watched over a complete blind run whose key script only ever
   taps SPACE), so a player who just presses SPACE gets index 0, THE WARRIOR.
   Index 3, the elf this file used to call "corroborated three ways and proved
   by none", is what three presses of key '5' select.  Both are the original;
   neither is an accident any more.                                        */
const CHAR_TABLE = [[0x00, 0x8E], [0x08, 0xD8], [0x10, 0x32], [0x18, 0x64]];
/* THE MENU'S OWN DEFAULT -- ($C7FD)'s tape value, measured.  This is what the
   shipped front end starts its cursor on and therefore what a player who
   taps through the menu plays. */
const CHAR_MENU_DEFAULT = 0;                       // the warrior
/* THE CONFIGURATION EVERY GATE IN THIS PROJECT WAS MEASURED AGAINST, and it
   is named rather than left as a bare literal so that nobody mistakes it for
   the menu's default again.  `new Game()` with no argument -- which is what
   tools/headless.js, pointdiff, shotgate, packgate, p2gate, soundgate and
   beepgate all construct -- keeps the ELF and control method 3, because that
   is the configuration those 770 checks and five differentials were taken
   against on the real Z80.  It is a REACHABLE menu state (three presses of
   '5', three presses of '6'), not a stale byte: the difference between this
   and the old CHAR_INDEX is that this file no longer claims it is the
   original's default.  The shipped artifact never uses it -- it boots through
   the front end, which hands over whatever the player chose. */
/* `buildSeed` is the LEVEL BUILDER's entropy, standing in for $B575's
   `LD A,R`.  It defaults to a constant so every gate and every headless run
   builds the same dungeons; the shipped page reseeds it once per game (see
   feHandover), because on the original the byte $91B5 draws into $84C7 is
   genuinely unpredictable and it is what MIRRORS the level -- bit 1 flips it
   horizontally at $9C06, bit 0 vertically at $9C69.  With the seed fixed,
   level 9 came out the same way up every single game; on a real machine it is
   one of four. */
const GATE_CONFIG = {char: 3, char2: 1, method1: 3, method2: 3,
                     buildSeed: 0x13579BDF};
/* A FRESH one for a real game.  The shipped page has Date and performance;
   the headless sandbox has NEITHER, and has to stay reproducible anyway --
   so falling back to the constant there is not a compromise, it is what every
   gate already expects.  Guarded with typeof because an undefined global is a
   ReferenceError, not undefined. */
function freshBuildSeed(){
  let v = 0;
  if (typeof Date !== 'undefined' && Date.now) v ^= Date.now() >>> 0;
  if (typeof performance !== 'undefined' && performance.now)
    v ^= (performance.now() * 65536) >>> 0;
  return (v >>> 0) || GATE_CONFIG.buildSeed;
}
const CHAR_INDEX = GATE_CONFIG.char;               // the elf
const CHAR_RAW = [0x20, 0x20];                     // what the capture holds
/* PLAYER 2's character, $FFFE -> $BE64 -> $BEE5 -> $8453/$8455.  WHO WRITES
   IT is settled too, and the answer is that in a ONE-PLAYER GAME NOBODY CAN
   KNOW:
     two players  $C4E0 LD A,($C7FD) / $C4E3 LD ($FFFE),A   -- a real choice,
                  with $C7FE forbidding player 1's index, so the diagonal is
                  unreachable and the other twelve pairs all are;
     one player   $C43F LD A,R / AND 3 / CP C / JR nz / INC A / AND 3
                  -- a REFRESH REGISTER DRAW, forced only to differ from
                  player 1's.  Enumerated over all 256 R: (p1+1)&3 at 1/2 and
                  the other two at 1/4 each.  MEASURED by varying nothing but
                  the dwell in the picker by 0..15 frames it takes all three
                  permitted values (see feDrawP2).
   So "player 2 is the valkyrie" is NOT a fact about the tape -- it is one of
   three outcomes, and with player 1 on the elf it is the 1/4 one, not the
   modal one.  CHAR2_INDEX below started as the GATE baseline only (the
   two-player differential seeds $2A for both, matching the captured
   machine), and the FAITHFUL front end (STREAMLINED_FRONTEND false) still
   applies $C43F's real, unreproducible guard instead of this constant.

   The STREAMLINED options screen (the one that actually ships) is a
   SECOND, later consumer that is not faithful in the first place, so
   $C43F is not what it owes fidelity to: with one LOCAL player left
   (online fork), optFinish() derives $FFFE from this constant through
   feDrawP2's own guard -- CHAR2_INDEX, falling forward one slot if that
   collides with player 1's pick -- deterministically, every time, not
   1-in-3.  That is a DELIBERATE product choice (a stable, reviewable
   default beats a hidden coin flip), not a reproduction of $C43F, and
   nothing pins it down as a test invariant: the byte only ever names the
   sprite bank the never-joined player 2 block loads (see readKeys). */
const CHAR2_INDEX = GATE_CONFIG.char2;             // the valkyrie

/* $7D34 -- six 8-byte records, of which six bytes each are used.  $AB6F does
     $AB6F  LD A,(IX+$15) / RRCA x3 / AND $18      ARMOUR (bits 7:6) * 8
     $AB78  BIT 0,(IX+$14) / ADD A,$10             +2 records with inventory 0
     $AB80  LD DE,$7D34 / ADD A,E ... LD BC,6 / LDIR -> $8437
   so the row is $7D34 + 8*(armour + 2*inv bit0) and armour 5 repeats armour 4.
   +0..+2 are what a CLASS 0 costs by tier, +3..+5 what a class 1..4 costs.
   Dumped from live RAM; row 0 is cross-checked against the captured
   $8437..$8439 in a headless check. */
const ARMOUR_ROWS = [[0x10, 0x20, 0x30, 0x05, 0x08, 0x0A],
                     [0x09, 0x18, 0x27, 0x05, 0x07, 0x09],
                     [0x08, 0x16, 0x24, 0x04, 0x06, 0x08],
                     [0x07, 0x14, 0x21, 0x04, 0x05, 0x07],
                     [0x06, 0x12, 0x18, 0x03, 0x04, 0x05],
                     [0x06, 0x12, 0x18, 0x03, 0x04, 0x05]];

/* =======================================================================
   SHOOTING.  The fire bit is bit 4 of the direction byte $8427 and the key
   is Z ($862E, control method 3); bit 5 is the POTION and the key is CAPS.
   Measured by pressing all 40 keys from the saved state: only Z sets bit 4
   and only Z produces a shot (`python tools/shotgate.py firekey`).       */
const DIR_FIRE = 0x10, DIR_POTION = 0x20;

/* $7D7C, dumped from live RAM -- eight (dx,dy) pairs indexed by the shot's
   compass slot.  A diagonal steps 2 on BOTH axes, so it is sqrt(2) faster in
   absolute terms than a cardinal, exactly as the actors' own probe is. */
const SHOT_STEP = [[0, -2], [2, -2], [2, 0], [2, 2],
                   [0, 2], [-2, 2], [-2, 0], [-2, -2]];

/* $7D64/$7D65, INTERLEAVED with stride 2 and indexed 2*(SHOT POWER + 2*inv
   bit 3) by $9115 -- the even column is what a shot takes off an ACTOR (in
   tier units of 8) and the odd column what it takes off a GENERATOR.  The
   table is kept interleaved so the index arithmetic mirrors $9137's
   ADD A,A / ADD A,E. */
const SHOT_DMG = [0x08, 0x02, 0x09, 0x03, 0x10, 0x04,
                  0x11, 0x06, 0x18, 0x06, 0x18, 0x06];

/* $8D97/$8DA1 -- the RANGE, and there is no range counter: the shot lives
   only while it is inside a 61 x 37 unit window measured from the camera
   ORIGIN, in $AD37's FOLDED space.  $AD37 folds into [-64,63] and does NOT
   take an absolute value, so one unit above or left of the camera origin
   already reads >= the limit.  ENUMERATED over a 140x140 offset grid on the
   real routine: exactly 2257 offsets, a perfect rectangle
   (`python tools/shotgate.py window`). */
const SHOT_CULL_X = 0x3D, SHOT_CULL_Y = 0x25;

/* The HUD's own font and the live counter state, extracted by
   tools/hudfont.py straight out of $77B0 and the player block. */
const HUD = A.hud_font || null;
/* $7CFE, 15 bytes, dumped from live RAM: generator map value -> the spawned
   actor's state byte, which is (class<<5) | (tier<<3).  $AA82 ORs the facing
   into it.  $7D70, 16 bytes: the melee damage table $A964 indexes. */
const GEN_STATE = HUD ? HUD.gen_state_table
                      : [0,8,0x10,0x20,0x28,0x30,0x40,0x48,0x50,0x60,0x68,0x70,
                         0x80,0x88,0x90];
const MELEE_DMG = HUD ? HUD.melee_damage
                      : [0,2,0,3,1,4,2,5,3,6,3,6,0,0xFE,2,0xFE];

/* $AD37 -- fold a 7-bit coordinate difference into a signed byte, so the
   chase always takes the short way round the 128-unit world:
     $AD37  CP $80 / JR nc,$AD41 / CP $40 / RET c / XOR $80 / RET
     $AD41  CP $C0 / RET nc / XOR $80 / RET
   Range [-64,63], and $80 is unreachable -- which is what makes $ADB4's
   `JP p` on 0-L equivalent to a sign test. */
function wrap7(a){
  a &= 0xFF;
  if (a < 0x80) return a < 0x40 ? a : (a ^ 0x80);
  return a >= 0xC0 ? a : (a ^ 0x80);
}

/* $AD47 -- $AD37's fold followed by NEG, i.e. |difference| the SHORT way
   round the 128-unit world:
     $AD47  CALL $AD37 / CP $80 / RET c / NEG / CCF / RET                  */
function wrapAbs(d){
  const v = wrap7(d);
  return v < 0x80 ? v : (0x100 - v) & 0xFF;
}

/* One axis of $B58C.  `tgt` is the byte $A3E6 left at $848D/$848E -- the
   MIDPOINT of the two players, not a player's own coordinate.  `hi` is the
   clamp: $42 across, $5A down. */
function camStep(cur, tgt, off, hi){
  let t = tgt - off;                      // $B58F  LD A,($848D) / SUB $22
  t = t < 0 ? 0 : (t & 0x7F);             // $B594  JR nc / SUB A
  t = (t + 2) & 0x7F;                     // $B599  ADD A,2
  if (t >= hi) t = hi;                    // $B59D  CP $42 / LD A,$42
  const dd = (t - cur) & 0x7F;            // $B5A3  SUB (HL) / $B5A6 AND $7F
  if (dd === 0) return cur;               // $B5A4  JR z
  return dd < 0x40 ? (cur + 2) & 0x7F     // $B5AB  the short way round
                   : (cur - 2) & 0x7F;
}

/* ---- the BCD arithmetic, which is the whole of $B7E9/$B807/$B852 -------
   Health and score are PACKED BCD in the original and every operation is a
   DAA add or subtract, so they are kept packed here too rather than converted
   to integers: the clamps ($9999 on health, 000000 wrapping the score into a
   separate million counter) and the leading-zero rendering all fall out of
   the packed form, and converting would need them re-derived by hand.

   $B852  LD A,(HL) / SUB D / DAA / LD (HL),A / DEC L / LD A,(HL) / SBC A,0 /
          DAA / LD (HL),A / RET nc / LD (HL),0 / INC L / LD (HL),0
   -- HL points at the LOW byte and the pair is clamped to 0000 on borrow. */
/* One byte of ADD/DAA and one of SUB/DAA.  Written as digit arithmetic
   because that is what DAA means for valid BCD operands, and because the
   half-carry rules are easy to get subtly wrong when they are open-coded --
   both are gated against the original's own $B7E9/$B807/$B852 in
   tools/headless.js over an enumerated set of operands. */
function daaAdd(x,y,cin){
  let lo=(x&15)+(y&15)+cin, c=0;
  if(lo>9){lo-=10;c=1;}
  let hi=((x>>4)&15)+((y>>4)&15)+c; c=0;
  if(hi>9){hi-=10;c=1;}
  return {v:((hi<<4)|lo)&0xFF, c};
}
function daaSub(x,y,bin){
  let lo=(x&15)-(y&15)-bin, b=0;
  if(lo<0){lo+=10;b=1;}
  let hi=((x>>4)&15)-((y>>4)&15)-b; b=0;
  if(hi<0){hi+=10;b=1;}
  return {v:((hi<<4)|lo)&0xFF, b};
}
function bcdSub(hp, d){
  const l=daaSub(hp&0xFF, d&0xFF, 0);
  const h=daaSub((hp>>8)&0xFF, 0, l.b);
  if (h.b) return 0;                              // $B85C RET nc / $B85D clamp
  return ((h.v<<8)|l.v)&0xFFFF;
}
/* $B7E9  (IX+3) += E with DAA, (IX+2) += D with ADC/DAA, SET 0,(IX+11), and
   on carry out clamp BOTH bytes to $99 -- i.e. health saturates at 9999. */
function bcdAdd16(hp, add){
  const l=daaAdd(hp&0xFF, add&0xFF, 0);
  const h=daaAdd((hp>>8)&0xFF, (add>>8)&0xFF, l.c);
  if (h.c) return 0x9999;                         // $B7FD RET nc / $B7FE clamp
  return ((h.v<<8)|l.v)&0xFFFF;
}
/* $B807 -- the same, three bytes wide, for the score.  The carry out of the
   top byte goes to $84C8/$84C9, the per-player MILLION counter ($B82E). */
function bcdAdd24(sc, add){
  let out=0, c=0;
  for (let b=0;b<3;b++){
    const sh=b*8;
    const r=daaAdd((sc>>sh)&0xFF, (add>>sh)&0xFF, c);
    c=r.c; out |= r.v<<sh;
  }
  return {score: out>>>0, wrapped: c};            // $B828 -> $B82E
}

/* =======================================================================
   THE DUNGEONS -- $97CB, the pack expander, transcribed
   =======================================================================
   Levels used to come from ONE captured live map.  They now come from the
   TAPE: build/packdata.json carries the 307 dungeon records of side 2 (125
   distinct byte-strings; tools/packexport.py, which asserts the container
   arithmetic of all 31 packs on the way past) and the code below is the
   original's own expander, so the engine BUILDS each dungeon the way the
   original builds it rather than shipping a picture of one.

   A record, self-delimiting:
       +0  length low byte   (9th bit = bit 7 of +2)
       +1  flags   b0 -> SET 5,(IY-1)      b1 -> SET 4,(IY-1)
                   b2 -> the "one random $36 survives" pass $9B5F
                   b3-b5 -> sprite bank index ($9AB9)
                   b6 -> suppress the $5A3E attribute clear
                   b7 -> suppress the $423E bitmap clear AND drop the LEFT
                         border column (the fixed table is walked for 3 bytes
                         instead of 4) -- 52 of the 307 records
       +2  b7 = the 9th length bit;  b3-b5 = colour scheme ($7D9C[n])
       +3  LENGTH IN BYTES of the vector table
       +4 .. +3+(+3)   the vector table (2-byte points and 1-byte runs)
       the rest        the RLE cell stream

   BUILD ORDER, read off the machine at $9880..$98A7 rather than paraphrased
   (`python tools/adis.py 0x9880 50 --image build/live_cs.bin`):
       $981A  clear $8000..$83FF          $9827  reset the actor list
       $9845  the record's vector table   $9855  the fixed border at $7DB4
       $9871  the RLE stream
       $9893  CALL nz,$9B5F   (flags bit 2)
       $9896  CALL $9BB7      -- the level>=8 extra objects
       $9899  CALL $9B0E      -- the actor-list partition
       $989C  CP 8 / RET c ; $98A2 CALL $9C06 ; $98A5 JP $9C69   the mirrors
   $9BB7 comes BEFORE $9B0E, not after; an earlier write-up had them the
   other way round and this is the disassembly, not a reading of it.       */
const PACKDATA = A.packs;
const REC_BYTES = b64(PACKDATA.blob);
const REC_OFF = (()=>{ const o=[]; let p=0;
                       for(const n of PACKDATA.lens){ o.push(p); p+=n; }
                       return o; })();
/* one record's own bytes, as they lie on the tape */
function packRecord(id){
  return REC_BYTES.subarray(REC_OFF[id], REC_OFF[id] + PACKDATA.lens[id]);
}
/* pack p (0..30), sub-block s -> the record id.  Pack 0 is the tape's $80
   block and holds dungeons 1..7; packs 1..30 hold ten each, 8 and 9 being
   the treasure rooms ($C09F: AND 1 / ADD A,8). */
function packSub(p, s){ return PACKDATA.packs[p][s]; }
const PACK_COUNT = PACKDATA.packs.length;                 // 31

/* $7DA4 -- eight signed 16-bit cursor deltas, N NE E SE S SW W NW */
const VEC_DELTA=[-32,-31,1,33,32,31,-1,-33];
/* $7DB4 -- the fixed border: a point at (col 31,row 0) with pen $E0 (wall),
   a 31-cell run WEST along row 0 and a 31-cell run SOUTH down column 0.
   Both axes wrap, so that is a complete boundary; flags bit 7 drops the last
   byte and with it the left wall column.                                   */
const VEC_BORDER=[0xFF,0xE0,0xDE,0x9E,0x00,0x00];

/* One dungeon under construction.  Cells are addressed by the original's own
   16-bit pointer into $8000..$83FF so that the wrap arithmetic is the
   original's ($9A18/$9A2D/$9A3D/$9A51) and not a modulo -- and so that the
   RLE cursor, which is a PLAIN `INC HL` ($987A/$98B2) and can run past
   $83FF, spills exactly where the original's does.                        */
class Dungeon{
  constructor(){
    this.cell = new Uint8Array(0x400);
    this.spill = new Map();
    this.actors = [];                 // [x, y, type]
    this.player = [0,0];
    this.thirtysix = [];              // the $9B5F candidates
    this.cur = 0;                     // C' -- the current tile
    this.pen = 0;                     // B' -- the current vector pen
    this.flags = 0; this.colour = 0; this.bank = 0;
  }
  get(hl){ return (hl>=0x8000 && hl<0x8400) ? this.cell[hl-0x8000]
                                            : (this.spill.get(hl)|0); }
  put(hl,v){ v&=0xFF;
             if(hl>=0x8000 && hl<0x8400) this.cell[hl-0x8000]=v;
             else this.spill.set(hl,v); }
  /* $9A18 up: L -= $20, and on borrow H-- with the $7F -> $83 fix-up */
  static up(hl){ let h=hl>>8, l=hl&0xFF; const a=l-0x20; l=a&0xFF;
                 if(a<0){ h=(h-1)&0xFF; if(h===0x7F) h=(h+4)&0xFF; }
                 return (h<<8)|l; }
  /* $9A2D right: INC L, and AND $1F / SUB $20 wraps the COLUMN, not the row */
  static right(hl){ let h=hl>>8, l=(hl+1)&0xFF;
                    if((l&0x1F)===0) l=(l-0x20)&0xFF; return (h<<8)|l; }
  /* $9A3D down: L += $20, on carry H++ with the $84 -> $80 fix-up */
  static down(hl){ let h=hl>>8, l=hl&0xFF; const a=l+0x20; l=a&0xFF;
                   if(a>0xFF){ h=(h+1)&0xFF; if(((h-4)&0xFF)===0x80) h=0x80; }
                   return (h<<8)|l; }
  /* $9A51 left */
  static left(hl){ let h=hl>>8, l=(hl-1)&0xFF;
                   if(((~l)&0x1F)===0) l=(l+0x20)&0xFF; return (h<<8)|l; }
  /* $9A6B -- a map pointer as (x,y) in COORDINATE units: col*4, row*4 */
  static coords(hl){ return [(hl&0x1F)*4 & 0xFF, (((hl<<3)>>8)&0x1F)*4 & 0xFF]; }

  /* $98BF  LD A,(HL) / AND $7F / RET z / CP $11 / RET   -- carry = 1..$10 */
  isWall(hl){ const a=this.get(hl)&0x7F; return a>=1 && a<=0x10; }
  /* $9A04 -- the same test, except that an ISOLATED wall ($10) is reset to 0
     on the way past so that the new neighbour can re-connect it.  Bit 7 (the
     alternate wall graphic) survives the reset.                            */
  isWall9A04(hl){ const a=this.get(hl)&0x7F;
                  if(a===0) return false;
                  if(a<0x10) return true;
                  if(a>0x10) return false;
                  this.put(hl, this.get(hl)&0x80); return true; }
  /* $99B3 -- a wall that ends up with no connections is $10, isolated */
  isolate(hl){ if((this.get(hl)&0x7F)===0) this.put(hl, this.get(hl)|0x10); }

  /* $9A7A -- $3F is the PLAYER START and anything above it is an ACTOR;
     neither leaves anything in the cell.
       type = (((t>>1) & $1C) | (t & 3)) * 8, i.e. for id $40+8f+r the type
       byte is 32f + 8r -- family in bits 7:5, tier in bits 4:3.            */
  spawn(hl){
    const t=this.cur;
    if(t===0x3F){ this.player = Dungeon.coords(hl); return; }
    if(t<0x40) return;
    const [x,y]=Dungeon.coords(hl);
    this.actors.push([x, y, ((((t>>1)&0x1C)|(t&3))<<3)&0xFF]);
  }
  /* $9960 -- place the current tile.  Overwriting a WALL breaks the four
     neighbours' connection bits towards it ($9976..$99B2). */
  place(hl){
    this.spawn(hl);
    const wasWall=this.isWall(hl);
    let a=this.cur; if(a>=0x3F) a=0;
    this.put(hl,a);
    if(!wasWall) return;
    const steps=[[Dungeon.up,0x04],[Dungeon.right,0x08],
                 [Dungeon.down,0x01],[Dungeon.left,0x02]];
    for(const [step,bit] of steps){
      const h2=step(hl);
      if(this.isWall(h2)){ this.put(h2, this.get(h2) & ~bit & 0xFF);
                           this.isolate(h2); }
    }
  }
  /* $99BA -- place a WALL.  The value IS the connectivity: bit0 up, bit1
     right, bit2 down, bit3 left, $10 nothing at all, bit 7 = the second wall
     graphic (pen exactly $C0; the game masks it off with AND $7F everywhere
     it reads a cell).                                                       */
  placeWall(hl){
    let b=0, h2;
    h2=Dungeon.up(hl);    if(this.isWall9A04(h2)){ this.put(h2,this.get(h2)|0x04); b|=0x01; }
    h2=Dungeon.right(hl); if(this.isWall9A04(h2)){ this.put(h2,this.get(h2)|0x08); b|=0x02; }
    h2=Dungeon.down(hl);  if(this.isWall9A04(h2)){ b|=0x04; this.put(h2,this.get(h2)|0x01); }
    h2=Dungeon.left(hl);  if(this.isWall9A04(h2)){ b|=0x08; this.put(h2,this.get(h2)|0x02); }
    if(b===0) b=0x10;
    this.put(hl,b);
    if(this.pen===0xC0) this.put(hl, this.get(hl)|0x80);
  }
  /* $9945 -- what the PEN paints: >= $C0 a wall, $80 door $11, $40 door $12,
     anything else the tile $36 (the one $9B5F thins). */
  paint(hl){
    const a=this.pen;
    if(a>=0xC0){ this.placeWall(hl); return; }
    if(a===0x80) this.cur=0x11;
    else if(a===0x40) this.cur=0x12;
    else this.cur=0x36;
    this.place(hl);
  }
}

/* $98C6 -- the vector-table walker.  Turtle graphics with TWO entry kinds
   told apart by the top 3 bits ("tag") of consecutive bytes:

     POINT (2 bytes)  b0 = tag<<5|column, b1 = tag<<5|row, same tag.
                      pen := b0 & $E0, cursor := $8000 + row*32 + col, paint.
     RUN   (1 byte)   b0 = dir<<5|(count-1); step the cursor `count` times by
                      VEC_DELTA[dir] and paint each cell.  The PEN PERSISTS.

   The disambiguation is transcribed literally from $98CB..$98EE (c = bytes
   left).  The lookahead reads up to 3 bytes past the entry it is deciding
   about; ASSERTED in tools/packexport.py for all 307 records that the RLE
   body is long enough that it can never leave the record.                  */
function walkVectors(dg, buf, off, count, hl){
  const tag=b=>b&0xE0;
  const at=i=>(i<buf.length? buf[i] : 0);
  const same=i=>tag(at(i))===tag(at(i+1));
  let de=off, c=count;
  for(;;){
    if(c===0) return hl;
    const b0=at(de);
    let run=false;
    if(c-1===0) run=true;                            // $98CB
    else if(!same(de)) run=true;                     // $98CF
    else if(c===3 && same(de+1)) run=true;           // $98D4..$98DE
    else if(same(de+1) && !same(de+2)) run=true;     // $98E1 / $98E6
    if(run){
      /* $990E.  A run only RE-ORIENTS a door pen: $991F keeps it when it is
         already a wall ($C0+) or $20, otherwise picks $80 or $40 off bit 1 of
         the direction index. */
      const idx=(b0>>4)&0x0E, delta=VEC_DELTA[idx>>1];
      if(dg.pen<0xC0 && dg.pen!==0x20) dg.pen=(idx&0x04)?0x80:0x40;
      const n=(b0&0x1F)+1;
      for(let i=0;i<n;i++){ hl=(hl+delta)&0xFFFF; dg.paint(hl); }
      de++; c--; continue;
    }
    const b1=at(de+1);                               // $98EF -- a POINT
    hl=0x8000 + (b1&0x1F)*32 + (b0&0x1F);
    dg.pen=b0&0xE0;
    dg.paint(hl);
    de+=2; c-=2;
    if(c===0) return hl;
  }
}

/* $9B5F -- with flags bit 2 set, exactly ONE $36 cell survives and which one
   is a draw:  B = the count; C = (rand & $3F, redrawn while >= B) + 1; the
   walk then keeps the cell where the DECREMENTING B equals C and zeroes every
   other.  So the survivor is the (count - C)th in scan order.
   THE DRAW IS $B575 -> LD A,R and is not reproducible; the RULE is.        */
function thin36(dg, rng){
  const cand=[]; for(let i=0;i<0x400;i++) if(dg.cell[i]===0x36) cand.push(i);
  dg.thirtysix=cand;
  if(!cand.length) return;
  let a; do { a=rng()&0x3F; } while(a>=cand.length);   // $9B70..$9B76
  const keep=cand.length-(a+1);                        // $9B83 LD A,B / SUB C
  for(let i=0;i<cand.length;i++) if(i!==keep) dg.cell[cand[i]]=0;
}

/* $9B0E -- partition the actor list so that every record with
   (type & $E0) == $A0 comes first, in order.  Deterministic: it is a
   swap-with-the-front walk, not a sort.  ($9B0E also zeroes $5B60..$5B8F,
   the class-5 drain accumulators, which the engine clears at level start.) */
function partitionActors(list){
  let j=0;
  for(let i=0;i<list.length;i++)
    if((list[i][2]&0xE0)===0xA0){ const t=list[i]; list[i]=list[j]; list[j]=t; j++; }
}

/* $9BB7 -- the level >= 8 extras.  Every threshold here is a DIFFICULTY
   SCALER computed at $B401..$B428 from the level number through $B466
   (B += floor(level / C), saturating at 255):
       $84BD = 180 + level        the object-drop threshold
       $84BE = 5 + level/12       how many objects
       $84BF = 25 + level/2       which type
   and note the SENSE of the first test: $9BCC CP C / JR c,$9BD9 skips when
   rand < $84BD, so the drop happens when rand >= 180+level -- it gets RARER
   with depth, and is impossible from level 75 on.
   $9B99 places at a random free cell that no actor is standing in ($A97F).  */
function extraObjects(dg, level, bonus, scal, rng){
  if(level<8) return;                                  // $9BBA CP 8 / RET c
  let c=scal.objProb;                                  // $84BD
  if(bonus) c>>=1;                                     // $9BC6 SRL A
  if((rng()&0xFF)>=c){                                 // $9BCC CP C / JR c
    let t; do { t=rng()&7; } while(t>=6);              // $9B8C: $19..$1E
    placeObject(dg, 0x19+t, rng);
    dg.forced = true;                                  // $9BD5 SET 4,(IY-2)
  }
  if(bonus) return;                                    // $9BD9 BIT 6 / RET nz
  let n; do { n=rng()&15; } while(n===0 || n>=scal.objCount);
  for(let i=0;i<n;i++){
    let c2=0x14;                                       // $9BEB LD C,$14
    if((rng()&0xFF)<scal.objType) c2=0x31;             // $9BF6
    else if((rng()&3)===0) c2=0x15;                    // $9BFA AND 3 / INC C
    placeObject(dg, c2, rng);
  }
}
/* $9B99 -- L = rand, H = (rand & 3) | $80: a uniform cell of $8000..$83FF.
   Retry while the cell is non-zero or an actor is inside $A97F's 7x7 box. */
function placeObject(dg, v, rng){
  for(let tries=0;tries<4096;tries++){
    const hl=0x8000 + ((rng()&3)<<8) + (rng()&0xFF);
    if(dg.get(hl)!==0) continue;
    const [x,y]=Dungeon.coords(hl);
    if(dg.actors.some(a=>((a[0]-x+3)&0x7F)<=6 && ((a[1]-y+3)&0x7F)<=6)) continue;
    dg.put(hl,v); return;
  }
}

/* $9CCD / $9CBA / $9CA8 -- the mirrors' tile fix-up.  Only a WALL is
   transposed; $10 and $90 (isolated) have nothing to swap.                 */
function isWallCell(a){ return a<0x7F ? a<0x10 : a<0x90; }
function flipLR(a){                                    // $9CBA
  if(!isWallCell(a)) return a;
  let v=a&0x85;                                        // up, down, bit 7
  if(a&0x08) v|=0x02;                                  // left  -> right
  if(a&0x02) v|=0x08;                                  // right -> left
  return v;
}
function flipUD(a){                                    // $9CA8
  if(!isWallCell(a)) return a;
  let v=a&0x8A;                                        // right, left, bit 7
  if(a&0x04) v+=1;                                     // down -> up
  if(a&0x01) v|=0x04;                                  // up   -> down
  return v;
}
/* $9C3D..$9C68 -- THE TAIL BOTH MIRRORS SHARE, and the part an earlier
   write-up got wrong.  It transforms the player start AND EVERY ACTOR:
       x := ((x XOR E) + 1) AND $7C ;  y := ((y XOR D) + 1) AND $7C
   with DE = $007F for $9C06 (it falls in at $9C3A) and $7F00 for $9C69 (it
   reaches it through $9CA3 LD DE,$7F00 / JR $9C3D), stride 4, count $8496.
   MEASURED HERE, not taken on trust: write-watching $5C00..$5CFF through a
   level-8 build with $84C7 = 3 logs $9C5B (x) and $9C62 (y) and nothing else,
   and forcing $84C7 over 0..3 on pack 16 sub 5 moves all 147 actors exactly
   as the two lines above predict.  "The actor list is not mirrored" is
   FALSE; a port that believes it spawns every monster in the wrong place on
   three levels in four from dungeon 8 on.                                  */
function mirrorTail(dg, e, d){
  dg.player=[(((dg.player[0]^e)+1)&0x7C), (((dg.player[1]^d)+1)&0x7C)];
  for(const a of dg.actors){
    a[0]=(((a[0]^e)+1)&0x7C); a[1]=(((a[1]^d)+1)&0x7C);
  }
}
/* $9C06 -- reverse every row (L XOR $1F swaps columns c and 31-c, with the
   tile fix-up applied to both), then $9C28 rotates the row one cell right. */
function mirrorH(dg){
  for(let r=0;r<32;r++){
    const row=[];
    for(let c=0;c<32;c++) row.push(flipLR(dg.cell[r*32+c]));
    row.reverse();
    for(let c=0;c<32;c++) dg.cell[r*32+c]=row[(c+31)%32];
  }
  mirrorTail(dg, 0x7F, 0x00);                          // $9C3A LD DE,$007F
}
/* $9C69 -- the same down the columns (L XOR $E0 / H XOR 3 is the row flip) */
function mirrorV(dg){
  for(let c=0;c<32;c++){
    const col=[];
    for(let r=0;r<32;r++) col.push(flipUD(dg.cell[r*32+c]));
    col.reverse();
    for(let r=0;r<32;r++) dg.cell[r*32+c]=col[(r+31)%32];
  }
  mirrorTail(dg, 0x00, 0x7F);                          // $9CA3 LD DE,$7F00
}

/* $97CB -- THE EXPANDER, end to end.
     opt.level   $8403.  Below 8 the mirrors and $9BB7 do not run at all.
     opt.c7      $84C7, the byte $91B5 draws on every level >= 8: bit 1 runs
                 $9C06, bit 0 runs $9C69.
     opt.bonus   $847E bit 6, the treasure room.
     opt.scal    the $B401..$B428 difficulty bytes.
     opt.rng     the entropy.  Defaults to a constant 0, which is what the
                 closure test drives it with, because $B575 is LD A,R and no
                 port can reproduce the draws (only the rules and the rate). */
function buildDungeon(rec, opt){
  opt = opt || {};
  const level = opt.level === undefined ? 1 : opt.level;
  const rng = opt.rng || (()=>0);
  const scal = opt.scal || {objProb:0xFF, objCount:5, objType:25};
  const dg = new Dungeon();
  const flags = rec[1];
  const hdrlen = rec[3];
  dg.flags = flags;
  dg.colour = (rec[2]>>3)&7;                           // $9AB9 -> $7D9C[n]
  dg.bank = (flags>>3)&7;                              // $9AB9 -> $F524+n*$210
  // $9845 -- the record's own vector table
  let hl = walkVectors(dg, rec, 4, hdrlen, 0x8000);
  // $9855 -- the fixed border, 3 bytes instead of 4 when flags bit 7 is set
  walkVectors(dg, VEC_BORDER, 0, (flags&0x80)?3:4, hl);

  /* $9859..$986D -- how many RLE bytes.  C = (+0) - (hdrlen + 4); a BORROW
     kills the 9th length bit ($986D RES 7,(IX+2)); C == 0 means 256; and
     $9881 goes round a SECOND time if the 9th bit survived. */
  let ninth = (rec[2]&0x80)!==0;
  const c = (rec[0] - ((hdrlen+4)&0xFF)) & 0xFF;
  if (rec[0] < ((hdrlen+4)&0xFF)) ninth = false;
  let left = (c ? c : 256) + (ninth ? 256 : 0);

  // $9871 -- the RLE.  The cursor is a PLAIN INC HL and never wraps.
  let de = 4 + hdrlen;
  hl = 0x8000;
  while(left){
    const a = de<rec.length ? rec[de] : 0;
    if(a>=0x80){ hl=(hl+(a&0x7F)+1)&0xFFFF; }          // $9876 skip
    else if(a>=0x13){ dg.cur=a; dg.place(hl); hl=(hl+1)&0xFFFF; }   // $98AC
    else { for(let i=0;i<=a;i++){ dg.place(hl); hl=(hl+1)&0xFFFF; } } // $98B5
    de++; left--;
  }

  dg.thirtysix=[]; for(let i=0;i<0x400;i++) if(dg.cell[i]===0x36) dg.thirtysix.push(i);
  if(flags&0x04) thin36(dg, rng);                      // $9893
  extraObjects(dg, level, !!opt.bonus, scal, rng);     // $9896
  partitionActors(dg.actors);                          // $9899
  if(level>=8){                                        // $989C CP 8 / RET c
    if(opt.c7 & 2) mirrorH(dg);                        // $98A2 -> $9C06 BIT 1
    if(opt.c7 & 1) mirrorV(dg);                        // $98A5 -> $9C69 BIT 0
  }
  return dg;
}

/* $B466 -- the difficulty scalers.  B += 1 per successful SUB C, i.e.
   B + floor(level / C), and `INC B / JR nz` means it SATURATES at 255. */
function scaleByLevel(level, c, b){
  let a=level&0xFF;
  for(;;){ a-=c; if(a<0) return b; b++; if(b>0xFF) return 0xFF; }
}
/* $B401..$B428, in the order the original computes them */
function difficulty(level){
  return {spawnBase: scaleByLevel(level, 2, 0x32),     // $84A0  50 + level/2
          objCount:  scaleByLevel(level, 12, 5),       // $84BE   5 + level/12
          objType:   scaleByLevel(level, 2, 0x19),     // $84BF  25 + level/2
          objProb:   scaleByLevel(level, 1, 0xB4)};    // $84BD 180 + level
}

/* =======================================================================
   $9175 -- WHICH RECORD, and the tape sequencing behind it
   =======================================================================
   THE GAME NEVER INDEXES THE TAPE.  $9203 asks the ROM for the next block
   whose flag byte equals $84CD and takes whatever arrives, so the tape's
   physical order IS the level order.  What makes that work is that EVERY
   PACK CARRIES ITS OWN CODE: the loader's last act is $9278 LD HL,$C000 /
   PUSH HL / (zero 6 bytes) / RET, which jumps into the block it has just
   loaded, and the 179-byte stub at +$006 (byte-identical in all 31 packs)
   decides which sub-blocks come out.

     flag $80 (block 0)   $84CC := $80, $84CD := $C0, and all 7 of its
                          records go into the stash verbatim -- so dungeons
                          1..7 are FIXED.
     flag $C0 (1..30)     draw FOUR distinct indices; three of them become the
                          stash and the FOURTH is played immediately off the
                          raw buffer.  $84CC := 7.  One pack = four levels.

   THE DRAWS, transcribed from the stub at +$019..+$043 with the detail that
   makes them non-uniform: pick() rejects any value equal to the CURRENT C, D
   or E, and $C019 LD DE,0 zeroes D and E first -- so 0 is rejected by the
   first three draws and SUB-BLOCK 0 CAN ONLY EVER BE THE FOURTH.  The first
   pick is UNCONDITIONAL and is then overwritten on a treasure level, so the
   treasure path consumes one extra draw.
   THE DRAWS ARE $B575 -> LD A,R and are not reproducible.  The RULES are.  */
class Tape{
  constructor(){
    /* $84CC bit 7 "the first pack is held", bits 0-2 the remaining stash
       records; $84CD the flag the next load asks for.  NEITHER IS RESET BY
       $B35A: a write-watch over $84B0..$84CF while running $B35A..$B381 logs
       only $84C8/$84C9 and $84BA, and the whole image writes $84CC at just
       two sites ($91D4 and the pack's own $C00D).  They are zero at COLD
       BOOT only, which is why $B48F is "BIT 7 / RET nz" and not an
       unconditional REWIND TAPE prompt.                                    */
    this.mask=0; this.want=0x80;
    this.pos=-1;                     // which tape block was last consumed
    this.stash=[null,null,null];     // the three records $6F80/$DDD8 hold
    this.loads=0;
  }
  /* $9203 + the pack's own stub.  `bonus` is $847E bit 6 and `tcd` is the
     treasure countdown $84BA at the moment of the load. */
  load(want, bonus, tcd, rng){
    /* the deck: advance to the next block whose flag matches.  Block 0 is
       the only $80; 1..30 are all $C0.  PROVISIONAL -- running off the end
       of the tape leaves the ORIGINAL sitting in the ROM loader for ever
       (level 128 reports NOMATCH); a player would rewind, and the next $C0
       block after a rewind is block 1, so that is what this does. */
    let p = this.pos;
    for(;;){ p++; if(p>=PACK_COUNT) p = (want===0x80) ? 0 : 1;
             if((p===0)===(want===0x80)) break; }
    this.pos=p; this.loads++;
    if(want===0x80){                              // +$00D / +$010
      this.mask=0x80; this.want=0xC0;
      this.stash=[null,null,null];
      return null;                                // pack 0 plays record 0
    }
    const held=[0,0,0];                           // C, D, E as the stub holds them
    const pick=()=>{ let v; do{ v=rng()&7; }
                     while(v===held[0]||v===held[1]||v===held[2]); return v; };
    held[0]=pick();                               // +$01C, ALWAYS drawn
    if(bonus) held[0]=8+(rng()&1);                // +$026, overwrites it
    held[1]=(!bonus && tcd<4) ? 8+(rng()&1) : pick();   // +$02C..+$038
    held[2]=pick();                               // +$03C
    const d4=pick();                              // +$040
    this.stash=[packSub(p,d4), packSub(p,held[2]), packSub(p,held[1])];
    this.mask=7;                                  // +$078
    return packSub(p,held[0]);                    // +$070: played at once
  }
}

/* =======================================================================
   SOUND -- the AY-3-8912 driver, $BA2B / $BADB / $BB35 / $BB96
   =======================================================================
   THE GAME SHIPS TWO COMPLETE, MUTUALLY EXCLUSIVE SOUND DRIVERS and picks
   one at boot by rewriting nine bytes.  Block A runs a $7FFD PAGING PROBE
   ($CE50, LDIR'd to $61A8 because $4000-$7FFF is the one window a 128K
   never pages, called at $C238), compares the read-back with $D1 and stores
   the answer in RAM $FFFD ($C242).  $BEB9 CALL $BF21 then patches:

     ($FFFD) != 0  (128K)  $B8B5 := C9, $B8CC := C9      kill the BEEPER
     ($FFFD) == 0  (48K)   $BADB $BA01 $BBA7 $BBBC := C9 kill the WHOLE AY
                           $BA2B := JP $B92B             ... and repoint the
                                                             dispatcher

   MEASURED, not read: booting the real game from $8400 with ($FFFD) forced
   to 0, 1 and $2A and diffing all of RAM gives exactly those nine bytes
   (plus $FFFD itself), and the $2A boot is byte-identical to the 128K one.
   RAM $FFFD is NOT the AY register-select PORT of the same number: the port
   is written at $BB9D (`LD BC,$FFFD / OUT (C),A`), the RAM byte is read at
   $BF21 and $9D0A.  Nothing in the image counts players -- an earlier note
   in this file had that wrong.

   WHICH PATH THIS ENGINE SHIPS: THE 48K BEEPER.  The tape is a 48K tape and
   the machine it was bought for answers 0 to the probe, so the beeper is
   what the owner hears and it is the branch every gate in this project is
   now measured on.  THE AY DRIVER BELOW IS KEPT, VERIFIED AND INERT: it is
   selected by the game's own probe flag (`SOUND_MODE`, this port's RAM
   $FFFD) exactly as the original selects it, `python tools/soundgate.py all`
   still runs it against the real Z80's OUTs, and nothing about it has been
   deleted.  Set SOUND_MODE to SOUND_128K and this engine is the 128K again.

   AND IT IS NOT ONLY AN AUDIO DIFFERENCE.  Measured on the real Z80 from
   build/state_48k.pkl and its AY twin, 200 passes a cell: the beeper branch
   costs 4.04..5.00 frames a pass against the AY's flat 4.00 (see the clock
   note at the top of this file), and a banner pickup blocks 76.0 video
   frames on the beeper against 103.8 on the AY -- and advances the game's
   own $8497 by FOUR, not by 104, because the tune runs with interrupts
   disabled.  Both are ported below.

   THE CLOCK.  $BADB has exactly one call site, $A2A5, inside the IM2
   handler ($DADA -> JP $A29F).  So one row of an effect is one VIDEO FRAME,
   not one main-loop pass.  Measured over 60 driven passes: 237 ticks, per
   pass {3: 4, 4: 55, 5: 1}, and on the interrupt's own frame grid every
   frame carries exactly one tick except 3 frames in 240 that carry none
   (the DI at $9CD8 drops one per pass and $9CF8's hand CALL $A29F pays it
   back).  This engine ticks FRAMES_PER_PASS times a pass -- one before
   hudPass and three at the bottom, the same split frameCtr uses, which was
   measured at $B6DA.  tools/soundgate.py substitutes the original's own
   per-pass tick count so the differential tests the RULES and not this
   approximation, exactly as p2gate.py substitutes the frame clock.

   AY CLOCK: 1,773,400 Hz = the 128K CPU / 2.  NOT fitted to the note table,
   which is degenerate: the game's chromatic table at $6A4E is equal
   tempered to 0.02 semitone at 1,800,000 Hz and equally well at 1,700,000,
   because round(K*2^(i/12)) fits every candidate with a different implied
   reference pitch.  The clock is settled by the paging probe instead: the
   AY code only ever runs on a machine whose $7FFD pages, i.e. a 128K
   family machine, where the AY is clocked at CPU/2.  The tunes therefore
   sit ~26 cents flat of A440 on real hardware, which is what the hardware
   does; nothing here is tuned to make it sound right.                    */
/* THIS PORT'S RAM $FFFD.  The original writes it at $C242 from the paging
   probe's answer and reads it at $BF21 (which driver to patch in) and again
   at $9D0A (which blocking pause to run).  This engine has no probe -- it
   is not a Spectrum -- so it carries the answer the owner's machine gives,
   and every rule below that the original gates on ($FFFD) is gated on this.
   build/state_48k.pkl is the boot in which the game's OWN probe wrote 0. */
const SOUND_48K = 0, SOUND_128K = 1;
let SOUND_MODE = SOUND_48K;                 // the SHIPPED branch

const SFX = A.sfx || null;                  // build/sfx_data.json
const AY_CLOCK = 1773400;                   // 128K CPU/2 -- see above
const AY_STREAMS = SFX ? SFX.effects.map(e => e.rows) : [];
const SFX_COUNT = AY_STREAMS.length;        // 18, and the table proves it

/* -----------------------------------------------------------------------
   $BA2B / $BADB / $BB35 -- THE REGISTER-LEVEL DRIVER.
   Its whole output is a stream of (simulated frame, register, value)
   triples, which is the same thing a .psg file holds and the same thing
   tools/soundgate.py reads off the real Z80.  Nothing here touches Web
   Audio; the bridge below turns the stream into sound.                   */
class SfxDriver{
  constructor(){
    /* $BDB3, three records of 4 bytes: +0/+1 data pointer, +2 AGE (the
       priority), +3 the effect id.  $BDC0 the busy mask, TWO bits per
       channel (c and c+3).  $BDC1 the R7 shadow.  $BDE9 the tune id. */
    this.ch = [0,1,2].map(()=>({row:0, id:0, live:false}));
    this.busy = 0;                       // $BDC0
    this.tune = 0;                       // $BDE9: 1 = intro, 2 = treasure
    this.frame = 0;                      // the simulated video frame
    this.log = [];                       // (frame, reg, value), in order
    this.logging = true;
    /* $BAB2 LD A,R -- the refresh register, which is Q18's unreproducible
       source.  THIS IS A SEPARATE STREAM from rand8(): the game draws it
       inside the sound dispatcher, so letting it share the gameplay
       generator would make the sound perturb the simulation.  Sound must
       never feed back into gameplay, which is also why it is not in
       fingerprint().  `rngSeed` is what reset() restores -- see the
       reseed beside `sound.frame = 0` there. */
    this.rng = this.rngSeed = 0x1D2A6F3B;
    this.silence();                                        // $BA01
  }
  /* $BA01 -- R7 = $38, R8/R9/R10 = 0, then $BDB1..$BDC1 zeroed (LD (HL),0 +
     LDIR $10) and $BDE9 = 0.  Called from $894B, the banner's own reset. */
  silence(){
    this.w(7,0x38);                                        // $BA07
    this.w(8,0); this.w(9,0); this.w(10,0);                // $BA0C/$BA12/$BA17
    for (const c of this.ch){ c.row = 0; c.id = 0; c.live = false; }
    this.busy = 0; this.tune = 0;                          // $BA1A..$BA27
  }
  /* $BB96 -- the ONE register writer.  Two OUTs, $BB9D ($FFFD, select) and
     $BBA2 ($BFFD, data); there are no other AY writes in the game. */
  w(reg, val){ if (this.logging) this.log.push([this.frame, reg, val & 0xFF]); }

  /* $BAB2 LD A,R / AND 1 / ADD A,D -- a request for effect 0 is a COIN FLIP
     between effects 0 and 1.  MEASURED on the real Z80: 200 requests for id
     0 gave 100 x $00 and 100 x $01, and ids 2/4/15/17 never move under a
     swept R.  This is why the static scan finds no call site for id 1 and
     why the port must not simply drop it. */
  coin(){ this.rng = (Math.imul(this.rng,1103515245)+12345)>>>0;
          return (this.rng>>>16)&1; }

  /* $BA2B -- ALLOCATE AND START.  23 call sites, ids 0..$11.  Measured in
     isolation at 501..769 T-states = 0.011 video frames: IT DOES NOT BLOCK,
     which corrects NOTES-battery Q10 and two earlier notes in this file. */
  trigger(id){
    if (!SFX_COUNT) return;
    /* $BA31 -- TWO PRE-EMPTION GATES ON THE TUNE, and they are the rule
       nobody had.  Measured: with $BDE9 = 1 three triggers in a row leave
       the busy mask at $00 (every effect DROPPED); with $BDE9 = 2 all three
       land on channel 0 (mask stuck at $09), because $BA38 stuffs the id
       into $BDB6 so the same-id search below always matches channel 0. */
    if (this.tune & 2) this.ch[0].id = id;                 // $BA38
    else if (this.tune & 1) return;                        // $BA3D/$BA41
    /* THREE-TIER ALLOCATION, in this order ($BA45/$BA62/$BA7B):
         1  a record already carrying this id  -> restart it in place
         2  else the first record whose busy bit is clear
         3  else STEAL the record with the LARGEST age; $BA88 `JR c` only
            skips on strictly-less, so a TIE goes to the HIGHEST index.
       All three measured: ages 27/7/2 -> ch0, 2/7/27 -> ch2, 9/9/3 -> ch1,
       5/5/5 -> ch2, and the same id retriggered at row 10 returns to row 0
       on its own channel rather than doubling up.
       NOTE the match at step 1 is on the id FIELD, not on "playing": after
       $BA01 all three ids are 0, so the first request for id 0 or 1 reuses
       channel 0 without searching.  That is the original's behaviour and
       the isolation timing (501 T against 769 T) shows it. */
    let c = this.ch.findIndex(k => k.id === id);           // $BA4F CP D
    if (c < 0) c = this.ch.findIndex((k,i) => !(this.busy & (1<<i)));  // $BA6B
    if (c < 0){                                            // $BA84 CP D/JR c
      let best = -1, age = -1;
      for (let i=0;i<3;i++) if (this.ch[i].row >= age){ age = this.ch[i].row;
                                                        best = i; }
      c = best;
    }
    this.busy &= ~(9 << c);                                // $BAA4..$BAA8
    /* $BAAD POP AF / AND A / JR nz -- the coin, for id 0 only */
    const real = id === 0 ? this.coin() : id;              // $BAB1..$BAB6
    const k = this.ch[c];
    k.id = real;                                           // $BAB7
    k.row = 0;                                             // $BACD (IX+2) = 0
    k.live = true;
    this.busy |= (9 << c);                                 // $BAD1/$BAD2
  }

  /* $BADB -- ONE VIDEO FRAME of the whole driver, from the ISR at $A2A5.
     Order, and it is load bearing for the differential:
       $BAE0  the TUNE player $BC0C   (not ported -- see below)
       $BAE3  the three effect channels, 0 then 1 then 2
       $BB27  R7 LAST, once, ALWAYS -- even when nothing is playing, which
              is the whole of Q17's "92 writes, only register 7".          */
  tick(){
    /* $BAE7 LD A,(IY+1) / AND 7 -- only the three LOW bits gate the loop */
    let mix = 0x38;                                        // $BAEC/$BAEE
    if (this.busy & 7){
      for (let c=0;c<3;c++){
        /* $BAF9/$BAFD rotate the shadow and the mask; the carry is bit c of
           the mask (ALLOCATED) and $BB03 BIT 2 is bit c+3 (STEP ENABLE). */
        if ((this.busy & (1<<c)) && (this.busy & (8<<c)))
          mix = this.step(c, mix);                         // $BB0A
      }
    }
    /* $BB27 AND $38 -- the three TONE-DISABLE bits are masked to zero, so
       ALL THREE TONES ARE ALWAYS ENABLED and only the noise routing varies.
       ($BB77 RES 7 is therefore dead code.)  Silence comes from volume 0,
       never from the mixer.  Remember the enables are INVERTED: 0 = on. */
    this.w(7, mix & 0x38);                                 // $BB2A/$BB2C
    this.frame++;
  }

  /* $BB35 -- ONE CHANNEL, ONE FRAME.  Two bytes per row, $00 terminates. */
  step(c, mix){
    const k = this.ch[c], rows = AY_STREAMS[k.id];
    if (!rows || k.row >= rows.length){
      /* $BB3B LD A,(HL) / AND A / JR nz -- the $00 END byte: write volume 0
         to this channel and RES 7,(IY+1), which is the channel's ALLOCATED
         bit only.  The STEP-ENABLE bit c+3 is NOT cleared and latches on
         until the next trigger rewrites both -- measured, mask $09 -> $08
