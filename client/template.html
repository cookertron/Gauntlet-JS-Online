         and $08 persisting for twenty passes afterwards.  The row pointer
         is not advanced and the age is not incremented either. */
      this.w(8 + c, 0);                                    // $BB43..$BB4A
      this.busy &= ~(1 << c);                              // $BB3F RES 7
      k.live = false;
      return mix;
    }
    const b0 = rows[k.row][0], b1 = rows[k.row][1];
    this.w(8 + c, b0 >> 4);                     // $BB50 volume -> R(8+ch)
    const np = (b0 & 15) * 2;                   // $BB60 AND 15 / $BB62 ADD A,A
    if (np) mix &= ~(8 << c);                   // $BB66 RES 2 -- noise ON
    this.w(6, np);                              // $BB6A -- EVERY frame, even 0
    /* $BB71 INC A is EIGHT BIT and the widening into HL happens AFTER it, so
       a tone byte of $FF gives period 0, not 1024.  That is reachable, not
       theoretical: id $11 uses $FF in all 8 of its rows and id $0F in 6. */
    const tp = ((b1 + 1) & 0xFF) * 4;                      // $BB7B ADD HL,HL x2
    this.w(2*c, tp & 0xFF);                                // $BB7E..$BB82
    this.w(2*c + 1, tp >> 8);                              // $BB85..$BB87
    k.row++;                                               // $BB8B INC HL x2
    return mix;
  }
  /* how many channels are still stepping -- for the on-page readout only */
  get voices(){ return this.ch.filter(k=>k.live).length; }
}

/* =======================================================================
   THE 48K BEEPER -- $B92B / $B8FB / $B8CC / $B8B0 -- THE SHIPPED DRIVER
   =======================================================================
   This is what the owner's 48K plays and it is a DIFFERENT INSTRUMENT, not
   a different voicing of the AY one.  Three independent mechanisms share
   one bit of one port:

     TONE   $B8FB, ONE (toggles, delay) step per MAIN-LOOP PASS from its
            single call site $9CD9, inside $9CD7 HALT / $9CD8 DI.  An effect
            is a train of n short CHIRPS, one every pass, ~4% audible duty.
            An AY row is one VIDEO FRAME; a beeper row is one PASS.  A port
            that copies the AY row timing is wrong by a factor of four.
     NOISE  $B8CC, one sample per DRAWN OBJECT, called from six sites inside
            the blitter.  A burst is 127 ramp calls and it is over when the
            blitter runs out of objects, so its DURATION IS A LIVE GAME
            VALUE (measured below).
     TUNES  $B8B0/$B8B5 LDIR a $13E-byte two-voice player to $C000 and JP
            into it with interrupts OFF.  Fully blocking: 72.07 and 209.97
            video frames.  These ARE the banner pause on this branch --
            $9D2D's HALT loop is the AY arm and never runs here.

   THE DISPATCHER, $B92B, is what $BA2B becomes.  No allocator, no channels,
   no tiers, no tune gates: a CP chain, eleven ids handled, SEVEN A BARE RET
   at $B98A (1, 3, 5, 9, $0C, $0D, $10).  A new trigger simply overwrites
   $84CF/$84D0 and the old stream is abandoned mid-flight; there is no
   "already playing" test, no age and no steal.  Two consequences the AY
   branch does NOT have, and both close declared defects of this port:

     * $BAB2's `LD A,R` id-0 COIN never executes -- $BA2B is JP $B92B, so
       the whole allocator body is bypassed.  Ids 0 and 1 are deterministic
       here and the substitute coin stream is not used at all.
     * id $0C, the generator spawn ($B0D3), is SILENT.  The substitute RNG
       that the AY register differential made audible (0 spawns on the
       original against 4 in the port over 60 identical passes) has nothing
       to play on this branch, so that leak does not exist here.

   WHAT IS STILL A DECLARED SUBSTITUTE: the NOISE, and only the noise.
   $B8CC is `LD A,R / CP (IY+$53)`, i.e. the Z80 REFRESH REGISTER against a
   level, so WHICH samples toggle is Q18's class and no port can reproduce
   it.  What IS reproduced, and gated: 127 ramp calls, the level ramping
   1->127 (id 0) or 127->1 (id 4) with `AND $7F` and `RET z` at zero, and a
   toggle DENSITY of exactly level/128 -- ENUMERATED on the real Z80 over
   all 256 values of R (`python tools/beepgate.py noise`: level 0 -> 0/256,
   32 -> 32/256, 64 -> 64/256, 127 -> 127/256, and the 128 values with bit 7
   set never toggle because the game contains no `LD R,A`).             */
const BEEP = A.beeper || null;              // build/beeper_data.json
const BEEP_STREAMS = BEEP ? BEEP.streams : {};
const BEEP_SILENT = BEEP ? BEEP.silent : [];
const CPU_HZ = 3500000;                     // a 48K Spectrum's Z80
/* MEASURED, at the port boundary, never hand-counted (manual E3).  The
   half-period is 17*E + 31 T-states where E is the stream's DELAY COUNT --
   not the half-period itself, which is the trap the first write-up fell
   into.  `python tools/beepgate.py fit` sweeps E over 0..255 at C=4 and C
   over 0..255 at E=$17 and compares the RECORDED inter-edge T stamps: 512
   sweep points and all 50 shipped records exact on edge count, on the
   half-period SET (it is a singleton, i.e. the duty is exactly 50%) and on
   the routine's total cost 152 + C*H.  Both 256-wraps (DJNZ with B=0, DEC C
   with C=0) are exact too and neither is reachable from the shipped data. */
const beepHalf = e => 17*(e || 256) + 31;                  // T-states
const beepHz   = e => CPU_HZ/(2*beepHalf(e));
/* WHERE IN A PASS THE TWO TICKS RUN, in VIDEO FRAMES from the loop top
   $8503.  Measured over 38 passes on the real Z80, both idle and holding
   DOWN (`python tools/beepgate.py where`):
       $B8CC first tick   0.044..0.152      last tick   1.125..1.361
       $B8FB the chirp    1.800..1.935 on a 4-frame pass (2.80..2.85 on a 5)
   The chirp sits immediately after the HALT at $9CD7, so it is frame
   aligned by construction and the DI at $9CD8 means an interrupt can never
   land inside it.  The blit runs in the first third of the pass, which is
   why a noise burst armed by the PLAYER'S own move (0.005..0.052) fits
   inside one pass and one armed by the ACTOR update (0.723..0.990) does
   not -- see noiseService(). */
const BEEP_DRAW_LO = 0.15, BEEP_DRAW_HI = 1.36;   // the blit window, frames
/* AND THE SHAPE INSIDE THAT WINDOW, which is NOT uniform and which is the
   whole of a noise burst's duration.  The 127 ramp calls come from the
   blitter, so a burst lasts exactly as long as the blit takes to draw 127
   more objects -- and the blitter does not issue them evenly.  MEASURED as
   the offset, in video frames from $8503, of the call at fraction q of the
   pass's own call count, pooled over idle/down/right, 120 passes a scene
   (`python tools/beepdata.py`, asserted by `python tools/beepgate.py ticks`):

       q     0.00  0.25  0.50  0.75  1.00
       f     0.107 0.264 0.503 0.937 1.307

   The MEDIAN call is at 0.50 frames, not at the window's midpoint of 0.755
   -- the map-tile blitter runs first and fast, and the sprite blitter's
   one-call-per-object arm ($A1DD) is the long tail.  The three scenes agree
   to 0.076 frames at every q but the last (0.126 at q=1.00, the tail, which
   moves with the scroll state).  Shipping the uniform spread instead made a
   burst armed at the top of a pass 0.61 frames long against the original's
   0.49 -- 23% too long, on id 4, which is FIRE and the most frequent effect
   in the game. */
const BEEP_TICK_CURVE = (BEEP && BEEP.noise.tick_curve)
                      ? BEEP.noise.tick_curve.frames : null;
const BEEP_TICK_IDLE  = (BEEP && BEEP.noise.tick_curve)
                      ? BEEP.noise.tick_curve.frames_idle : null;
/* the offset of tick j of n, by linear interpolation between the measured
   points.  j/(n-1) is a FRACTION OF THE PASS'S OWN CALLS, so a scene that
   draws more objects packs them into the same window rather than running
   past its end -- which is what the census actually does (233..255 calls in
   a window that does not move).

   TWO CURVES, PICKED BY WHETHER A PLAYER MOVED THIS PASS.  A walking pass
   issues its first $B8CC 0.128 frames in and a standing one 0.067, and the
   gap holds at 0.056..0.065 for the whole first half of the blit.  The
   split is not a guess: at every q up to 0.50 that gap is 2 to 18 times the
   spread BETWEEN the four walking scenes (down/left/right/up) at the same
   q.  Past q~0.6 it stops winning -- the tail moves with the scroll state
   by up to 0.19 frames -- and that is declared, not smoothed: a burst of
   127 calls out of ~249 objects reaches q~0.51, which is inside the half
   that holds.  Both curves and both spreads are in build/beeper_data.json
   (`python tools/beepdata.py`, gated by `python tools/beepgate.py ticks`). */
function beepTickAt(u, walking){
  const c = (walking === false && BEEP_TICK_IDLE) ? BEEP_TICK_IDLE
                                                  : BEEP_TICK_CURVE;
  if (!c) return BEEP_DRAW_LO + (BEEP_DRAW_HI-BEEP_DRAW_LO)*u;
  const n = c.length - 1, x = Math.min(n, Math.max(0, u*n));
  const i = Math.min(n-1, Math.floor(x));
  return c[i] + (c[i+1]-c[i])*(x-i);
}
/* the pass's TAIL: $9CD8 DI, the ISR paid back by hand at $9CF8, and the
   three shadow-screen copies.  The tone chirp is at (pass length - this)
   frames from the loop top, because $9CD7's HALT releases on a frame
   boundary and everything after it runs under the DI.  MEASURED DIRECTLY as
   (pass frames - chirp offset) over 60 passes of the differential's own
   scenario: 2.146..2.185, and W2 on its own is 2.166 (sd 0.008 over 360
   passes).  The residual is the phase p, which this engine has no T-state
   clock to model -- so the chirp lands within 0.05 of a video frame of the
   original's and tools/beepgate.py's tolerance is 0.06. */
const BEEP_PASS_TAIL = 2.166;
const BEEP_TONE_AT = FRAMES_PER_PASS - BEEP_PASS_TAIL;      // 1.81
/* $B8CC calls per pass = the DRAWN OBJECT count.  Measured 250 with 63
   actors and nothing moving, 233..255 holding DOWN; the fixed (map tile)
   part takes a few discrete values with the scroll state, which this
   engine does not model -- PROVISIONAL, and it only sets how long a noise
   burst lasts, never what the game does. */
const BEEP_TILE_TICKS = 183;

class BeeperDriver{
  constructor(){
    this.steps = 0;              // $84CF (IY+$50) -- tone steps remaining
    this.rows = null;            // $84D0/$84D1 -- the stream pointer
    this.row = 0;
    this.level = 0;              // $84D2 (IY+$53) -- noise level AND threshold
    this.ramp = 0;               // $B8E2, self-modified: +1 ($3C) or -1 ($3D)
    this.ticks = 0;              // ramp calls left in this burst (127 max)
    this.spk = 0;                // bit 4 of $84CA, the port-$FE shadow
    this.last = 0;               // the last level that reached the LOG
    this.pending = [];           // this pass's edges, before the sort
    this.chirp = null;           // [start, end] of this pass's tone burst
    this.armPhase = 0;           // where in the pass the noise was armed
    this.frame = 0;              // the simulated video frame at the pass top
    this.log = [];               // (frameFloat, level) SPEAKER EDGES, in order
    this.logging = true;
    this.blocks = [];            // (frameFloat, tune) the two blocking tunes
    /* THE DECLARED SUBSTITUTE, and it is the only one left in sound on this
       branch.  $B8CC's draw is `LD A,R`; this is a SEPARATE stream from
       rand8() so that sound can never perturb the simulation, exactly as
       the AY driver's id-0 coin was.  Its seed is a constant, so the port's
       noise texture is the same every run where the original's is not.
       `rngSeed` is what reset() restores -- see the reseed beside
       `sound.frame = 0` there. */
    this.rng = this.rngSeed = 0x5F3759DF;
  }
  /* $BA01 is patched to a RET on this branch: NOTHING SILENCES THE BEEPER.
     An effect in flight survives a level change, a death and a game over --
     measured, and it is a real behavioural difference from the AY, where
     $894B's CALL $BA01 stops all three channels.  This method therefore
     resets only what a fresh machine would have. */
  silence(){ this.steps = 0; this.rows = null; this.row = 0;
             this.level = 0; this.ticks = 0; }
  /* THE SPEAKER, WRITTEN THREE WAYS AND SORTED ONCE.  The three mechanisms
     do not run in time order inside a pass -- the blit's noise samples are
     at 0.15..1.36 frames, the tone chirp at 1.81, and the ISR's own border
     write ($A2B1 CALL $B4F9, `LD ($84CA),A / OUT ($FE),A` with A = 0 or 7)
     lands on every video-frame boundary -- so edges are buffered per pass
     and flushed in frame order by endPass().  Only CHANGES of bit 4 reach
     the log, which is what tools/beepgate.py compares against the real
     Z80's own OUTs to port $FE.
     `src` is carried for attribution only; the differential compares tone
     edges exactly, noise edges by COUNT (the draw is `LD A,R`) and the tune
     as a block. */
  edge(f, lvl, src){ this.pending.push([f, lvl, src || 'tone']);
                     this.spk = lvl; }
  /* the ISR pulls bit 4 LOW fifty times a second, whatever the driver left
     there.  Consequences, both measured and both real: every chirp starts
     from 0 and its FIRST EDGE IS ALWAYS A RISE; and a noise burst, whose
     toggle count is data-dependent and often ODD, gets cut low at the next
     frame boundary -- an extra edge that belongs to the effect and is in no
     table.  Not inside the tone chirp or a tune, though: both run under the
     DI at $9CD8, so an interrupt cannot land in them. */
  endPass(f0, frames){
    const p = this.pending;
    for (let k=1;k<=frames;k++){
      const fB = f0 + k;
      if (this.chirp && fB >= this.chirp[0] && fB <= this.chirp[1]) continue;
      p.push([fB, 0, 'border']);
    }
    p.sort((a,b) => a[0]-b[0]);
    let lvl = this.last;
    for (const e of p){
      if (e[1] === lvl) continue;
      lvl = e[1];
      if (this.logging) this.log.push([e[0], e[1], e[2]]);
    }
    this.last = lvl; this.spk = lvl;
    p.length = 0; this.chirp = null;
  }

  /* $B92B -- THE DISPATCHER.  Mirrored arm for arm; the id -> stream map is
     parsed out of the game's own CP chain by tools/beepdata.py, so id 8
     ($B93E CP 8 / LD HL,$B9AF, a shot hitting something) cannot go missing
     the way it did in a hand transcription. */
  trigger(id, phase){
    if (!BEEP) return;
    if (id === 4){                                        // $B979 CP 4
      this.armNoise(BEEP.noise.down_level, -1, phase);    // $B97D LD A,$7F
      return;
    }
    if (id === 0){                                        // $B982 OR A
      this.armNoise(BEEP.noise.up_level, +1, phase);      // $B985 LD A,$01
      return;
    }
    const rows = BEEP_STREAMS[String(id)];
    if (!rows) return;                                    // $B98A a bare RET
    /* $B98B LD A,(HL) / LD (IY+$50),A / INC HL / LD ($84D0),HL.  The first
       byte of a stream is its step count and the pointer is byte+1, so a
       NEW TRIGGER REPLACES THE OLD ONE mid-flight -- measured: id $0F three
       steps in, then id $11, leaves steps=4 and the pointer at $B9F9, and
       the six unplayed steps are simply gone. */
    this.rows = rows; this.row = 0; this.steps = rows.length;
  }
  /* $B8E9 / $B8F2 -- arm the noise and SELF-MODIFY $B8E2 to INC A or DEC A.
     (That is a 30th self-modification site for NOTES-battery Q3's list.)
     NOISE AND TONE ARE INDEPENDENT STATE and can sound together; a noise id
     arriving over a playing noise reloads BOTH the level and the direction,
     reversing a sweep mid-flight. */
  armNoise(level, dir, phase){ this.level = level & 0x7F; this.ramp = dir;
                               this.ticks = BEEP.noise.ramp_calls;
                               this.armPhase = phase || 0; }
  /* $B8CC's own draw, as a declared substitute: toggle iff `LD A,R` < level.
     Density level/128 exactly -- enumerated on the Z80 over all 256 R. */
  noiseDraw(){ this.rng = (Math.imul(this.rng,1103515245)+12345)>>>0;
               return ((this.rng>>>16) & 0x7F) < this.level; }

  /* $B8FB -- ONE TONE STEP, ONCE PER PASS, from $9CD9.
     `f0` is the video frame the pass began on.  When nothing is playing the
     original still burns 12,811 T of DEC HL delay from $01EB ($B901); that
     is 0.1833 frames of the pass's own budget and it is charged on BOTH
     branches, so it belongs to the clock, not to this log. */
  toneTick(f0, passFrames){
    if (this.steps <= 0) return;                          // $B8FE OR A / JR nz
    this.steps--;                                         // $B90A DEC A
    const rec = this.rows[this.row++];
    const c = rec[0], e = rec[1];
    /* $B918..$B921: C toggles of bit 4 spaced 17E+31 T apart, the OUT AFTER
       the delay.  Every C in the shipped data is EVEN, so the speaker ends
       the chirp at the level it started on and there is no DC step between
       chirps -- that is a property of the DATA and must not be normalised
       away.  The first edge is always a RISE because the ISR's own border
       write ($A2B1 CALL $B4F9) clears bit 4 fifty times a second. */
    const step = beepHalf(e)/FRAME_T_JS;                  // in video frames
    /* WHERE THE CHIRP SITS, and it is an identity rather than a constant.
       $9CD7 HALT releases at the next video-frame boundary, so the chirp is
       at ceil(p + W1) - p frames from the loop top -- i.e. the WHOLE PASS
       minus its own tail, and the tail ($9CD8 DI, the ISR paid back by
       hand, and the three shadow-screen copies) is a measured constant:
           W2 = 2.166 frames (sd 0.008)   +   ISR ~2000 T = 0.029 frames
       So a four-frame pass puts the chirp at 1.81 and a five-frame pass at
       2.81 -- and both were measured directly (1.800..1.935 and
       2.800..2.854 over 38 passes, `python tools/beepgate.py where`). */
    const at = (passFrames || FRAMES_PER_PASS) - BEEP_PASS_TAIL;
    let f = f0 + at, lvl = this.spk;
    const t0 = f;
    for (let i=0;i<c;i++){ f += step; lvl ^= 1; this.edge(f, lvl, 'tone'); }
    this.chirp = [t0, f];                       // no ISR can land inside it
  }

  /* $B8CC's SERVICE, once per pass, at the blit.  THE 127 RAMP CALLS ARE NOT
     THE DRIVER'S TO SCHEDULE -- they are made by the BLITTER, one per drawn
     object, so a burst simply consumes the calls the blit was going to make
     anyway and it ends when it has had 127 of them.  That is why its
     duration is a LIVE GAME VALUE and why the two earlier write-ups each
     reported a different number as "the" duration; both are real.  MEASURED
     on the real Z80 over 220 passes holding DOWN, with the arm phase in
     VIDEO FRAMES from the loop top (`python tools/beepgate.py burst`):
         armed at 0.098 frames  ->  127 ticks in 0.493 frames =  9.8 ms
         armed at 1.30..1.51    ->  127 ticks in 4.10..4.37   = 82..87 ms
     (tools/beepgate.py prints that phase as a FRACTION OF THE PASS, 0.02 and
     0.26, which is the same instant in different units and is the mix-up
     that made an earlier comparison of this routine look broken.)

     So this walks the pass's own object list in issue order, skipping the
     objects the blit has already drawn by the time the trigger landed, and
     stops when the ramp reaches 0 or the objects run out -- the remainder
     waits for the NEXT pass's blit, which is exactly the 4.3-frame case. */
  noiseService(f0, objects, walking){
    if (this.ticks <= 0 || this.level === 0) return;
    const ph = this.armPhase || 0;
    this.armPhase = 0;              // the next pass's blit starts at the top
    const n = Math.max(1, objects|0);
    /* AND THE BURST STRETCHES THE BLIT IT RIDES ON.  The tick curve is
       measured on SILENT passes, where $B8CC is 68 T ($B8DD OR A / RET z
       exits early).  While the ramp is armed the routine always takes a
       longer arm -- 96 T when the compare says don't toggle, 135 T when it
       does -- so every ramp call hands the rest of the blit 28 or 67 T it
       would not otherwise have spent, and the objects after it are drawn
       later.  ENUMERATED on the real Z80 over all 256 values of R
       (`python tools/beepgate.py noise`), so these are the routine's own
       three costs and not a fitted constant.
       Cross-check, and it is the reason this term exists: a full 127-call
       ramp is ~63 toggles and ~64 not, i.e. 63*67 + 64*28 = 6,013 T =
       0.086 video frames -- and the same pass measured loud against its own
       quiet neighbour stretches by +0.087 at the point the ramp ends
       (`python tools/beepgate.py ticks`). */
    let stretch = 0;                            // video frames added so far
    this.rampCalls = 0; this.rampTogs = 0;      // for the pass cost model
    for (let j=0;j<n;j++){
      // n==1 -> the first object
      const f = beepTickAt(n > 1 ? j/(n-1) : 0, walking) + stretch;
      if (f < ph) continue;         // this object was drawn before the arm
      const tog = this.noiseDraw();
      this.rampCalls++; if (tog) this.rampTogs++;
      if (tog) this.edge(f0+f, this.spk ^ 1, 'noise');   // $B8D3..$B8DB
      stretch += (tog ? 67 : 28)/FRAME_T_JS;    // 135 T or 96 T against 68 T
      /* $B8DD LD A,($84D2) / OR A / RET z / INC-or-DEC A / AND $7F.  Exactly
         127 calls to silence in either direction, so the level set is
         0..127 and the ramp is a rising or falling RASP, not a tone. */
      this.level = (this.level + this.ramp) & 0x7F;
      this.ticks--;
      if (this.level === 0){ this.ticks = 0; break; }
      if (this.ticks <= 0) break;
    }
  }

  /* $B8B0 / $B8B5 -- THE TWO BLOCKING TUNES, and on this branch they ARE
     the banner pause.  Recorded as a BLOCK plus its decoded rows: each row
     is (reload1, reload2, length), measured off the running original by
     tools/beepdata.py, and a voice's pitch is clock/(2*96*reload) because
     the interleave loop is 96 T and one toggle happens per underflow.
     Reload 1 is the game's REST (note byte $29, one PAST the 53-entry table
     at $C0D4) and is 18,229 Hz -- the code only mutes when BOTH voices
     rest, so a one-voice rest really does put an ultrasonic square on the
     speaker.  That is what the hardware does; it is not tuned away here. */
  tune(f0, which){
    const tn = BEEP.tunes[which];
    const frames = tn.total_t/FRAME_T_JS;
    if (this.logging) this.blocks.push([f0, which, frames]);
    /* the tune owns the CPU with interrupts OFF for all 72.07 (or 209.97)
       frames -- measured: $8497 advances by ZERO through it -- so no border
       write can land inside it.  endPass() only synthesises the pass's own
       four frame boundaries, which are all BEFORE $9D01, so nothing has to
       be suppressed; what does have to happen is the ONE clear that follows
       it, when $C016 EI lets the ISR run again. */
    /* THE INTERLEAVE, transcribed from $C085..$C0B5 and gated on the OUT
       COUNT.  One turn is 96 T and does exactly TWO writes to port $FE:
       voice 1's speaker state, then 48 T later voice 2's.  A voice toggles
       when ITS counter underflows -- E reloaded from IXH (= reload1), L from
       H (= reload2) -- and both counters and both speaker states are reset
       at the top of every row ($C074..$C083: A and A' both loaded from
       $C01A = $00, E and L both 1 from $C03C LD L,1).  The BOTH-REST row
       takes $C0B6 and writes nothing at all.
       CROSS-CHECKED, and this is the invariant that makes the transcription
       safe: 2 * (turns counted at $C087) == (writes to $FE counted at the
       PORT) -- 79,872 for the banner tune and 292,864 for the level one,
       both exact (tools/beepdata.py asserts it).
       WHAT YOU CANNOT DO is read the notes off this edge train: at 48/144 T
       it is an 18 kHz interleave CARRIER with the two voices modulating it,
       which is exactly the collapse manual 11.3(c) predicts.  The pitches
       are in the ROWS, sampled at $C081 on the running original. */
    for (const r of tn.rows){
      if (!r.turns) continue;                      // $C0B6, genuinely silent
      let v1 = 0, v2 = 0, e = 1, l = 1;
      const base = f0 + r.t/FRAME_T_JS;
      for (let k=0;k<r.turns;k++){
        const t = base + k*BEEP.tune_loop_t/FRAME_T_JS;
        this.edge(t, v1, 'tune');                  // $C089 OUT ($FE),A
        if (--e === 0){ e = r.reload1; v1 ^= 1; }  // $C08D LD E,IXH / XOR D
        this.edge(t + BEEP.tune_out2_t/FRAME_T_JS, v2, 'tune');  // $C095/$C0AB
        if (--l === 0){ l = r.reload2; v2 ^= 1; }  // $C097 LD L,H / XOR D
      }
    }
    /* the routine returns with the speaker wherever the last write left it,
       and the ISR's border write pulls it low again on the next video frame
       ($C016 EI / RET, then $A2B1 CALL $B4F9).  The exact moment is inside
       one frame and is not modelled; that the speaker RETURNS LOW is. */
    this.edge(f0 + frames, 0, 'border');
    return frames;
  }
  /* the on-page readout only: is anything audible right now */
  get voices(){ return (this.steps>0?1:0) + (this.ticks>0?1:0); }
}

/* -----------------------------------------------------------------------
   AN AY-3-8912, at sample level.  Tone, noise, the hardware envelope and
   the INVERTED mixer, from the datasheet formulae the manual quotes:
       tone     f = clock / (16 * TP),  TP a 12-bit period, 0 behaves as 1
       noise    f = clock / (16 * NP),  NP 5 bits
       envelope one 16-step ramp in clock / (256 * EP)
       R7       bits 0..2 disable tone A/B/C, bits 3..5 disable noise;
                0 = ENABLED
       R8..R10  volume 0..15, or bit 4 = follow the envelope
   THE ENVELOPE AND R11/R12/R13 ARE IMPLEMENTED BUT UNEXERCISED BY THIS
   GAME: over 3,420 measured frames covering all 18 effects and both tunes
   the original never selects R11, R12 or R13 and never sets bit 4 of a
   volume, so every ramp you hear is the CPU writing a new level each frame.
   They are here because a partial chip is a chip that lies about what it
   is; the differential proves the game does not use them.

   The chip runs at clock/8 internally (221,675 Hz) and each output sample
   is the MEAN of the internal steps it spans, not a point sample.  That is
   deliberate: tone period 0/1 puts a 110 kHz square on channel A (the
   "noise only" rows), and point sampling would alias it straight down into
   the audible band as a whine that is not in the original.               */
class AyChip{
  constructor(sampleRate, clock){
    this.sr = sampleRate; this.clock = clock || AY_CLOCK;
    this.stepsPerSample = (this.clock/8)/this.sr;
    this.frac = 0; this.last = 0;
    this.reg = new Uint8Array(16);
    this.tc = [0,0,0]; this.to = [1,1,1];
    this.nc = 0; this.lfsr = 1; this.no = 1;
    this.ec = 0; this.estep = 0; this.ehold = false; this.eatt = false;
    this.evol = 0;
    /* the AY-3-8910's 16 logarithmic levels, normalised.  Each step is
       about -1.5 dB, i.e. amplitude ratio 2^(-1/4) per level. */
    this.vt = new Float32Array(16);
    for (let i=0;i<16;i++) this.vt[i] = i === 0 ? 0 : Math.pow(2, (i-15)/4);
  }
  write(r, v){
    r &= 15; v &= 0xFF;
    this.reg[r] = v;
    /* a write to R13 RESTARTS the envelope, whatever value it carries */
    if (r === 13){ this.estep = 0; this.ehold = false; this.ec = 0;
                   this.eatt = !!(v & 4);
                   this.evol = this.eatt ? 0 : 15; }
  }
  period(lo){ return (this.reg[lo] | (this.reg[lo+1]<<8)) & 0xFFF; }
  /* one internal step = one count of clock/8 */
  chipStep(){
    for (let c=0;c<3;c++){
      const p = this.period(2*c) || 1;          // period 0 behaves as 1
      if (++this.tc[c] >= p){ this.tc[c] = 0; this.to[c] ^= 1; }
    }
    const np = (this.reg[6] & 31) || 1;
    if (++this.nc >= np*2){                     // f = clock/(16*NP)
      this.nc = 0;
      /* the 17-bit LFSR, taps 0 and 3 -- the standard AY noise generator */
      const bit = ((this.lfsr ^ (this.lfsr>>3)) & 1);
      this.lfsr = (this.lfsr>>1) | (bit<<16);
      this.no = this.lfsr & 1;
    }
    /* the envelope: 16 steps, one every clock/(16*EP), i.e. a whole ramp in
       clock/(256*EP), with R13's four bits read as continue/attack/
       alternate/hold.  The eight reachable shapes are the datasheet's. */
    const ep = ((this.reg[11] | (this.reg[12]<<8)) & 0xFFFF) || 1;
    if (!this.ehold && ++this.ec >= ep*2){
      this.ec = 0;
      const sh = this.reg[13] & 15;
      const cont = sh & 8, alt = sh & 2, hold = sh & 1;
      if (++this.estep > 15){
        if (!cont){ this.ehold = true; this.evol = 0; }
        else {
          this.estep = 0;
          if (alt) this.eatt = !this.eatt;
          if (hold){ this.ehold = true; this.estep = 15; }
        }
      }
      if (!(this.ehold && !cont))
        this.evol = this.eatt ? this.estep : 15 - this.estep;
    }
    const mixer = this.reg[7];
    let out = 0;
    for (let c=0;c<3;c++){
      /* INVERTED: a SET bit disables.  (tone|dis) & (noise|dis) is the
         chip's own AND of the two generators. */
      const t = ((mixer>>c) & 1) | this.to[c];
      const n = ((mixer>>(c+3)) & 1) | this.no;
      if (!(t & n)) continue;
      const v = this.reg[8+c];
      const lvl = (v & 16) ? this.evol : (v & 15);
      out += this.vt[lvl];
    }
    return out/3;
  }
  render(buf, off, n){
    for (let i=0;i<n;i++){
      this.frac += this.stepsPerSample;
      const k = this.frac|0; this.frac -= k;
      if (k){ let a = 0; for (let j=0;j<k;j++) a += this.chipStep();
              this.last = a/k; }
      buf[off+i] = this.last;
    }
  }
}

/* -----------------------------------------------------------------------
   THE BEEPER, at sample level.  One bit, so there is no chip to model --
   only the square wave the edge stream describes.  What DOES need care is
   the same thing the AY needed: two of the eleven pitches in the game's own
   data are at or beyond the top of hearing (15,086 and 21,341 Hz, and ids 2
   and $0A END there), and the tunes put an 18,229 Hz REST on the other
   voice, so a point-sampled square would fold all of that straight into the
   audible band as a whine that is not in the original.

   Each output sample is therefore the EXACT MEAN of the square over the
   sample's own interval -- a box integral, which is cheap here because the
   edge times are exact rationals rather than a simulated counter.  A chirp
   whose half-period is shorter than a sample simply averages towards zero,
   which is what a speaker cone does with it.

   Loudness and ULA contention are NOT modelled IN THE AUDIO and that is
   declared: the real speaker's excursion is not linear in the duty cycle,
   and contention would stretch the 48 T write cadence of the tunes.
   The PASS CLOCK is a separate question and does model contention now --
   see the CLK block -- but the beeper's own loops live above $8000, where
   there is nothing to contend, so this stays true either way.            */
/* ADDED, not ported: THE SPEAKER, as distinct from the VOLTAGE.  The chip
   below reproduces bit 4 of $FE exactly -- a mathematically perfect square
   wave -- but nobody ever HEARD that: the real machine played it through a
   ~4 cm cone in a plastic case, which mechanically low-passed everything.
   Rendering the raw square into modern hardware is arguably LESS faithful
   to the experience, and it is measurably harsher: the edges carry
   fold-back aliasing, and small laptop drivers buzz and break up on
   full-bandwidth squares (reported from play on an Acer Nitro 5 as
   "very crackly", surviving every scheduling and buffering fix, because
   the crackle was in the waveform's own top octaves).  True runs the
   render through a 2nd-order low-pass at 4.2 kHz -- the same class of
   speaker model mature Spectrum emulators apply -- and false is the raw
   voltage, live-toggleable (__GAUNTLET__.speakerFilter) so the two can be
   A/B'd mid-game.  The dc=false exactness path and every edge-stream gate
   are upstream of this and unaffected either way. */
let SPEAKER_FILTER = true;
class BeeperChip{
  constructor(sampleRate, dc){
    this.sr = sampleRate; this.lvl = 0;
    /* A DC BLOCKER, because the speaker is a CONE and not a voltmeter.  Bit
       4 of $FE is a level, not a signal: between effects the ISR holds it
       LOW for tens of thousands of samples, and rendering that as a constant
       -0.5 would put an enormous DC step at the start and end of every
       effect and make silence the loudest thing in the file.  A real
       speaker (and every amplifier in front of it) is AC coupled, so this
       is the one-pole high pass that models it:
           y[n] = x[n] - x[n-1] + R*y[n-1],   R = 1 - 2*pi*fc/sr, fc = 20 Hz
       Constant in -> zero out; a 1,588 Hz square passes at 0.998 of unity.
       Pass dc=false to see the raw duty cycle, which is what the exactness
       check in tools/headless.js measures. */
    this.dc = dc !== false;
    this.R = 1 - 2*Math.PI*20/sampleRate;
    this.px = 0; this.py = 0;
    /* the SPEAKER MODEL's biquad (RBJ low-pass, fc 4.2 kHz, Q 0.7071),
       transposed direct form II; state persists across render() calls the
       same way px/py do, so buffer joins stay continuous.  The state is
       fed even when SPEAKER_FILTER is off, so a live toggle never thumps. */
    const w0 = 2*Math.PI*4200/sampleRate, cw = Math.cos(w0),
          al = Math.sin(w0)/(2*0.7071), a0 = 1 + al;
    this.fb0 = ((1-cw)/2)/a0; this.fb1 = (1-cw)/a0; this.fb2 = this.fb0;
    this.fa1 = (-2*cw)/a0;    this.fa2 = (1-al)/a0;
    this.z1 = 0; this.z2 = 0;
  }
  /* `edges` is a sorted list of [timeSeconds, level] relative to `t0`; every
     one strictly inside [t0, t0 + n/sr) is consumed.  Returns the index of
     the first edge NOT consumed. */
  render(buf, off, n, t0, edges, ei){
    const dt = 1/this.sr;
    for (let i=0;i<n;i++){
      const a = t0 + i*dt, b = a + dt;
      let acc = 0, cur = a;
      while (ei < edges.length && edges[ei][0] < b){
        const e = edges[ei];
        if (e[0] > cur){ acc += this.lvl*(e[0]-cur); cur = e[0]; }
        this.lvl = e[1]; ei++;
      }
      acc += this.lvl*(b-cur);
      const v = acc*this.sr;                  // the EXACT duty cycle, 0..1
      if (!this.dc){ buf[off+i] = v - 0.5; continue; }
      const y = v - this.px + this.R*this.py;
      this.px = v; this.py = y;
      const s = this.fb0*y + this.z1;             // the speaker model
      this.z1 = this.fb1*y - this.fa1*s + this.z2;
      this.z2 = this.fb2*y - this.fa2*s;
      buf[off+i] = SPEAKER_FILTER ? s : y;
    }
    return ei;
  }
}

/* -----------------------------------------------------------------------
   THE BRIDGE (manual 11.10, and the one step everyone invents badly).
   The engine drains a whole animation frame's worth of passes in one burst
   -- and on a banner pass it drains 104 VIDEO FRAMES at once -- so playing
   each event on arrival would stack two seconds of sound into one instant.
   EVERY EVENT CARRIES THE SIMULATED FRAME IT HAPPENED ON.  This converts
   that frame number to an AudioContext time and renders the samples for it;
   nothing here is keyed to the display clock.

   VOICE CAP: the number of SCHEDULED BUFFERS is counted against
   ctx.currentTime by dropping those whose scheduled END TIME has passed.
   There is no `onended` bookkeeping anywhere -- that callback may never
   fire if the context is suspended, and then the cap never releases.     */
const SND_LEAD = 0.08;        // seconds of head start given to the first buffer
const SND_LEAD_MAX = 0.24;    // the adaptive ratchet's ceiling -- see `lead`
/* ADDED (this fork): the FIFO transports (worklet/sproc) START at a
   tighter gate than the scheduler's lead.  The scheduler pays DOUBLE for
   optimism (the tear plus a fresh lead of resync silence), so 80 ms is
   its floor; a FIFO underrun recovers inside its own single gap and the
   ratchet then holds the measured need for ever -- so it opens at 50 ms
   (three rAF frames: the FEEDER runs on rAF, so the gate must survive a
   skipped frame -- 30 ms was tried and popped six times in 4 s of tune,
   measured), and a machine that needs more buys it once.  Reported from
   play: action-to-sound latency audibly behind a native emulator's; the
   refill gate IS that latency, every millisecond of it. */
const SND_LEAD_FIFO = 0.05;
const SND_AHEAD = 3.0;        // never schedule further ahead than this
const SND_VOICES = 48;        // the hard cap on LIVE scheduled buffers
/* THE WORKLET -- one continuous stream, the way an emulator does it.
   The scheduled-buffer path below stitches dozens of tiny one-shot
   AudioBufferSourceNodes per second onto a sample grid.  That stitching is
