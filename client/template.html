/* ---- THE JOYSTICK.  controlRead's KEMPSTON arm already reads kb.kempston
   and KEMPSTON_MAP already names the bits ($01 right, $02 left, $04 down,
   $08 up, $10 fire) -- nothing fed it.  A Gamepad does now, through the
   same port byte the original reads, so choosing KEMPSTON in the options
   screen is choosing the joystick and no other code changes.  Polled every
   frame, front end and in-game alike: the options screen needs live pad
   state to know what it can offer, and real play needs it to move the
   player. */
function padBits(p){
  let v = 0;
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  if (ax >  0.4) v |= 0x01;
  if (ax < -0.4) v |= 0x02;
  if (ay >  0.4) v |= 0x04;
  if (ay < -0.4) v |= 0x08;
  const b = p.buttons || [];
  const on = i => b[i] && b[i].pressed;
  if (on(15)) v |= 0x01;   if (on(14)) v |= 0x02;    // the standard d-pad
  if (on(13)) v |= 0x04;   if (on(12)) v |= 0x08;
  /* FIRE and POTION split across the face buttons and shoulders -- testing
     "any button" for fire (as a first cut here once did) would leave
     nothing free for potion, and there is no original mapping to defer to
     for either: the real Kempston port has no button for potion at all
     (see KEMPSTON_POTION), and none of this is read unless the player is
     actually on this method.  Standard Gamepad API order: 0/1/2/3 are the
     four face buttons (A/B/X/Y or the equivalent), 4/5 the shoulders. */
  if (on(0) || on(2) || on(3)) v |= 0x10;             // A, X, Y -- fire
  if (on(1) || on(4) || on(5)) v |= KEMPSTON_POTION;  // B, LB, RB -- potion
  return v;
}
/* THE latest poll -- read by the options screen (to know what it can
   offer) and, through kb.kempston, by real play alike.  A `let`
   module global, not a return value a caller has to remember to store: the
   first cut of this had pollGamepads() only RETURN the result, with the
   page's own frame() loop doing `padStatus = pollGamepads()` as a second
   step -- which anything ELSE calling pollGamepads() (this file's own
   tests included) had no way to know it needed to repeat, so the poll ran,
   and everything that reads padStatus kept seeing the last one. */
let padStatus = {count: 0, names: [], bits: []};
/* Returns the CONNECTED pads, compacted (the Gamepad API's own array is
   sparse and slot-indexed, e.g. [pad, undefined, pad]) -- so "pad 0" and
   "pad 1" mean the first and second controller a player actually plugged
   in, not two fixed API slots most of which are usually empty. */
function pollGamepads(){
  keyboard.kempston = 0;
  const connected = [];
  if (typeof navigator !== 'undefined' && navigator.getGamepads){
    let pads;
    try { pads = navigator.getGamepads(); } catch(e) { pads = null; }
    for (const p of (pads || [])) if (p && p.connected) connected.push(p);
  }
  if (connected[0]) keyboard.kempston = padBits(connected[0]);
  return padStatus = {
    count: connected.length,
    names: connected.map(p => (p.id || 'PAD').slice(0, 11).toUpperCase()),
    bits: connected.map(padBits),

/* =======================================================================

   the sim -- every seat's, this client's included -- is the one the
   relay echoes, so every client steps identical input (readKeys' netDirs

    else if (c < 0x800) out.push(0xC0|(c>>6), 0x80|(c&63));
    else if (c < 0x10000) out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63));
    else out.push(0xF0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63));

       the captured machine holds and what its armour rows and shot tags come
       from. */
    if(s.char!==undefined) game.setCharacter(s.char);
    if(s.char2!==undefined){ const q=game.p; game.p=game.players[1];
                             game.setCharacter(s.char2); game.p=q; }
    if(s.x!==undefined) game.x=s.x; if(s.y!==undefined) game.y=s.y;
    if(s.camX!==undefined) game.camX=s.camX; if(s.camY!==undefined) game.camY=s.camY;
    if(s.map) game.map=s.map.map(r=>r.slice());
    if(s.pass!==undefined) game.pass=s.pass;
    if(s.x!==undefined || s.y!==undefined) game.cameraTarget();
    return game; },
  step(i){ game.onePass(i||{});
    return {x:game.x,y:game.y,camX:game.camX,camY:game.camY,
            blocked:game.lastBlocked,fp:game.fingerprint()}; },
  /* THE TWO-PLAYER STEP.  `i` is player 1's input and `i.p2` player 2's;
     the return carries both blocks so tools/p2gate.py can print the same
     table the real Z80 prints. */
  step2(i){ game.onePass(i||{});
    const row = q => ({x:q.x, y:q.y, health:q.health, score:q.score,
                       keys:q.keys, potions:q.potions, f11:q.f11,
                       p14:q.p14, pend:q.pend, ctl:q.animCtl,
                       slot:q.frameSlot, dir:q.dir,
                       shot:{x:q.shot.x, y:q.shot.y, state:q.shot.state}});
    return {p1:row(game.players[0]), p2:row(game.players[1]),
            camX:game.camX, camY:game.camY,
            tgtX:game.camTgtX, tgtY:game.camTgtY,
            ctr:game.passCtr, actors:game.actors.length,
            fp:game.fingerprint()}; },
};
</script>
